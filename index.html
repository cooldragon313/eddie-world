function makeBagMesh(id){

  pocket.position.set(0, -0.15, 0.17); g.add(pocket);

const buildEddie = (() => {
  const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));

    const skin = LM(SKIN), hair = LM(HAIR), tee = LM(0xf7f6f0), shorts = LM(0x6e7046), sock = LM(0x2a2a2a), shoe = LM(0xf2f2ee), sole = LM(0xc9c9c2);
    const HY = 2.25, NECK = 1.55;

    const partH = (geo, mat, x, y, z, nl) => part(headG, geo, mat, x, y - NECK, z, nl);
    // head: round, a touch wider than tall

    for (const s of [-1, 1]){ const ear = partH(S(0.19, 14, 10), skin, s * 0.9, HY - 0.04, 0.05); ear.scale.set(0.5, 1, 0.8); }
    // hair: one black shell hugging the head (no second layer = no hat brim);
    // short on the sides just by being skin-tight, length only from the tufts on top
    const shellGeo = new THREE.SphereGeometry(0.875, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.56);
    // Fade: black on top blending smoothly into short grey stubble on the sides
    // and back — a gradient in the vertex colours, so there's no seam or "brim".
    {
      const top = new THREE.Color(HAIR), side = new THREE.Color(0x8a7569), c = new THREE.Color();
      const pa = shellGeo.attributes.position, cols = new Float32Array(pa.count * 3);
      for (let i = 0; i < pa.count; i++){
        const y = pa.getY(i) / 0.875;                       // 1 at the crown, ~0 at the edge
        const k = Math.min(1, Math.max(0, (y - 0.35) / 0.35));
        const t = k * k * (3 - 2 * k);
        c.copy(side).lerp(top, t); cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
      }

      }

    }

    const eyes = [], brows = [], glints = [];

      const brow = partH(sbRoundBox(0.26, 0.07, 0.05, 0.03), ink, s * 0.3, HY + 0.24, -0.79, true); brow.rotation.z = s * -0.12;
      const eye = partH(S(0.12, 16, 12), ink, s * 0.29, HY + 0.02, -0.78, true); eye.scale.set(1, 1.05, 0.5);
      const gl = partH(S(0.04, 8, 6), white, s * 0.29 - 0.04, HY + 0.07, -0.84, true);
      eyes.push(eye); brows.push(brow); glints.push(gl);
      const cheek = partH(S(0.11, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffb3a8, transparent: true, opacity: 0.8 }), s * 0.52, HY - 0.15, -0.66, true);
      cheek.scale.set(1, 0.55, 0.35);
    }
    partH(S(0.06, 10, 8), LM(0xe8b48f), 0, HY - 0.1, -0.85, true);                 // nose
    const mouth = partH(new THREE.CircleGeometry(0.17, 20, Math.PI, Math.PI), flat(0x7a2a2a), 0, HY - 0.26, -0.845, true);   // big open smile
    mouth.scale.set(1.15, 0.95, 1); mouth.rotation.y = Math.PI;
    const teeth = partH(new THREE.PlaneGeometry(0.3, 0.06), white, 0, HY - 0.275, -0.85, true); teeth.rotation.y = Math.PI;    // top teeth
    const tongue = partH(new THREE.CircleGeometry(0.07, 14, Math.PI, Math.PI), flat(0xf08a8a), 0, HY - 0.38, -0.849, true);
    tongue.scale.set(1.3, 0.8, 1); tongue.rotation.y = Math.PI;
    // other expressions, hidden until used

    const mouthSad = partH(new THREE.TorusGeometry(0.11, 0.025, 6, 14, Math.PI), flat(0x7a2a2a), 0, HY - 0.33, -0.84, true);
    const mouthSmug = partH(new THREE.TorusGeometry(0.1, 0.025, 6, 14, Math.PI * 0.7), flat(0x7a2a2a), 0.06, HY - 0.24, -0.845, true); mouthSmug.rotation.z = Math.PI * 1.15;
    const happyEyes = [-1, 1].map(s => { const m = partH(new THREE.TorusGeometry(0.09, 0.028, 6, 14, Math.PI), ink, s * 0.29, HY - 0.0, -0.8, true); return m; });

    for (const m of [mouthO, mouthSad, mouthSmug, ...happyEyes, ...tears]) m.visible = false;
    const smileSet = [mouth, teeth, tongue];

    function applyEyes(){

      brows.forEach((b, i) => { const s = i ? 1 : -1; b.position.y = HY + 0.24 - NECK + (surprised ? 0.07 : smug ? (s > 0 ? 0.05 : 0) : expr === 'sad' ? -0.02 : 0); b.rotation.z = s * (expr === 'sad' ? 0.25 : -0.12); });
    }

      set(name){

        smileSet.forEach(m => m.visible = name === 'smile' || name === 'laugh');
        mouthO.visible = name === 'surprised'; mouthSad.visible = name === 'sad'; mouthSmug.visible = name === 'smug';
        tears.forEach(m => m.visible = name === 'sad');

    const torso = part(body, S(0.6, 24, 16), tee, 0, 1.0, 0); torso.scale.set(1.0, 1.08, 0.88);

      part(a, S(0.22, 14, 10), tee, 0, -0.06, 0);

      if (s < 0){ const band = part(elbow, new THREE.TorusGeometry(0.13, 0.04, 8, 16), LM(0xffffff), 0, -0.17, 0); band.rotation.x = Math.PI / 2; }

    const fur = LM(0xff8a2a), fur2 = LM(0xffc83d), face = LM(0xffd84a);
    const ring = part(scarf, new THREE.TorusGeometry(0.42, 0.13, 10, 24), fur, 0, 0, 0); ring.rotation.x = Math.PI / 2 - 0.25;
    for (let i = 0; i < 6; i++){ const a = i / 6 * Math.PI * 2; part(scarf, S(0.1, 10, 8), fur2, Math.cos(a) * 0.42, 0.06, Math.sin(a) * 0.42); }

    bat.position.set(0, -0.61, -0.05); bat.rotation.x = 0.15; (e.arms[1].userData.elbow || e.arms[1]).add(bat);
  }
  attachCosmetics(e.body, cos);
  sbOutline(e.g, 0.035);
  return { group: e.g, legL: e.legs[0], legR: e.legs[1], armL: e.arms[0], armR: e.arms[1], hairParts: [], eddie: e };
}

// Eddie's body language, shared by every level. Call once per frame after
// placing him; it owns legs/knees/elbows/lean/head/face, the caller keeps
// overall position, facing and any special arm pose (bat swing) applied after.
//   o = { t, dt, moving, phase, onGround, down, victory, swinging }
function animateEddie(A, o){
  const e = A && A.eddie; if (!e) return;
  const st = A._anim || (A._anim = { blinkAt: 2, blinkT: -1, mood: '' });
  const [armL, armR] = e.arms, [legL, legR] = e.legs;
  const eL = armL.userData.elbow, eR = armR.userData.elbow, kL = legL.userData.knee, kR = legR.userData.knee;
  for (const j of [legL, legR, kL, kR, eL, eR, e.head]) j.rotation.set(0, 0, 0);
  e.body.rotation.set(0, 0, 0); e.body.position.set(0, 0, 0);
  armL.rotation.z = -0.14; armR.rotation.z = 0.14;
  const t = o.t || 0, p = o.phase || 0, breath = Math.sin(t * 2.1);
  e.torso.scale.set(1 + breath * 0.012, 1.08 + breath * 0.02, 0.88 + breath * 0.01);
  if (o.victory){
    const b = Math.sin(t * 9), up = Math.abs(Math.sin(t * 4.5));
    armL.rotation.x = armR.rotation.x = 0; armL.rotation.z = -2.4 - b * 0.3; armR.rotation.z = 2.4 - b * 0.3;
    eL.rotation.x = eR.rotation.x = 0.6; e.body.rotation.z = b * 0.15; e.head.rotation.z = -b * 0.18;
    legL.rotation.z = -0.15; legR.rotation.z = 0.15; kL.rotation.x = -up * 0.6; kR.rotation.x = -(1 - up) * 0.6;
    e.body.position.y = up * 0.25;
  } else if (o.onGround === false){
    // airborne: tuck the legs, arms out for balance
    legL.rotation.x = 0.45; legR.rotation.x = -0.1; kL.rotation.x = -0.9; kR.rotation.x = -0.5;
    armL.rotation.z = -1.6; armR.rotation.z = 1.6; eL.rotation.x = eR.rotation.x = 0.4;
  } else if (o.moving){
    const sw = Math.sin(p) * 0.85;
    legL.rotation.x = sw; legR.rotation.x = -sw;
    kL.rotation.x = -(Math.max(0, Math.cos(p)) * 1.2 + 0.1);   // the leg swinging forward folds back at the knee
    kR.rotation.x = -(Math.max(0, -Math.cos(p)) * 1.2 + 0.1);
    armL.rotation.x = -sw; armR.rotation.x = sw;
    eL.rotation.x = eR.rotation.x = 1.1;                         // pumping, bent arms
    e.body.rotation.x = -0.16; e.body.rotation.y = sw * 0.1; e.head.rotation.x = 0.1;
    e.body.position.y = Math.abs(Math.cos(p)) * 0.1;
  } else {
    armL.rotation.x = armR.rotation.x = 0;
    eL.rotation.x = eR.rotation.x = 0.25;
    e.body.rotation.z = Math.sin(t * 0.9) * 0.02;
  }
  if (o.swinging){ eR.rotation.x = 0.15; eL.rotation.x = 0.3; }
  if (o.down){ e.body.rotation.x = 0.3; e.head.rotation.x = -0.25; }
  // face: knocked down = startled, winning = big laugh, otherwise a smile; blink now and then
  const mood = o.down ? 'surprised' : o.victory ? 'laugh' : (o.mood || 'smile');
  if (mood !== st.mood){ st.mood = mood; e.face.set(mood); }
  st.blinkAt -= o.dt || 0.016;
  if (st.blinkAt <= 0 && st.blinkT < 0){ st.blinkT = 0; st.blinkAt = 2.5 + Math.random() * 3; }
  if (st.blinkT >= 0){ st.blinkT += o.dt || 0.016; e.face.blink(Math.sin(Math.min(1, st.blinkT / 0.16) * Math.PI)); if (st.blinkT > 0.16){ st.blinkT = -1; e.face.blink(0); } }
}

// ============================================================

// Faces -z, about 2/3 of Eddie's height. Same rig idea as Eddie:

const buildKid = (() => {
  const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  function part(parent, geo, mat, x, y, z, noLine){ const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (noLine) m.userData.noLine = true; parent.add(m); return m; }
  const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);

    // with short tufts sticking up a little on top
    const capGeo = new THREE.SphereGeometry(0.755, 36, 18, 0, Math.PI * 2, 0, Math.PI * 0.5);
    const cap = H(capGeo, hair, 0, HY + 0.02, 0.02); cap.rotation.x = 0.12; cap.scale.set(1.04, 1, 1.02);
    for (let i = 0; i < 7; i++){
      const x = (i - 3) * 0.13;
      const tf = H(new THREE.ConeGeometry(0.09, 0.2, 8), hair, x, HY + 0.38 - Math.abs(x) * 0.25, -0.6 + Math.abs(x) * 0.12, true);
      tf.rotation.x = -1.9; tf.rotation.z = -x * 0.6;                       // fringe tips poking down over the forehead
    }
    for (const [x, z] of [[-0.15, -0.1], [0.12, 0.05], [0, 0.25], [-0.25, 0.2], [0.26, -0.15]]){
      const tf = H(new THREE.ConeGeometry(0.11, 0.24, 8), hair, x, HY + 0.72, z, true); tf.rotation.z = -x * 0.8; tf.rotation.x = z * 0.6;
    }
    // face
    const ink = flat(0x22180f), white = flat(0xffffff), mouthC = flat(0x7a2a2a);
    const eyes = [], glints = [];
    for (const s of [-1, 1]){

      const brow = H(sbRoundBox(0.16, 0.035, 0.03, 0.015), ink, s * 0.24, HY + 0.2, -0.7, true); brow.rotation.z = s * -0.12;
      const b = H(S(0.11, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffa8a0, transparent: true, opacity: 0.7 }), s * 0.42, HY - 0.16, -0.57, true); b.scale.set(1, 0.6, 0.35);

    const mouthO = H(new THREE.CircleGeometry(0.07, 16), mouthC, 0, HY - 0.24, -0.715, true); mouthO.rotation.y = Math.PI; mouthO.scale.set(0.9, 1.2, 1);

    const tears = [-1, 1].map(s => { const m = H(S(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: 0x8fd0f0 }), s * 0.3, HY - 0.12, -0.68, true); m.scale.set(0.8, 1.5, 0.5); return m; });
    const naughtyBrows = [-1, 1].map(s => { const m = H(sbRoundBox(0.2, 0.05, 0.04, 0.02), ink, s * 0.24, HY + 0.19, -0.71, true); m.rotation.z = s * 0.35; return m; });
    // body: white tee with a light-blue print, light-blue shorts with a white stripe
    const torso = part(body, S(0.48, 24, 16), tee, 0, 0.64, 0); torso.scale.set(1.0, 0.95, 0.9);
    const print1 = part(body, new THREE.PlaneGeometry(0.34, 0.08), flat(0x6fb3e0), 0.04, 0.7, -0.44, true); print1.rotation.set(0, Math.PI, 0.5);
    const print2 = part(body, new THREE.PlaneGeometry(0.3, 0.08), flat(0x6fb3e0), 0.1, 0.56, -0.43, true); print2.rotation.set(0, Math.PI, -0.4);
    const shorts = part(body, S(0.45, 22, 14), blue, 0, 0.32, 0); shorts.scale.set(1.08, 0.6, 0.95);
    // arms: shoulder → elbow
    const arms = [-1, 1].map(s => {
      const a = new THREE.Group(); a.position.set(s * 0.44, 0.88, 0); body.add(a);
      part(a, S(0.15, 12, 10), tee, 0, -0.04, 0);
      const up = part(a, S(0.12, 12, 10), skin, 0, -0.14, 0); up.scale.set(1, 1.1, 1);

    const legs = [-1, 1].map(s => {

    part(toy, sbRoundBox(0.26, 0.14, 0.24, 0.05), LM(0x8fd0f0), 0, 0.14, 0.04);

        eyes.forEach(e => e.visible = !happy && !cry); glints.forEach(gl => gl.visible = !happy && !cry);

function buildMom(){
  const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  const part = (p, geo, mat, x, y, z, nl) => { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (nl) m.userData.noLine = true; p.add(m); return m; };
  const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);
  const Cy = (a, b, h, n) => new THREE.CylinderGeometry(a, b, h, n || 16);
  // hair colour runs dark at the roots to ash-blonde at the tips (by height)
  const DARK = new THREE.Color(0x2b1e18), MID = new THREE.Color(0x5a4334), ASH = new THREE.Color(0xc2b3a3);
  const hairMat = LM(0xffffff, { vertexColors: true });
  function hairPiece(p, geo, x, y, z, sx, sy, sz, y0, y1){
    const m = part(p, geo, hairMat, x, y, z); m.scale.set(sx || 1, sy || 1, sz || 1);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();

      if (k < 0.45) c.copy(DARK).lerp(MID, k / 0.45); else c.copy(MID).lerp(ASH, (k - 0.45) / 0.55);

  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);

  // ---- legs: wide trousers, knee, Mary-Jane flats

    part(l, Cy(0.22, 0.25, 0.75), pants, 0, -0.37, 0);
    const kn = new THREE.Group(); kn.position.y = -0.72; l.add(kn);
    part(kn, Cy(0.25, 0.33, 0.66, 18), pants, 0, -0.32, 0);
    const f = part(kn, S(0.15, 16, 10), shoe, 0, -0.7, -0.08); f.scale.set(0.9, 0.45, 1.55);

  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * 0.46, 2.47, 0); body.add(a);
    part(a, S(0.14, 12, 10), top, 0, 0, 0);
    part(a, Cy(0.13, 0.11, 0.55), top, 0, -0.28, 0);

  });
  // three weapons for the right hand (pointing forward when the arm hangs):
  // 熱熔膠條 glue stick, 愛的小手 (a stick with a little hand), 衣架 wire hanger
  const hand = arms[1].userData.elbow, weapons = {};
  { const w = new THREE.Group(); w.position.set(0, -0.52, 0); hand.add(w);
    const st = part(w, Cy(0.05, 0.05, 1.1, 10), LM(0xfff4d6), 0, 0, -0.5); st.rotation.x = Math.PI / 2; weapons.glue = w; }
  { const w = new THREE.Group(); w.position.set(0, -0.52, 0); hand.add(w); const pink = LM(0xff8fb0);

    const th = part(w, Cy(0.025, 0.028, 0.13, 6), pink, -0.13, 0, -1.1); th.rotation.x = Math.PI / 2; th.rotation.y = 0.7;

  // held like a stick: out of the fist, down and a little forward along the forearm
  for (const k in weapons) weapons[k].rotation.x = -1.2;
  let weapon = 'glue';
  const setWeapon = name => { weapon = name; for (const k in weapons) weapons[k].visible = k === name; };

  // phone on a purple lanyard
  const lan = part(body, Cy(0.018, 0.018, 1.0, 6), purple, 0.12, 2.15, -0.38, true); lan.rotation.z = 0.32; lan.rotation.x = 0.05;

  handPhone.userData.screen = phoneScreen;
  // ---- head (pivot at the neck)
  const NECK = 2.72, HY = 0.45;
  const headG = new THREE.Group(); headG.position.y = NECK; headG.scale.setScalar(1.4); body.add(headG);   // storybook: a bit big-headed
  const head = part(headG, S(0.5, 32, 22), skin, 0, HY, 0); head.scale.set(0.94, 1.06, 0.96);
  // hair: ONE piece over the whole head (no seams, so nothing reads as a hat).
  // A sphere a touch bigger than the head; the vertices where the face is get
  // pulled inside the head, which carves a curved hairline. The parting sits a
  // little left of centre, so the hair dips lower over the right temple.
  // Plus a long back curtain and two strands framing the face. One gradient:
  // dark roots → ash-blonde tips.
  const H0 = 0.95, H1 = -1.2, PART = -0.1;
  {
    const geo = new THREE.SphereGeometry(0.525, 96, 64), pos = geo.attributes.position, v = new THREE.Vector3();

    for (let i = 0; i < pos.count; i++){

      const d = (v.x - PART) / 0.43, line = 0.38 - 0.3 * d * d;   // hairline height (arch, highest at the parting)
      // soft edge: vertices sink gradually, so the hairline is smooth, not stepped
      const k = ss((line - v.y) / 0.05) * ss((0.47 - Math.abs(v.x)) / 0.04) * ss((-0.05 - v.z) / 0.06);
      if (k > 0){ v.multiplyScalar(1 - 0.45 * k); pos.setXYZ(i, v.x, v.y, v.z); }
    }
    geo.computeVertexNormals();
    hairPiece(headG, geo, 0, HY, 0.01, 0.98, 1.06, 0.99, H0, H1);
  }
  hairPiece(headG, S(0.56, 26, 20), 0, HY - 0.45, 0.24, 1.04, 1.45, 0.42, H0, H1);
  for (const s of [-1, 1]){
    // long strands framing the face, lying in front of the shoulders
    const fr = hairPiece(headG, S(0.2, 16, 16), s * 0.47, HY - 0.62, -0.08, 0.4, 2.75, 0.4, H0, H1); fr.rotation.z = s * -0.05;
  }
  for (let i = 0; i < 4; i++){   // wavy ends at the back
    const x = (i - 1.5) * 0.24;
    hairPiece(headG, S(0.16, 14, 10), x, HY - 1.2 + Math.abs(x) * 0.12, 0.3, 1, 1.1, 0.75, H0, H1);
  }
  // face
  const ink = flat(0x241812), white = flat(0xffffff), lip = flat(0xc96a6a), mouthDark = flat(0x6e2626);
  const eyes = [], glints = [], brows = [];
  for (const s of [-1, 1]){
    const e = part(headG, S(0.085, 16, 12), ink, s * 0.19, HY + 0.01, -0.46, true); e.scale.set(1.35, 1.0, 0.45); eyes.push(e);
    glints.push(part(headG, S(0.026, 8, 6), white, s * 0.19 - 0.035, HY + 0.045, -0.5, true));
    const la = part(headG, sbRoundBox(0.2, 0.025, 0.02, 0.01), ink, s * 0.19, HY + 0.085, -0.47, true); la.rotation.z = s * -0.12;
    const b = part(headG, sbRoundBox(0.17, 0.03, 0.02, 0.012), flat(0x4a3428), s * 0.19, HY + 0.2, -0.47, true); b.rotation.z = s * -0.08; brows.push(b);
    const bl = part(headG, S(0.075, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffa8a0, transparent: true, opacity: 0.55 }), s * 0.28, HY - 0.12, -0.42, true); bl.scale.set(1.1, 0.55, 0.3);
  }
  part(headG, S(0.03, 10, 8), LM(0xeab89a), 0, HY - 0.09, -0.49, true);
  const mSmile = part(headG, new THREE.TorusGeometry(0.07, 0.018, 6, 14, Math.PI), lip, 0, HY - 0.17, -0.47, true); mSmile.rotation.z = Math.PI;
  const mFrown = part(headG, new THREE.TorusGeometry(0.065, 0.018, 6, 14, Math.PI), lip, 0, HY - 0.23, -0.47, true);
  const mYell = part(headG, new THREE.CircleGeometry(0.075, 18), mouthDark, 0, HY - 0.2, -0.475, true); mYell.rotation.y = Math.PI; mYell.scale.set(1.1, 1.25, 1);
  const mO = part(headG, new THREE.CircleGeometry(0.045, 14), mouthDark, 0, HY - 0.19, -0.475, true); mO.rotation.y = Math.PI;
  const mFlat = part(headG, sbRoundBox(0.1, 0.018, 0.015, 0.008), lip, 0.02, HY - 0.18, -0.47, true);
  const vein = part(headG, new THREE.TorusGeometry(0.05, 0.012, 4, 10), flat(0xd94b3c), 0.3, HY + 0.3, -0.38, true); vein.rotation.y = 0.6;
  let expr = '';
  const eyeY = () => expr === 'suspicious' ? 0.45 : expr === 'shocked' ? 1.35 : expr === 'angry' || expr === 'yell' ? 0.8 : 1.0;
  const face = {
    set(name){
      if (name === expr) return; expr = name;
      const angry = name === 'angry' || name === 'yell', sus = name === 'suspicious', shock = name === 'shocked';
      mSmile.visible = name === 'smile'; mFrown.visible = name === 'angry'; mYell.visible = name === 'yell'; mO.visible = shock; mFlat.visible = sus;
      vein.visible = angry;
      brows.forEach((b, i) => { const s = i ? 1 : -1;
        b.rotation.z = angry ? s * 0.45 : sus ? (i ? -0.25 : 0.05) : shock ? s * -0.25 : s * -0.08;
        b.position.y = HY + (angry ? 0.15 : shock ? 0.25 : sus && i ? 0.23 : 0.2); });
      eyes.forEach(e => e.scale.set(1.35, eyeY(), 0.45));
      glints.forEach(gl => gl.visible = !sus);
    },
    blink(k){ eyes.forEach(e => e.scale.y = eyeY() * (1 - k * 0.9)); },
    get name(){ return expr; },
  };
  face.set('smile');
  sbOutline(g, 0.025);
  // whip pose for the right arm. c = time into one 0.9 s stroke: raise the
  // weapon up behind the head (0–0.45), chop down to the front (0.45–0.6), recover.
  const whipPose = c => {
    const A = arms[1], E = A.userData.elbow, ez = x => x * x * (3 - 2 * x);
    let sh, el;
    if (c < 0.45){ const k = ez(c / 0.45); sh = 0.2 + 3.0 * k; el = 0.3 + 0.6 * k; }
    else if (c < 0.6){ const k = ez((c - 0.45) / 0.15); sh = 3.2 - 2.6 * k; el = 0.9 - 0.8 * k; }
    else { const k = ez(Math.min(1, (c - 0.6) / 0.3)); sh = 0.6 - 0.4 * k; el = 0.1 + 0.2 * k; }
    A.rotation.x = sh; E.rotation.x = el; A.rotation.z = 0.15;
    return c >= 0.45 && c < 0.6;   // true during the chop (for 啪 timing)
  };
  return { g, body, head: headG, arms, legs, torso, face, phone, handPhone, weapons, setWeapon, whipPose, get weapon(){ return weapon; } };
}


function buildAvatar(custom){
  custom = custom || DEFAULT_CUSTOM;
  if (custom.hero !== 'custom') return buildEddieAvatar(custom);   // everyone plays as Eddie
  // Q 版 storybook body: big round head, small round body, stubby limbs.
  // Face points toward -z. Arms/legs are pivot groups at the shoulder/hip so
  // the main loop's rotation.x swings them naturally.
  const g = new THREE.Group();
  const isFem = custom.gender === 'female';
  const M = c => new THREE.MeshLambertMaterial({ color: c });
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  const part = (geo, mat, x, y, z, parent, noLine) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    if (noLine) m.userData.noLine = true;
    (parent || g).add(m); return m;
  };
  const skin = M(custom.skin), shirt = M(custom.shirt), pants = M(custom.pants),
        shoes = M(custom.shoes), hair = M(custom.hairColor);

  // Body
  const torso = part(new THREE.SphereGeometry(0.58, 24, 16), shirt, 0, 1.0, 0);
  torso.scale.set(isFem ? 0.9 : 1.0, 1.1, isFem ? 0.82 : 0.88);
  // Head
  const HEAD_Y = 2.25, HEAD_R = 0.85;
  part(new THREE.SphereGeometry(HEAD_R, 32, 22), skin, 0, HEAD_Y, 0);

  // Face (unlit flat colours, no outline)
  const eyeMat = flat(0x2a1d18), glint = flat(0xffffff), blush = flat(isFem ? 0xff9fb4 : 0xffb3a8);
  for (const s of [-1, 1]){
    const e = part(new THREE.SphereGeometry(0.14, 16, 12), eyeMat, s * 0.29, 2.22, -0.76, g, true);
    e.scale.set(1, 1.35, 0.5);
    part(new THREE.SphereGeometry(0.05, 8, 6), glint, s * 0.29 - 0.045, 2.31, -0.83, g, true);
    if (isFem){
      const lash = part(new THREE.BoxGeometry(0.1, 0.03, 0.03), eyeMat, s * 0.42, 2.37, -0.72, g, true);
      lash.rotation.z = s * -0.5;
    }
    const b = part(new THREE.SphereGeometry(0.11, 12, 8), blush, s * 0.5, 2.03, -0.66, g, true);
    b.scale.set(1, 0.55, 0.35);
  }
  if (custom.expression === 'smile'){
    const smile = part(new THREE.TorusGeometry(0.12, 0.028, 6, 14, Math.PI), flat(0x8a3a2a), 0, 2.02, -0.82, g, true);
    smile.rotation.z = Math.PI;
  } else {
    const m = part(new THREE.SphereGeometry(0.08, 10, 6), flat(0x3a2a22), 0, 1.98, -0.83, g, true);
    m.scale.set(1.3, 0.35, 0.4);
  }

  // Hair
  const hairParts = [];
  const capGeo = new THREE.SphereGeometry(HEAD_R + 0.06, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.55);
  const addCap = () => { const c = part(capGeo, hair, 0, HEAD_Y + 0.02, 0); c.rotation.x = 0.42; return c; };
  if (custom.hair === 'short'){
    addCap();
    part(new THREE.SphereGeometry(0.34, 16, 12), hair, 0, HEAD_Y - 0.12, 0.62);
  } else if (custom.hair === 'cap'){
    const c = part(new THREE.SphereGeometry(HEAD_R + 0.07, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, HEAD_Y + 0.05, 0);
    c.rotation.x = 0.12;
    const brim = part(new THREE.CylinderGeometry(0.62, 0.62, 0.08, 24, 1, false, Math.PI * 0.5, Math.PI), hair, 0, HEAD_Y + 0.28, -0.55);
    brim.rotation.x = -0.12;
    part(new THREE.SphereGeometry(0.09, 10, 8), hair, 0, HEAD_Y + 0.93, 0, g, true);
  } else if (custom.hair === 'spiky'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const spikeGroup = new THREE.Group();
      spikeGroup.position.set(i * 0.34, HEAD_Y + 0.72 - Math.abs(i) * 0.12, 0.05);
      spikeGroup.rotation.z = -i * 0.35;
      part(new THREE.ConeGeometry(0.2, 0.55, 12), hair, 0, 0.24, 0, spikeGroup);
      g.add(spikeGroup);
      hairParts.push({ group: spikeGroup, type: 'spike' });
    }
  } else if (custom.hair === 'long'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const strandGroup = new THREE.Group();
      strandGroup.position.set(i * 0.32, HEAD_Y + 0.35, 0.62);
      const st = part(new THREE.SphereGeometry(0.2, 14, 10), hair, 0, -0.6, 0, strandGroup);
      st.scale.set(1, 3.2, 0.7);
      g.add(strandGroup);
      hairParts.push({ group: strandGroup, type: 'strand' });
    }
  }

  // Legs (pivot at hip)
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.24, 0.62, 0); g.add(l);
    const leg = part(new THREE.SphereGeometry(0.2, 14, 10), pants, 0, -0.22, 0, l); leg.scale.set(1, 1.5, 1);
    const shoe = part(new THREE.SphereGeometry(0.23, 14, 10), shoes, 0, -0.5, -0.07, l); shoe.scale.set(1.1, 0.6, 1.35);
    return l;
  });
  // Arms (pivot at shoulder)
  const armOff = isFem ? 0.56 : 0.6;
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * armOff, 1.32, 0); g.add(a);
    part(new THREE.SphereGeometry(0.2, 14, 10), shirt, 0, -0.06, 0, a);
    const arm = part(new THREE.SphereGeometry(0.16, 14, 10), skin, 0, -0.32, 0, a); arm.scale.set(1, 1.9, 1);
    return a;
  });
  // Wooden bat in the right hand
  const bat = part(new THREE.CylinderGeometry(0.13, 0.08, 0.95, 12), M(0xc08a4a), 0, -0.95, -0.05, arms[1]);
  bat.rotation.x = 0.15;
  // Backpack in the chosen bag skin (hidden when a back cosmetic takes its place)
  if (!(custom.cosmetics && custom.cosmetics.back)){
    const bag = makeBagMesh((custom.cosmetics && custom.cosmetics.bag) || '');
    bag.position.set(0, 1.08, 0.55); g.add(bag);
  }

  attachCosmetics(g, custom.cosmetics);
  return { group: g, legL: legs[0], legR: legs[1], armL: arms[0], armR: arms[1], hairParts };
}

const DOOR_CELL = { x: N - 2, z: 0 };   // the floor cell right in front of the door

// ---------- furniture catalogue ----------
// w × d in cells (at rot 0, d runs toward the camera). solid = blocks walking.
const FURN = {
  sofa:   { name: '沙發',     price: 120, w: 2, d: 1, solid: true },
  bed:    { name: '小床',     price: 150, w: 2, d: 1, solid: true },
  desk:   { name: '書桌',     price: 100, w: 2, d: 1, solid: true },
  tv:     { name: '電視櫃',   price: 180, w: 2, d: 1, solid: true },
  shelf:  { name: '書櫃',     price: 90,  w: 1, d: 1, solid: true },
  table:  { name: '圓桌',     price: 60,  w: 1, d: 1, solid: true },
  chair:  { name: '椅子',     price: 30,  w: 1, d: 1, solid: true },
  rug:    { name: '圓地毯',   price: 50,  w: 2, d: 2, solid: false, flat: true },
  plant:  { name: '盆栽',     price: 25,  w: 1, d: 1, solid: true },
  lamp:   { name: '立燈',     price: 40,  w: 1, d: 1, solid: true },
  saturn: { name: '土星玩偶', price: 70,  w: 1, d: 1, solid: true },
};
function buildFurniture(id){
  const g = new THREE.Group(), W = FURN[id].w * CELL, D = FURN[id].d * CELL;
  const wood = LM(0xc08a50), dark = LM(0x8a5a32);
  if (id === 'sofa'){
    const c = LM(0x7fb4d8), c2 = LM(0xa8d0ea);
    part(g, RB(W - 0.15, 0.5, D - 0.25), c, 0, 0.35, 0.05);
    part(g, RB(W - 0.15, 0.85, 0.35), c, 0, 0.75, -D / 2 + 0.28);
    for (const s of [-1, 1]) part(g, RB(0.35, 0.65, D - 0.25), c, s * (W / 2 - 0.25), 0.55, 0.05);
    for (const s of [-1, 1]) part(g, RB(W / 2 - 0.45, 0.2, D - 0.6), c2, s * (W / 4 - 0.08), 0.68, 0.12);
  } else if (id === 'bed'){
    part(g, RB(W - 0.1, 0.45, D - 0.1), wood, 0, 0.3, 0);
    part(g, RB(W - 0.3, 0.3, D - 0.25), LM(0xffffff), 0.05, 0.6, 0);
    part(g, RB(W * 0.6, 0.14, D - 0.2), LM(0xffb3a8), W * 0.17, 0.78, 0);
    part(g, RB(0.6, 0.2, D * 0.6), LM(0xfff1d0), -W / 2 + 0.55, 0.83, 0);
    part(g, RB(0.22, 1.1, D - 0.1), dark, -W / 2 + 0.11, 0.75, 0);
  } else if (id === 'desk'){
    part(g, RB(W - 0.15, 0.14, D - 0.3), wood, 0, 0.85, -0.05);
    for (const sx of [-1, 1]) part(g, RB(0.5, 0.8, D - 0.35), dark, sx * (W / 2 - 0.35), 0.4, -0.05);
    for (let i = 0; i < 3; i++) part(g, RB(0.16, 0.42, 0.32), LM([0xe0584a, 0x6fb3e0, 0x7cc79a][i]), -0.7 + i * 0.18, 1.12, -0.35);
    part(g, new THREE.CylinderGeometry(0.06, 0.12, 0.5, 10), LM(0x5b3a29), 0.8, 1.17, -0.3);
    part(g, new THREE.ConeGeometry(0.22, 0.25, 14, 1, true), LM(0xffcf5a, { emissive: 0x553300 }), 0.8, 1.45, -0.3);
  } else if (id === 'tv'){
    part(g, RB(W - 0.3, 0.6, D - 0.55), wood, 0, 0.3, -0.2);
    part(g, RB(1.9, 1.1, 0.14), LM(0x3a2e40), 0, 1.25, -0.3);
    part(g, new THREE.PlaneGeometry(1.7, 0.9), new THREE.MeshBasicMaterial({ color: 0x8fd0f0 }), 0, 1.25, -0.22);
  } else if (id === 'shelf'){
    part(g, RB(W - 0.2, 2.3, 0.6), wood, 0, 1.15, -D / 2 + 0.35);
    for (let i = 0; i < 3; i++){
      for (let k = 0; k < 4; k++) part(g, RB(0.18, 0.45, 0.4), LM([0xe0584a, 0x6fb3e0, 0x7cc79a, 0xffcf5a][(i + k) % 4]), -0.42 + k * 0.26, 0.55 + i * 0.68, -D / 2 + 0.42);
    }
  } else if (id === 'table'){
    part(g, new THREE.CylinderGeometry(0.62, 0.62, 0.1, 24), wood, 0, 0.78, 0);
    part(g, new THREE.CylinderGeometry(0.09, 0.09, 0.72, 10), dark, 0, 0.4, 0);
    part(g, new THREE.CylinderGeometry(0.36, 0.4, 0.07, 18), dark, 0, 0.04, 0);
    part(g, new THREE.CylinderGeometry(0.12, 0.1, 0.18, 12), LM(0xffffff), 0.15, 0.92, 0.1);
  } else if (id === 'chair'){
    part(g, RB(0.85, 0.14, 0.85), LM(0xffb3a8), 0, 0.52, 0.05);
    part(g, RB(0.85, 0.8, 0.14), wood, 0, 0.95, -0.36);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) part(g, RB(0.1, 0.5, 0.1, 0.03), dark, sx * 0.32, 0.25, sz * 0.32);
  } else if (id === 'rug'){
    part(g, new THREE.CylinderGeometry(1.4, 1.4, 0.04, 32), LM(0xffcf5a), 0, 0.02, 0);
    part(g, new THREE.CylinderGeometry(0.95, 0.95, 0.05, 32), LM(0xffb3a8), 0, 0.025, 0);
    part(g, new THREE.CylinderGeometry(0.45, 0.45, 0.06, 32), LM(0xfff1d0), 0, 0.03, 0);
  } else if (id === 'plant'){
    part(g, new THREE.CylinderGeometry(0.34, 0.26, 0.5, 16), LM(0xd9734a), 0, 0.25, 0);
    for (const [x, y, z, r] of [[0, 0.9, 0, 0.38], [0.22, 0.75, 0.1, 0.28], [-0.2, 0.78, -0.08, 0.28], [0.02, 1.2, 0.05, 0.25]])
      part(g, new THREE.SphereGeometry(r, 14, 10), LM(0x6fbf5e), x, y, z);
  } else if (id === 'lamp'){
    part(g, new THREE.CylinderGeometry(0.3, 0.34, 0.08, 16), dark, 0, 0.04, 0);
    part(g, new THREE.CylinderGeometry(0.05, 0.05, 1.7, 8), dark, 0, 0.9, 0);
    part(g, new THREE.CylinderGeometry(0.28, 0.42, 0.45, 16, 1, true), LM(0xfff1c9, { emissive: 0x665522, side: THREE.DoubleSide }), 0, 1.8, 0);
  } else if (id === 'saturn'){
    part(g, new THREE.CylinderGeometry(0.32, 0.36, 0.14, 16), wood, 0, 0.07, 0);
    part(g, new THREE.SphereGeometry(0.48, 24, 16), LM(0xffb35c), 0, 0.68, 0);
    const ring = part(g, new THREE.TorusGeometry(0.72, 0.07, 10, 32), LM(0xffe0a8), 0, 0.68, 0);
    ring.rotation.x = Math.PI / 2 - 0.35;
    for (const s of [-1, 1]){ const e = part(g, new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0x2a1d18 }), s * 0.15, 0.75, 0.44); e.userData.noLine = true; }
    const smile = part(g, new THREE.TorusGeometry(0.09, 0.02, 6, 12, Math.PI), new THREE.MeshBasicMaterial({ color: 0x8a3a2a }), 0, 0.62, 0.46);
    smile.rotation.z = Math.PI; smile.userData.noLine = true;
  }
  return sbOutline(g, 0.035);
}

// ---------- placement grid ----------
const placedObjs = new Map();   // uid -> { data, group }
const footprint = (id, rot) => rot % 2 ? [FURN[id].d, FURN[id].w] : [FURN[id].w, FURN[id].d];
function cellsOf(p){
  const [w, d] = footprint(p.id, p.rot), out = [];
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) out.push([p.x + i, p.z + j]);
  return out;
}
function placeTransform(group, p){
  const [w, d] = footprint(p.id, p.rot);
  group.position.set(-HALF + (p.x + w / 2) * CELL, 0, -HALF + (p.z + d / 2) * CELL);
  group.rotation.y = -p.rot * Math.PI / 2;
}
function fits(p, ignoreUid){
  const flat = !!FURN[p.id].flat;
  for (const [cx, cz] of cellsOf(p)){
    if (cx < 0 || cz < 0 || cx >= N || cz >= N) return false;
    if (cx === DOOR_CELL.x && cz === DOOR_CELL.z && !flat) return false;   // keep the doorway clear
    for (const [uid, o] of placedObjs){
      if (uid === ignoreUid) continue;
      if (!!FURN[o.data.id].flat !== flat) continue;            // rugs layer under furniture
      if (cellsOf(o.data).some(([x, z]) => x === cx && z === cz)) return false;
    }
  }
  return true;
}
function addPlaced(p){
  const g = buildFurniture(p.id); placeTransform(g, p);
  g.traverse(o => { o.userData.uid = p.uid; });
  scene.add(g); placedObjs.set(p.uid, { data: p, group: g });
}
for (const p of save.placed) addPlaced(p);
let nextUid = save.placed.reduce((m, p) => Math.max(m, p.uid), 0) + 1;
function solidAt(cx, cz){
  for (const [, o] of placedObjs){
    if (!FURN[o.data.id].solid) continue;
    if (cellsOf(o.data).some(([x, z]) => x === cx && z === cz)) return true;
  }
  return false;
}
// If a piece lands on top of the player, step them to the nearest free cell
function nudgeOutOfFurniture(){
  const cx = Math.floor((pos.x + HALF) / CELL), cz = Math.floor((pos.z + HALF) / CELL);
  if (!solidAt(cx, cz)) return;
  let best = null, bd = Infinity;
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++){
    if (solidAt(x, z)) continue;
    const d = Math.hypot(x - cx, z - cz); if (d < bd){ bd = d; best = [x, z]; }
  }
  if (best){ const c = cellCenter(best[0], best[1]); pos.x = c.x; pos.z = c.z; target = null; }
}
function syncSave(){ save.placed = [...placedObjs.values()].map(o => o.data); persist(); }

// ---------- me ----------
let me = buildEddieAvatar(DEFAULT_CUSTOM, { bat: false });   // at home Eddie doesn't carry the bat
const pos = new THREE.Vector3(cellCenter(4, 5).x, 0, cellCenter(4, 5).z);
me.group.position.copy(pos); me.group.rotation.y = Math.PI * 0.85; scene.add(me.group);   // face the camera
let target = null, walkPhase = 0;

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function pickFloor(e){
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  return ray.ray.intersectPlane(floorPlane, hit) ? hit : null;
}
function pickFurniture(e){
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const objs = [...placedObjs.values()].map(o => o.group);
  const hits = ray.intersectObjects(objs, true).filter(h => !h.object.userData.sbLine);
  return hits.length ? hits[0].object.userData.uid : null;
}
function pickDoor(e){
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObject(doorObj, true).length > 0;
}
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR' && holding) rotateHolding(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let mode = 'walk';     // 'walk' | 'deco'
let holding = null;    // { data, group, uid|null (new), fromInv }
let down = null;
renderer.domElement.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: performance.now(), dragging: false };
  if (mode === 'deco' && holding) moveHoldingTo(e);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.dragging = true;
  if (mode === 'deco' && holding) moveHoldingTo(e);
});
renderer.domElement.addEventListener('pointerup', e => {
  const tap = down && !down.dragging; down = null;
  if (!tap) return;
  if (mode === 'walk'){
    if (pickDoor(e)){ openGo(); return; }
    const p = pickFloor(e);
    if (p){ target = new THREE.Vector3(Math.max(-HALF + 0.5, Math.min(HALF - 0.5, p.x)), 0, Math.max(-HALF + 0.5, Math.min(HALF - 0.5, p.z))); }
  } else if (mode === 'deco' && !holding){
    const uid = pickFurniture(e);
    if (uid != null) pickUp(uid);
  }
});

// ---------- holding a piece ----------
const ghostOk = new THREE.MeshBasicMaterial({ color: 0x7cc79a, transparent: true, opacity: 0.45, depthWrite: false });
const ghostBad = new THREE.MeshBasicMaterial({ color: 0xe0584a, transparent: true, opacity: 0.45, depthWrite: false });
let ghost = null;
function refreshGhost(){
  if (ghost){ scene.remove(ghost); ghost = null; }
  if (!holding) return;
  const [w, d] = footprint(holding.data.id, holding.data.rot);
  ghost = new THREE.Mesh(new THREE.PlaneGeometry(w * CELL - 0.08, d * CELL - 0.08), fits(holding.data, holding.uid) ? ghostOk : ghostBad);
  ghost.rotation.x = -Math.PI / 2;
  ghost.position.set(-HALF + (holding.data.x + w / 2) * CELL, 0.06, -HALF + (holding.data.z + d / 2) * CELL);
  scene.add(ghost);
  placeTransform(holding.group, holding.data);
  holding.group.position.y = 0.25;    // lifted while carrying
}
function firstFreeSpot(id, rot){
  const order = [];
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) order.push([x, z]);
  order.sort((a, b) => Math.hypot(a[0] - 3.5, a[1] - 3.5) - Math.hypot(b[0] - 3.5, b[1] - 3.5));
  for (const [x, z] of order){ if (fits({ id, x, z, rot })) return { x, z }; }
  return null;
}
function startHolding(id, fromInv){
  const spot = firstFreeSpot(id, 0);
  if (!spot){ toast('房間放不下了，先收起一些家具'); return false; }
  const data = { uid: nextUid++, id, x: spot.x, z: spot.z, rot: 0 };
  const g = buildFurniture(id); scene.add(g);
  holding = { data, group: g, uid: null, fromInv };
  showHoldUI(); refreshGhost(); return true;
}
function pickUp(uid){
  const o = placedObjs.get(uid); if (!o) return;
  placedObjs.delete(uid);
  holding = { data: o.data, group: o.group, uid, fromInv: false, prev: { ...o.data } };
  showHoldUI(); refreshGhost(); renderTray();
}
function moveHoldingTo(e){
  const p = pickFloor(e); if (!p) return;
  const [w, d] = footprint(holding.data.id, holding.data.rot);
  const cx = Math.round((p.x + HALF) / CELL - w / 2), cz = Math.round((p.z + HALF) / CELL - d / 2);
  holding.data.x = Math.max(0, Math.min(N - w, cx));
  holding.data.z = Math.max(0, Math.min(N - d, cz));
  refreshGhost();
}
function rotateHolding(){
  if (!holding) return;
  holding.data.rot = (holding.data.rot + 1) % 4;
  const [w, d] = footprint(holding.data.id, holding.data.rot);
  holding.data.x = Math.min(holding.data.x, N - w); holding.data.z = Math.min(holding.data.z, N - d);
  refreshGhost();
}
function placeHolding(){
  if (!holding) return;
  if (!fits(holding.data, holding.uid)){ toast('這裡放不下，換個位置或轉個方向'); return; }
  if (holding.fromInv) save.inv[holding.data.id] = Math.max(0, (save.inv[holding.data.id] || 0) - 1);
  scene.remove(holding.group);
  addPlaced(holding.data);
  holding = null; refreshGhost(); hideHoldUI(); syncSave(); renderTray();
  nudgeOutOfFurniture();
  toast('放好了！');
}
function stowHolding(){
  if (!holding) return;
  scene.remove(holding.group);
  if (!holding.fromInv) save.inv[holding.data.id] = (save.inv[holding.data.id] || 0) + 1;
  holding = null; refreshGhost(); hideHoldUI(); syncSave(); renderTray();
  toast('收進箱子了');
}
function showHoldUI(){ $('holdBar').hidden = false; $('holdHint').hidden = false; }
function hideHoldUI(){ $('holdBar').hidden = true; $('holdHint').hidden = true; }
$('rotBtn').onclick = rotateHolding;
$('placeBtn').onclick = placeHolding;
$('stowBtn').onclick = stowHolding;

// ---------- tray (my furniture / shop / floor / wallpaper) ----------
let tab = 'mine';
const thumbCache = {};
const thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
thumbR.setSize(128, 104, false);
const thumbScene = new THREE.Scene();
thumbScene.add(new THREE.HemisphereLight(0xfff2dc, 0xb9a07c, 0.9));
const tsun = new THREE.DirectionalLight(0xffeccc, 0.5); tsun.position.set(3, 6, 5); thumbScene.add(tsun);
const thumbCam = new THREE.PerspectiveCamera(30, 128 / 104, 0.1, 50);
function thumb(id){
  if (thumbCache[id]) return thumbCache[id];
  const g = buildFurniture(id); thumbScene.add(g);
  const box = new THREE.Box3().setFromObject(g), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z);
  thumbCam.position.set(c.x + r * 1.3, c.y + r * 1.0, c.z + r * 1.9); thumbCam.lookAt(c);
  thumbR.render(thumbScene, thumbCam);
  thumbScene.remove(g);
  return thumbCache[id] = thumbR.domElement.toDataURL();
}
function swatch(def){
  const t = def.tex(); const c = t.image; return c.toDataURL();
}
function renderTray(){
  for (const [k, b] of [['mine', 'tabMine'], ['shop', 'tabShop'], ['floor', 'tabFloor'], ['wall', 'tabWall']]) $(b).setAttribute('aria-pressed', String(tab === k));
  const box = $('items'); box.textContent = '';
  const add = (html, onClick, cls) => { const d = document.createElement('div'); d.className = 'item' + (cls ? ' ' + cls : ''); d.innerHTML = html; d.onclick = onClick; box.appendChild(d); };
  if (tab === 'mine'){
    const ids = Object.keys(FURN).filter(id => (save.inv[id] || 0) > 0);
    if (!ids.length){ box.innerHTML = '<div style="padding:14px;color:var(--sb-muted);font-weight:700">箱子是空的 — 去「家具店」買，或點房間裡的家具把它拿起來</div>'; return; }
    for (const id of ids) add(`<img alt="" src="${thumb(id)}">${FURN[id].name}<span class="count">×${save.inv[id]}</span>`, () => { if (!holding) startHolding(id, true); });
  } else if (tab === 'shop'){
    for (const id of Object.keys(FURN)){
      const f = FURN[id], can = save.money >= f.price;
      add(`<img alt="" src="${thumb(id)}">${f.name}<span class="price">$${f.price}</span>`, () => {
        if (!can){ toast('金幣不夠，去關卡賺一點吧'); return; }
        save.money -= f.price; save.inv[id] = (save.inv[id] || 0) + 1; setMoney(); persist();
        toast(`買了${f.name}！在「我的家具」裡`); renderTray();
      }, can ? '' : 'off');
    }
  } else {
    const isFloor = tab === 'floor', defs = isFloor ? FLOORS : WALLS, owned = isFloor ? save.floors : save.walls, cur = isFloor ? save.floor : save.wall;
    for (const id of Object.keys(defs)){
      const d = defs[id], has = owned.includes(id) || d.price === 0;
      add(`<img alt="" src="${swatch(d)}" style="border-radius:8px;border:1.5px solid var(--sb-line)">${d.name}<span class="${has ? 'count' : 'price'}">${cur === id ? '使用中' : has ? '已擁有' : '$' + d.price}</span>`, () => {
        if (!has){
          if (save.money < d.price){ toast('金幣不夠，去關卡賺一點吧'); return; }
          save.money -= d.price; owned.push(id); setMoney();
        }
        if (isFloor) save.floor = id; else save.wall = id;
        buildRoom(); persist(); renderTray();
      }, cur === id ? 'sel' : (has || save.money >= d.price ? '' : 'off'));
    }
  }
}
$('tabMine').onclick = () => { tab = 'mine'; renderTray(); };
$('tabShop').onclick = () => { tab = 'shop'; renderTray(); };
$('tabFloor').onclick = () => { tab = 'floor'; renderTray(); };
$('tabWall').onclick = () => { tab = 'wall'; renderTray(); };
function setMode(m){
  if (m === 'walk' && holding){ placeHolding(); if (holding) return; }
  mode = m;
  $('tray').hidden = m !== 'deco';
  $('decoBtn').hidden = m === 'deco';
  $('goBtn').hidden = m === 'deco';
  if (m === 'deco'){ target = null; renderTray(); toast('點房間裡的家具可以搬動，或從下面拿新的'); }
}
$('decoBtn').onclick = () => setMode('deco');
$('doneBtn').onclick = () => setMode('walk');

// ---------- going out ----------
function openGo(){ $('goCard').hidden = false; }
$('goBtn').onclick = openGo;
$('goClose').onclick = () => { $('goCard').hidden = true; };
$('goCard').addEventListener('click', e => { if (e.target === $('goCard')) $('goCard').hidden = true; });

// ---------- loop ----------
let last = 0, nearDoorT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0.016; last = now;
  // walking: keys or tap target
  let mx = 0, mz = 0;
  if (mode === 'walk'){
    if (keys.KeyW || keys.ArrowUp) mz -= 1; if (keys.KeyS || keys.ArrowDown) mz += 1;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (mx || mz) target = null;
    else if (target){
      const dx = target.x - pos.x, dz = target.z - pos.z, L = Math.hypot(dx, dz);
      if (L < 0.12) target = null; else { mx = dx / L; mz = dz / L; }
    }
  }
  const L = Math.hypot(mx, mz), moving = L > 0;
  if (moving){
    mx /= L; mz /= L;
    const nx = pos.x + mx * 4 * dt, nz = pos.z + mz * 4 * dt;
    const cx = Math.floor((nx + HALF) / CELL), cz = Math.floor((nz + HALF) / CELL);
    const inside = Math.abs(nx) < HALF - 0.4 && Math.abs(nz) < HALF - 0.4;
    if (inside && !solidAt(cx, cz)){ pos.x = nx; pos.z = nz; }
    else target = null;
    me.group.rotation.y = Math.atan2(-mx, -mz);
    walkPhase += dt * 11;
  }
  animateEddie(me, { t: now / 1000, dt, moving, phase: walkPhase * 0.75, onGround: true, mood: mode === 'deco' ? 'smug' : 'smile' });
  me.group.position.set(pos.x, 0, pos.z);
  // standing in front of the door offers the level list once
  const atDoor = Math.floor((pos.x + HALF) / CELL) === DOOR_CELL.x && Math.floor((pos.z + HALF) / CELL) === DOOR_CELL.z;
  if (atDoor && mode === 'walk'){ nearDoorT += dt; if (nearDoorT > 0.35 && nearDoorT < 1 && $('goCard').hidden){ openGo(); nearDoorT = 1; } }
  else nearDoorT = 0;
  // camera: fixed storybook angle on the room, a little drift toward the player
  const fx = pos.x * 0.25, fz = pos.z * 0.2;
  const cd = camDist * (mode === 'deco' && innerHeight < 520 ? 1.3 : 1);   // short screens: back off so the room fits above the tray
  camera.position.set(fx + cd * 0.42, cd * 0.72, fz + cd * 0.78);
  camera.lookAt(fx, 0.6, fz);
  // While decorating, slide the picture up so the tray doesn't cover the room
  const trayH = mode === 'deco' ? $('tray').offsetHeight : 0;
  if (trayH !== lastTrayH){
    lastTrayH = trayH;
    if (trayH) camera.setViewOffset(innerWidth, innerHeight, 0, trayH * 0.5, innerWidth, innerHeight);
    else camera.clearViewOffset();
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
