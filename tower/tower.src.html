<!--
  SOURCE — edit this file, then run:  python tools/build_family.py --only tower
  艾迪的提案（docs/PLAN-101跑酷.md）v2：繞著 3D 的台北 101 外牆往上爬。
  跳上落腳點（窗台、冷氣機、旗桿、吊籃），碰到攀爬牆自動抓住、用握力往上爬。
  鏡頭像紀錄片的空拍機在跟拍（REC、高度計、晃動、換鏡頭）。一段 = 10 層 ≈ 1 分鐘。
  目前做到第 2 段（20F）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --sb-paper:#fff8ec; --sb-ink:#5b3a29; --sb-text:#4a3426; --sb-muted:#9a7d5f; --sb-gold-soft:#ffcf5a;
    --sb-font:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --sb-pop:"Huninn","Fredoka","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    --cam:"Courier New",ui-monospace,monospace;
    color-scheme:light;
  }
  html,body{height:100%}
  body{margin:0;position:fixed;inset:0;overflow:hidden;background:#8cc4ea;color:var(--sb-text);font-family:var(--sb-font);
       user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  /* ---- the camera look: viewfinder, REC, altimeter ---- */
  #vf{position:fixed;inset:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));z-index:4;pointer-events:none}
  #vf i{position:absolute;width:34px;height:34px;border:3px solid rgba(255,255,255,.85);filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
  #vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}#vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  #vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}#vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
  .camtxt{position:fixed;z-index:5;font:700 14px/1.2 var(--cam);color:#fff;text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
  #rec{left:calc(26px + env(safe-area-inset-left,0px));top:calc(24px + env(safe-area-inset-top,0px))}
  #rec b{color:#ff4a3a;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  #alt{right:calc(26px + env(safe-area-inset-right,0px));top:calc(24px + env(safe-area-inset-top,0px));text-align:right}
  #floorTag{left:calc(26px + env(safe-area-inset-left,0px));top:calc(46px + env(safe-area-inset-top,0px));font:900 22px var(--sb-font)}
  #coinTag{left:calc(26px + env(safe-area-inset-left,0px));top:calc(74px + env(safe-area-inset-top,0px));font:700 15px var(--sb-font)}
  #lower{position:fixed;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none;opacity:0;transition:opacity .4s}
  #lower.on{opacity:1}
  #lower b{display:block;background:#fff;color:#1a1a1a;font:900 18px var(--sb-font);padding:4px 12px;border-left:6px solid #e0584a}
  #lower span{display:inline-block;background:rgba(20,20,20,.8);color:#fff;font:600 13px var(--sb-font);padding:3px 12px}
  #grip{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;width:min(56vw,260px);height:14px;
        background:rgba(0,0,0,.35);border:2px solid #fff;border-radius:999px;overflow:hidden;opacity:0;transition:opacity .25s;pointer-events:none}
  #grip.on{opacity:1}
  #grip i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7cc79a,#ffcf5a)}
  #grip.low i{background:#e0584a}
  #gripLbl{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;font:900 13px var(--sb-font);color:#fff;text-shadow:0 0 3px #000;opacity:0;transition:opacity .25s;pointer-events:none}
  #gripLbl.on{opacity:1}
  #wind{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);z-index:6;font:900 min(14vw,80px)/1 var(--sb-font);color:#fff;-webkit-text-stroke:4px #2a6fb0;paint-order:stroke fill;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
  #wind.on{opacity:1;animation:windbob .5s ease-in-out infinite alternate}
  @keyframes windbob{to{transform:translate(-50%,-50%) translateX(var(--wx,20px))}}
  #flash{position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.85);z-index:8;font:18px/1.3 var(--sb-pop);color:var(--sb-ink);background:#fff8ec;max-width:88vw;text-align:center;
    border:2.5px solid var(--sb-ink);border-radius:18px;padding:6px 16px;box-shadow:0 4px 0 rgba(91,58,41,.35);pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
  #flash.on{opacity:1;transform:translateX(-50%) scale(1)}
  #tired{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(220,40,40,.55);opacity:0;transition:opacity .25s}
  #tired.on{opacity:1;animation:pulseT .55s ease-in-out infinite alternate}
  @keyframes pulseT{from{opacity:.55}to{opacity:1}}
  #news{position:fixed;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;background:#c8202a;color:#fff;font:800 15px var(--sb-font);
        transform:translateY(200%);transition:transform .4s;pointer-events:none;overflow:hidden;white-space:nowrap}
  #news.on{transform:none}
  #news b{background:#fff;color:#c8202a;padding:5px 10px;flex:none}
  #news span{display:inline-block;padding:5px 0;animation:ticker 7s linear infinite}
  @keyframes ticker{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
  .achs{text-align:left;font-size:14px;line-height:1.6;background:#fff;border:2px solid var(--sb-ink);border-radius:12px;padding:6px 12px;margin:8px 0}
  .achs .off{color:var(--sb-muted)} .achs .new{color:#c0392b;font-weight:800}
  .say{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;border:2.5px solid var(--sb-ink);border-radius:14px;padding:3px 10px;font:800 15px/1.3 var(--sb-font);color:var(--sb-ink);
       white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(91,58,41,.3);opacity:0;transition:opacity .15s}
  .say.on{opacity:1}
  .say::after{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--sb-ink);border-bottom:0}
  .say.npc{background:#e8f6ff;font-size:14px}
  .topbtns{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:7;display:flex;gap:6px}
  .topbtns button{font:700 13px var(--sb-font);background:rgba(255,248,236,.9);border:2px solid var(--sb-ink);border-radius:999px;padding:3px 10px;color:var(--sb-ink);cursor:pointer}
  /* ---- the intro: letterbox + typed title cards ---- */
  .bars{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:9;transition:transform .8s;pointer-events:none}
  #barT{top:0;transform:translateY(-100%)}#barB{bottom:0;transform:translateY(100%)}
  body.cine #barT,body.cine #barB{transform:none}
  body.cine #vf,body.cine .camtxt,body.cine .tb,body.cine #joy,body.cine .topbtns{visibility:hidden}
  #cards{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
  #cards.on{opacity:1}
  #cards p{color:#fff;font:700 min(6vw,30px)/1.7 var(--sb-font);text-align:center;margin:0;letter-spacing:2px;white-space:pre-line}
  #skip{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(13vh + env(safe-area-inset-bottom,0px));z-index:11;font:700 14px var(--sb-font);background:rgba(255,255,255,.85);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
  #skip[hidden]{display:none}
  /* ---- touch: joystick (left) + jump (right) ---- */
  #joy{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:7;width:120px;height:120px;border-radius:50%;
       background:rgba(255,248,236,.35);border:3px solid rgba(255,255,255,.8);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,248,236,.95);border:3px solid var(--sb-ink)}
  .tb{position:fixed;z-index:7;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;
      border:3px solid var(--sb-ink);background:var(--sb-gold-soft);font:900 20px var(--sb-font);color:var(--sb-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(91,58,41,.35);touch-action:none}
  .tb.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(91,58,41,.35)}
  @media (hover:hover) and (pointer:fine){ .tb,#joy{display:none} }
  .card{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(10,20,40,.55);padding:14px}
  .card[hidden]{display:none!important}
  .card>div{background:var(--sb-paper);border:3px solid var(--sb-ink);border-radius:22px;padding:16px 20px;max-width:420px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(91,58,41,.25)}
  .card h1{font:900 40px/1.1 var(--sb-font);margin:0;color:#ffcf5a;-webkit-text-stroke:5px var(--sb-ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--sb-ink);transform:rotate(-2deg)}
  .card .sub{display:inline-block;margin:10px 0 4px;background:#3a7bc8;color:#fff;font:900 15px var(--sb-font);padding:2px 14px;border:2.5px solid var(--sb-ink);border-radius:999px}
  .card ul{text-align:left;font-size:14px;line-height:1.6;padding-left:20px;margin:8px 0}
  .btn{display:inline-block;font:900 19px var(--sb-font);background:var(--sb-gold-soft);color:var(--sb-ink);border:2.5px solid var(--sb-ink);border-radius:999px;padding:8px 24px;margin:6px 4px 0;
       cursor:pointer;box-shadow:0 4px 0 rgba(91,58,41,.35);text-decoration:none}
  .btn.ghost{background:#fff;font-size:15px;padding:6px 16px}
  .btn[hidden],.homeLink[hidden]{display:none}
  .muted{color:var(--sb-muted);font-size:13px}
  .times{text-align:left;font-size:14px;background:#fff;border:2px solid var(--sb-ink);border-radius:12px;padding:6px 12px;margin:8px 0;font-variant-numeric:tabular-nums}
</style>

<div class="card" id="startCard"><div>
  <h1>101 跑酷</h1>
  <div class="sub">徒手攀登台北 101 · 艾迪的提案</div>
  <ul>
    <li>繞著 101 外牆往上爬：<b>跳</b>上窗台、冷氣機、吊籃；<b>碰到攀爬牆會自動抓住</b>，用搖桿往上爬。</li>
    <li>抓牆會用掉 <b>💪 握力</b>，站上落腳點休息就會回來；牆上的 🧂 粉袋可以補滿。</li>
    <li>一段 10 層（約 1 分鐘），每段終點是施工平台＝檢查點。越高的樓層金幣越多，登頂大獎 $460。</li>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*@@INCLUDE:LOOK@@*/

/*@@INCLUDE:AVATAR@@*/

(() => {
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let flashT = 0;
function flash(t, secs){ const f = $('flash'); f.textContent = t; f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('on'), (secs || 1.4) * 1000); }
let lowerT = 0;
function lowerThird(b, s, secs){ $('lowerB').textContent = b; $('lowerS').textContent = s; $('lower').classList.add('on'); clearTimeout(lowerT); lowerT = setTimeout(() => $('lower').classList.remove('on'), (secs || 3) * 1000); }

// ============================================================
// THE TOWER — square, 4 faces. Movement is along the wall surface:
//   s = distance around the tower (0 … 4·SIDE), y = height.
//   +s = to the right as seen from outside. Faces: 0 front(+z) 1 right(+x) 2 back 3 left.
// ============================================================
const SIDE = 18, R = SIDE / 2, PER = SIDE * 4, FLOOR_H = 3, BUILT = 20;   // floors built so far
const TOTAL_FLOORS = 101, TOWER_H = TOTAL_FLOORS * FLOOR_H, METERS = 508 / (TOTAL_FLOORS * FLOOR_H + 30);
const GRAV = 30, JUMP_V = 13.2, RUN = 6.5, CLIMB = 2.2;
const wrapS = s => ((s % PER) + PER) % PER;
function surf(s, out, y){
  s = wrapS(s); const f = Math.floor(s / SIDE), u = s - f * SIDE - R, o = R + out;
  const p = f === 0 ? [u, o] : f === 1 ? [o, -u] : f === 2 ? [-u, -o] : [-o, u];
  return new THREE.Vector3(p[0], y, p[1]);
}
// normal that eases round a corner, so the camera swings round smoothly
function softNormal(s){
  s = wrapS(s); const f = Math.floor(s / SIDE), u = s - f * SIDE;
  let a = f * Math.PI / 2;
  if (u > SIDE - 2.5) a += (u - (SIDE - 2.5)) / 5 * Math.PI / 2;
  else if (u < 2.5) a -= (2.5 - u) / 5 * Math.PI / 2;
  return new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
}
const faceAngle = s => Math.floor(wrapS(s) / SIDE) * Math.PI / 2;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0f0);
scene.fog = new THREE.Fog(0xb8dcf2, 120, 420);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 900);
scene.add(new THREE.HemisphereLight(0xfff2dc, 0x8aa0b8, 0.85));
const sun = new THREE.DirectionalLight(0xffeccc, 0.6); sun.position.set(40, 80, 60); scene.add(sun);
function fit(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 68 : 52; camera.updateProjectionMatrix(); }
addEventListener('resize', fit); fit();
const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const BM = c => new THREE.MeshBasicMaterial({ color: c });
function canvasTex(w, h, paint){ const c = document.createElement('canvas'); c.width = w; c.height = h; paint(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }

// ---------- the building ----------
const tower = new THREE.Group(); scene.add(tower);
const glassCanvas = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 192; const x = c.getContext('2d'), w = 256, h = 192;
  x.fillStyle = '#3f8b84'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 6; i++){ const gx = i * w / 6; x.fillStyle = i % 2 ? '#6fb7ad' : '#86c9bf'; x.fillRect(gx + 4, 6, w / 6 - 8, h - 28); x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(gx + 8, 10, 8, h - 40); }
  x.fillStyle = '#2f6e68'; x.fillRect(0, h - 22, w, 22); return c; })();
for (let f = 0; f < TOTAL_FLOORS; f += 8){
  // one "bamboo" section = 8 floors, a touch wider at its top (the shape everyone knows)
  const n = Math.min(8, TOTAL_FLOORS - f), hgt = n * FLOOR_H, t = new THREE.CanvasTexture(glassCanvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, n);
  const flare = f >= 24 ? 1.05 : 1;
  const geo = new THREE.CylinderGeometry(R * Math.SQRT2 * flare, R * Math.SQRT2, hgt, 4, 1, true);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: t, side: THREE.DoubleSide }));
  m.rotation.y = Math.PI / 4; m.position.y = f * FLOOR_H + hgt / 2; tower.add(m);
  if (f + 8 <= TOTAL_FLOORS){ const cap = new THREE.Mesh(new THREE.BoxGeometry(SIDE * flare + 0.6, 0.5, SIDE * flare + 0.6), LM(0x2f6e68)); cap.position.y = (f + 8) * FLOOR_H; tower.add(cap); }
}
{ // the crown + spire + lightning rod (seen far above while you climb)
  const crown = new THREE.Mesh(new THREE.BoxGeometry(9, 8, 9), LM(0x3f8b84)); crown.position.y = TOWER_H + 4; tower.add(crown);
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 1.1, 22, 10), LM(0xcfd6dc)); spire.position.y = TOWER_H + 19; tower.add(spire);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 8), BM(0xff5a4a)); tip.position.y = TOWER_H + 30.3; tower.add(tip);
}
// street + a little city + hills
{ const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), LM(0x9cc98a)); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; scene.add(ground);
  const plaza = new THREE.Mesh(new THREE.BoxGeometry(SIDE + 16, 0.2, SIDE + 16), LM(0xe9e2d4)); plaza.position.y = 0.05; scene.add(plaza);
  const cols = [0xe8d6b8, 0xc9d7e0, 0xf2c9a8, 0xbfe0cc, 0xd8c8f0];
  for (let i = 0; i < 90; i++){
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 180, hgt = 6 + Math.random() * (d < 80 ? 30 : 60);
    const b = new THREE.Mesh(new THREE.BoxGeometry(6 + Math.random() * 10, hgt, 6 + Math.random() * 10), LM(cols[i % cols.length]));
    b.position.set(Math.cos(a) * d, hgt / 2, Math.sin(a) * d); scene.add(b);
  }
  for (let i = 0; i < 6; i++){ const h = new THREE.Mesh(new THREE.SphereGeometry(60 + i * 10, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), LM(0x7fb36a)); h.position.set(-200 + i * 80, -10, -320); h.scale.y = 0.5; scene.add(h); }
}
sbOutline(tower, 0.06);

// ============================================================
// LEVEL DATA — floors 1–20 (segments 1 and 2), hand-placed along a route
// that spirals round the tower. Every step is checked to be reachable.
// ============================================================
const plats = [], walls = [], chalks = [], people = [];
const TYPES = {
  sill:    { col: 0xe9e2d4, depth: 1.1, h: 0.35 },          // window sill
  ac:      { col: 0xf4f4f4, depth: 1.6, h: 1.0 },           // air-conditioner box
  flag:    { col: 0xd8d8d8, depth: 0.3, h: 0.25 },          // flagpole (tiny)
  gondola: { col: 0xffcf5a, depth: 1.5, h: 0.5 },           // window-cleaning cradle, rides up and down
  cp:      { col: 0xffe08a, depth: 2.2, h: 0.6 },           // scaffold deck = checkpoint (all the way round)
  street:  { col: 0xe9e2d4, depth: 8, h: 0.2 },

const sfx = (() => {
  let ac = null, on = true; try { on = localStorage.getItem('race.sound') !== 'off'; } catch (e) {}
  const ctx = () => { if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; };
  addEventListener('pointerdown', () => { if (on) ctx(); }, true); addEventListener('keydown', () => { if (on) ctx(); }, true);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05); }
  function hiss(dur, vol, f0, f1){ if (!on || !ctx()) return; const t = ac.currentTime, b = ac.createBuffer(1, Math.max(1, ac.sampleRate * dur | 0), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const n = ac.createBufferSource(); n.buffer = b; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); }
  return {
    get on(){ return on; }, toggle(){ on = !on; try { localStorage.setItem('race.sound', on ? 'on' : 'off'); } catch (e) {} return on; },
    jump: () => tone('square', 330, 660, 0.11, 0.07), grab: () => tone('triangle', 520, 380, 0.08, 0.1), slip: () => tone('sawtooth', 400, 90, 0.5, 0.08),

  cam.pos.lerp(want, Math.min(1, dt * 2.6)); cam.look.lerp(look, Math.min(1, dt * 4));
  let wob = S.windDir && S.t > S.windAt ? 0.35 : 0.06;
  if (S.shake > 0){ S.shake -= dt; wob += S.shake * 1.5; }
  camera.position.set(cam.pos.x + Math.sin(t * 1.3) * wob + Math.sin(t * 7.1) * wob * 0.3, cam.pos.y + Math.sin(t * 1.7) * wob, cam.pos.z + Math.cos(t * 1.1) * wob);
  camera.lookAt(cam.look);
}

// ---------- the intro: drone orbit + title cards + "the climber" ----------
const INTRO = 15.5;
function introFrame(t){
  if (t < 7){                                   // a drone circles the tower once, rising up the bamboo sections
    const k = t / 7, a = k * Math.PI * 2 + 0.6, r = 95 - k * 25, y = 20 + k * 220;
    camera.position.set(Math.sin(a) * r, y, Math.cos(a) * r); camera.lookAt(0, y * 0.75 + 30, 0);
  } else if (t < 11.5){
    camera.position.set(0, TOWER_H + 40, 60); camera.lookAt(0, TOWER_H + 20, 0);
  } else {                                      // on the street, low, looking up at the climber
    const k = (t - 11.5) / 4, pw = surf(9, 0, 0);
    camera.position.set(pw.x + 4 - k * 1.2, 0.9 + k * 0.5, pw.z + 8.5 - k * 2); camera.lookAt(pw.x, 1.3 + k * 2.6, pw.z);
  }
}
let cardStep = -1, typeT = 0;
const CARDS = [[7.0, '2026 年・台北'], [8.4, '508 公尺，101 層'], [9.8, '一個 12 歲的男孩\n決定徒手爬上去。']];
function typeCard(txt, from){ clearInterval(typeT); let n = from; const el = $('cardTxt'); typeT = setInterval(() => { n++; el.textContent = txt.slice(0, n); if (n >= txt.length) clearInterval(typeT); }, 45); }
function introText(t){
  const show = t >= 7 && t < 11.5; $('cards').classList.toggle('on', show);
  let i = -1; for (let k = 0; k < CARDS.length; k++) if (t >= CARDS[k][0]) i = k;
  if (show && i !== cardStep){ const prev = CARDS.slice(0, i).map(c => c[1]).join('\n\n'); cardStep = i; typeCard(CARDS.slice(0, i + 1).map(c => c[1]).join('\n\n'), prev ? prev.length + 2 : 0); }
  if (t >= 11.6 && !S.lowered){ S.lowered = true; lowerThird('艾迪', '挑戰者・12 歲・徒手攀登台北 101', 3.6); }
  if (t >= 13.2 && !S.clapped){ S.clapped = true; sfx.clap(); }
}
function playIntro(){
  S = { phase: 'intro', t: 0, best: 0, start: 0, coins: 0, seg: {}, cine: 0, cine0: performance.now(), lowered: false, clapped: false }; cardStep = -1;
  $('endCard').hidden = true;
  Object.assign(P, { s: 9, y: 0, mode: 'ground', face: 1 });
  document.body.classList.add('cine'); $('skip').hidden = false; $('startCard').hidden = true; sfx.whoosh();
}
function endIntro(){
  document.body.classList.remove('cine'); $('skip').hidden = true; $('cards').classList.remove('on'); clearInterval(typeT); $('cardTxt').textContent = '';
  try { localStorage.setItem('etfm-tower2-intro', '1'); } catch (e) {}
  startAt(0); updateCamera(0.016, true);
}
$('skip').onclick = endIntro;

// ---------- end / save ----------
async function endCard(done){
  if (S.phase === 'end') return;
  S.phase = 'end';
  const res = await claim();
  $('endTitle').textContent = done ? '🎬 卡！' + BUILT + 'F 收工' : '卡！收工';
  $('endSub').textContent = '從 ' + S.start + 'F 爬到 ' + S.best + 'F（' + Math.round(S.best * FLOOR_H * METERS) + ' 公尺）・拿到 $' + S.coins;
  const best = segBest();
  const have = haveAch(), fresh = S.newAch || [];
  $('endAch').innerHTML = '<b>🏆 成就 ' + have.length + ' / ' + ACH.length + '</b><br>' + ACH.map(a => '<span class="' + (fresh.includes(a.id) ? 'new' : have.includes(a.id) ? '' : 'off') + '">' +
    (have.includes(a.id) ? a.name : '🔒 ' + a.name.replace(/^\S+\s/, '')) + '　<small>' + a.desc + '</small>' + (fresh.includes(a.id) ? ' NEW!' : '') + '</span>').join('<br>');
  $('endTimes').innerHTML = [1, 2].map(k => '第 ' + k + ' 段（' + ((k - 1) * 10 + 1) + '–' + k * 10 + 'F）：' + (S.seg[k] ? S.seg[k].toFixed(1) + ' 秒' : '—') + '　最佳 ' + (best[k] ? best[k].toFixed(1) + ' 秒' : '—')).join('<br>');
  let line = '';
  if (res && res.offline) line = API ? '（先到「逃離土星」登入，金幣才會存進帳號）' : '（試玩版不存金幣）';
  else if (res && res.error) line = '（' + res.error + '）';
  else if (res && res.money != null) line = '金幣已存入帳號（現在 $' + res.money + '）';
  if (done) line += '　21F 以上還在施工，下一段快來了！';
  $('endLine').textContent = line;
  const cp = Math.min(savedCp(), BUILT - 10);
  $('againBtn').textContent = cp ? '從 ' + cp + 'F 繼續' : '再爬一次';
  $('endCard').hidden = false;
}
$('quitBtn').onclick = () => { if (S.phase === 'run') endCard(false); };
$('startBtn').onclick = () => { let seen = false; try { seen = !!localStorage.getItem('etfm-tower2-intro'); } catch (e) {} if (seen){ startAt(0); updateCamera(0.016, true); } else playIntro(); };
$('contBtn').onclick = () => { startAt(Math.min(savedCp(), BUILT - 10)); updateCamera(0.016, true); };
$('againBtn').onclick = () => { startAt(Math.min(savedCp(), BUILT - 10)); updateCamera(0.016, true); };
{ const cp = Math.min(savedCp(), BUILT - 10);
  $('contBtn').hidden = !cp; $('contBtn').textContent = '從 ' + cp + 'F 繼續';
  $('loginLine').textContent = (!API ? '試玩版：金幣不會存進帳號。' : token() ? '金幣會存進你的帳號。' : '還沒登入：先到「逃離土星」登入，金幣才會存。') + '　目前開放到 ' + BUILT + 'F。'; }
document.querySelectorAll('.homeLink').forEach(a => { if (ON_LIVE) a.href = 'https://cooldragon313.github.io/eddie-world/'; else if (!ON_LOCAL) a.hidden = true; });
if (ON_LOCAL) window.__tw = { get S(){ return S; }, P, plats, walls, chalks, ROUTE, startAt, step, keys, joy, tJ, playIntro, endIntro, updateCamera, say, npcSay, momNpc, cradle };   // local testing only

// ---------- Eddie's pose ----------
function poseEddie(dt, now){
  const e = me.eddie;
  me.group.position.copy(surf(P.s, P.mode === 'wall' ? (P.wall.over ? 0.75 : 0.4) : 0.75, P.y));
  const fa = faceAngle(P.s);
  if (P.mode === 'wall'){
    me.group.rotation.set(0, fa, 0);                         // facing the wall (back to the camera)
    const c = P.climbPh, [aL, aR] = e.arms, [lL, lR] = e.legs;
    aL.rotation.set(Math.PI - 0.3 + Math.sin(c) * 0.35, 0, -0.25); aR.rotation.set(Math.PI - 0.3 - Math.sin(c) * 0.35, 0, 0.25);
    aL.userData.elbow.rotation.x = 0.4; aR.userData.elbow.rotation.x = 0.4;
    lL.rotation.x = 0.5 + Math.sin(c) * 0.4; lR.rotation.x = 0.5 - Math.sin(c) * 0.4; lL.userData.knee.rotation.x = -0.9; lR.userData.knee.rotation.x = -0.9;
    e.face.set(P.grip < 30 ? 'surprised' : 'smile');
    if (P.grip < 30){ me.group.position.x += (Math.random() - 0.5) * 0.06; me.group.position.y += (Math.random() - 0.5) * 0.04; }   // arms shaking
  } else {
    me.group.rotation.set(0, fa + (P.face > 0 ? -1.25 : 1.25), 0);   // running along the wall, turned a bit toward the camera
    const moving = P.mode === 'ground' && Math.abs(P.vs) > 0.6;
    if (moving) P.phase += dt * Math.abs(P.vs) * 1.7;
    animateEddie(me, { t: now, dt, moving, phase: P.phase, onGround: P.mode === 'ground', mood: S.windDir ? 'surprised' : 'smile' });
  }
}

// ---------- loop ----------
let last = 0;
function frame(nowMs){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.033, Math.max(0, (nowMs - last) / 1000)) : 0.016; last = nowMs; const now = nowMs / 1000;
  if (S.phase === 'run') step(dt);
  if (S.phase === 'intro'){
    S.cine = (performance.now() - S.cine0) / 1000; introFrame(S.cine); introText(S.cine);   // real time, so a slow phone still gets 15 s
    me.group.position.copy(surf(9, 0.75, 0)); me.group.rotation.set(0, 0, 0);
    animateEddie(me, { t: now, dt, moving: false, onGround: true, mood: 'smug' });
    if (S.cine > 11.5){ const e = me.eddie; e.head.rotation.x = -0.5;          // looks up at the tower, claps the chalk off
      if (S.cine > 13.2 && S.cine < 13.9){ e.arms[0].rotation.set(1.3, 0, 0.5); e.arms[1].rotation.set(1.3, 0, -0.5); } }
    if (S.cine > INTRO) endIntro();
  } else {
    poseEddie(dt, now);
    updateTalk(dt); updateMarker(now);
    // pigeons fly off; the cleaner rides along
    for (const p of plats) if (p.bird && p.bird.fly){ const b = p.bird; b.fly += dt; b.g.position.y += dt * 4; b.g.position.addScaledVector(softNormal(p.s0), dt * 3); b.g.rotation.z = Math.sin(now * 30) * 0.3; if (b.fly > 3) b.g.visible = false; }
    if (S.phase === 'menu'){ const a = now * 0.08; camera.position.set(Math.sin(a) * 80, 60, Math.cos(a) * 80); camera.lookAt(0, 50, 0); }
    else updateCamera(dt);
  }
  // flags flap, people pose and snap photos
  for (const p of plats) if (p.flagMesh){ p.flagMesh.rotation.z = Math.sin(now * 6) * 0.08 + (S.windDir ? Math.sin(now * 20) * 0.2 : 0); p.flagMesh.scale.x = S.windDir ? 1.25 : 1; }
  for (const q of people){
    q.sp.position.y = q.base + Math.abs(Math.sin(now * 2 + q.ph)) * 0.05;
    if (q.photo && Math.abs(q.base - P.y) < 8 && Math.sin(now * 1.7 + q.ph) > 0.985){ if (q.fl.material.opacity < 0.1 && S.phase === 'run') sfx.shutter(); q.fl.material.opacity = 1; }
    q.fl.material.opacity = Math.max(0, q.fl.material.opacity - dt * 4);
  }
  for (const c of chalks) if (c.mesh.visible) c.mesh.children[1].rotation.z += dt * 2;
  // HUD: timecode, altimeter, grip
  const sec = S.phase === 'run' || S.phase === 'end' ? S.t : 0;
  $('tc').textContent = '00:' + String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  $('altM').textContent = Math.round(P.y * METERS);
  $('windTxt').textContent = '風速 ' + (S.windDir && S.t > S.windAt ? 18 : P.y > 30 ? 6 : 2) + ' m/s';
  $('floorTag').textContent = Math.max(1, Math.min(BUILT, floorOf(P.y) || 1)) + 'F';
  $('coinTag').textContent = '🪙 +' + S.coins;
  const gripOn = S.phase === 'run' && (P.mode === 'wall' || P.grip < 99);
  $('grip').classList.toggle('on', gripOn); $('gripLbl').classList.toggle('on', gripOn);
  $('gripFill').style.width = Math.max(0, P.grip) + '%'; $('grip').classList.toggle('low', P.grip < 30);
  $('tired').classList.toggle('on', S.phase === 'run' && P.mode === 'wall' && P.grip < 30);
  sweat.visible = S.phase === 'run' && P.grip < 45; if (sweat.visible){ sweat.position.copy(me.group.position); sweat.position.y += 2.1 + ((now * 1.5) % 1) * -0.6; sweat.position.addScaledVector(softNormal(P.s), 0.4); }
  for (const it of ITEMS) if (it.kind === 'coin' && it.mesh.visible) it.mesh.rotation.y = faceAngle(it.s) + now * 3;
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
