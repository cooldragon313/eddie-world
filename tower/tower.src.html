<!--
  SOURCE — edit this file, then run:  python tools/build_family.py --only tower
  艾迪的提案（docs/PLAN-101跑酷.md）v2：繞著 3D 的台北 101 外牆往上爬。
  跳上落腳點（窗台、冷氣機、旗桿、吊籃），碰到攀爬牆自動抓住、用握力往上爬。
  鏡頭像紀錄片的空拍機在跟拍（REC、高度計、晃動、換鏡頭）。一段 = 10 層 ≈ 1 分鐘。
  目前做到第 4 段（40F）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>

  #vf i{position:absolute;width:34px;height:34px;border:3px solid rgba(255,255,255,.85);filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
  #vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}#vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  #vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}#vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

  #rec{left:calc(26px + env(safe-area-inset-left,0px));top:calc(24px + env(safe-area-inset-top,0px))}

  #grip{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;width:min(56vw,260px);height:14px;

  #news{position:fixed;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;background:#c8202a;color:#fff;font:800 15px var(--sb-font);

       white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(91,58,41,.3);opacity:0;transition:opacity .15s}

       background:rgba(255,248,236,.35);border:3px solid rgba(255,255,255,.8);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,248,236,.95);border:3px solid var(--sb-ink)}
  .tb{position:fixed;z-index:7;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;
      border:3px solid var(--sb-ink);background:var(--sb-gold-soft);font:900 20px var(--sb-font);color:var(--sb-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(91,58,41,.35);touch-action:none}
  .tb.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(91,58,41,.35)}
  @media (hover:hover) and (pointer:fine){ .tb,#joy{display:none} }
  .card{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(10,20,40,.55);padding:14px}
  .card[hidden]{display:none!important}
  .card>div{background:var(--sb-paper);border:3px solid var(--sb-ink);border-radius:22px;padding:16px 20px;max-width:420px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(91,58,41,.25)}
  .card h1{font:900 40px/1.1 var(--sb-font);margin:0;color:#ffcf5a;-webkit-text-stroke:5px var(--sb-ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--sb-ink);transform:rotate(-2deg)}
  .card .sub{display:inline-block;margin:10px 0 4px;background:#3a7bc8;color:#fff;font:900 15px var(--sb-font);padding:2px 14px;border:2.5px solid var(--sb-ink);border-radius:999px}
  .card ul{text-align:left;font-size:14px;line-height:1.6;padding-left:20px;margin:8px 0}
  .btn{display:inline-block;font:900 19px var(--sb-font);background:var(--sb-gold-soft);color:var(--sb-ink);border:2.5px solid var(--sb-ink);border-radius:999px;padding:8px 24px;margin:6px 4px 0;
       cursor:pointer;box-shadow:0 4px 0 rgba(91,58,41,.35);text-decoration:none}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*@@INCLUDE:LOOK@@*/

/*@@INCLUDE:AVATAR@@*/

(() => {
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let flashT = 0;
function flash(t, secs){ const f = $('flash'); f.textContent = t; f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('on'), (secs || 1.4) * 1000); }
let lowerT = 0;
function lowerThird(b, s, secs){ $('lowerB').textContent = b; $('lowerS').textContent = s; $('lower').classList.add('on'); clearTimeout(lowerT); lowerT = setTimeout(() => $('lower').classList.remove('on'), (secs || 3) * 1000); }

// ============================================================
// THE TOWER — square, 4 faces. Movement is along the wall surface:
//   s = distance around the tower (0 … 4·SIDE), y = height.
//   +s = to the right as seen from outside. Faces: 0 front(+z) 1 right(+x) 2 back 3 left.
// ============================================================
const SIDE = 18, R = SIDE / 2, PER = SIDE * 4, FLOOR_H = 3, BUILT = 40;   // floors built so far
// the ten segments (docs/PLAN-101-難度表.md): name + stars
const SEGS = [null, ['出發！', 1], ['轉角遇到吊籃', 2], ['冷氣機森林', 2], ['竹節初登場', 3], ['夜幕降臨', 3], ['天空工地', 3], ['颱風前夕', 4], ['雨中攀登', 4], ['觀景台明星', 5], ['雲端之上', 5]];
const segOf = y => Math.min(10, Math.floor(Math.max(0, y) / (10 * 3)) + 1);
const TOTAL_FLOORS = 101, TOWER_H = TOTAL_FLOORS * FLOOR_H, METERS = 508 / (TOTAL_FLOORS * FLOOR_H + 30);
const GRAV = 30, JUMP_V = 13.2, RUN = 6.5, CLIMB = 2.2;
const wrapS = s => ((s % PER) + PER) % PER;
function surf(s, out, y){
  s = wrapS(s); const f = Math.floor(s / SIDE), u = s - f * SIDE - R, o = R + out;
  const p = f === 0 ? [u, o] : f === 1 ? [o, -u] : f === 2 ? [-u, -o] : [-o, u];
  return new THREE.Vector3(p[0], y, p[1]);
}
// normal that eases round a corner, so the camera swings round smoothly
function softNormal(s){
  s = wrapS(s); const f = Math.floor(s / SIDE), u = s - f * SIDE;
  let a = f * Math.PI / 2;
  if (u > SIDE - 2.5) a += (u - (SIDE - 2.5)) / 5 * Math.PI / 2;
  else if (u < 2.5) a -= (2.5 - u) / 5 * Math.PI / 2;
  return new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
}
const faceAngle = s => Math.floor(wrapS(s) / SIDE) * Math.PI / 2;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0f0);
scene.fog = new THREE.Fog(0xb8dcf2, 120, 420);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 900);
scene.add(new THREE.HemisphereLight(0xfff2dc, 0x8aa0b8, 0.85));
const sun = new THREE.DirectionalLight(0xffeccc, 0.6); sun.position.set(40, 80, 60); scene.add(sun);
function fit(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 68 : 52; camera.updateProjectionMatrix(); }
addEventListener('resize', fit); fit();
const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const BM = c => new THREE.MeshBasicMaterial({ color: c });
function canvasTex(w, h, paint){ const c = document.createElement('canvas'); c.width = w; c.height = h; paint(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }

// ---------- the building ----------
const tower = new THREE.Group(); scene.add(tower);
const glassCanvas = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 192; const x = c.getContext('2d'), w = 256, h = 192;
  x.fillStyle = '#3f8b84'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 6; i++){ const gx = i * w / 6; x.fillStyle = i % 2 ? '#6fb7ad' : '#86c9bf'; x.fillRect(gx + 4, 6, w / 6 - 8, h - 28); x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(gx + 8, 10, 8, h - 40); }
  x.fillStyle = '#2f6e68'; x.fillRect(0, h - 22, w, 22); return c; })();
for (let f = 0; f < TOTAL_FLOORS; f += 8){
  // one "bamboo" section = 8 floors, a touch wider at its top (the shape everyone knows)
  const n = Math.min(8, TOTAL_FLOORS - f), hgt = n * FLOOR_H, t = new THREE.CanvasTexture(glassCanvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, n);
  const flare = 1;   // straight sides: everything on the wall sits at a fixed distance from the glass (a flare buried the 31–40F walls); the climbable bamboo node does the leaning
  const geo = new THREE.CylinderGeometry(R * Math.SQRT2 * flare, R * Math.SQRT2, hgt, 4, 1, true);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: t, side: THREE.DoubleSide }));
  m.rotation.y = Math.PI / 4; m.position.y = f * FLOOR_H + hgt / 2; tower.add(m);
  if (f + 8 <= TOTAL_FLOORS){ const cap = new THREE.Mesh(new THREE.BoxGeometry(SIDE * flare + 0.6, 0.5, SIDE * flare + 0.6), LM(0x2f6e68)); cap.position.y = (f + 8) * FLOOR_H; tower.add(cap); }
}
{ // the crown + spire + lightning rod (seen far above while you climb)
  const crown = new THREE.Mesh(new THREE.BoxGeometry(9, 8, 9), LM(0x3f8b84)); crown.position.y = TOWER_H + 4; tower.add(crown);
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 1.1, 22, 10), LM(0xcfd6dc)); spire.position.y = TOWER_H + 19; tower.add(spire);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 8), BM(0xff5a4a)); tip.position.y = TOWER_H + 30.3; tower.add(tip);
}
// street + a little city + hills
{ const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), LM(0x9cc98a)); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; scene.add(ground);
  const plaza = new THREE.Mesh(new THREE.BoxGeometry(SIDE + 16, 0.2, SIDE + 16), LM(0xe9e2d4)); plaza.position.y = 0.05; scene.add(plaza);
  const cols = [0xe8d6b8, 0xc9d7e0, 0xf2c9a8, 0xbfe0cc, 0xd8c8f0];

  part(g, new THREE.CylinderGeometry(0.42, 0.42, 0.07, 24), m(0x1c1a1d), 0, 0.22, 0);

  }
  // gold toothed ring
  part(g, new THREE.CylinderGeometry(0.36, 0.38, 0.08, 12), m(0xe2b33c), 0, 0.29, 0);
  for (let i = 0; i < 12; i++){ const a = i / 12 * Math.PI * 2; part(g, new THREE.ConeGeometry(0.035, 0.1, 4), m(0xf2c84a), Math.cos(a) * 0.37, 0.33, Math.sin(a) * 0.37); }

  part(g, new THREE.CylinderGeometry(0.24, 0.26, 0.07, 20), m(0x5a5f66), 0, 0.35, 0);

  for (const [x, z, h] of [[-0.09, -0.02, 0.14], [0, -0.06, 0.18], [0.09, -0.02, 0.14]]) part(g, new THREE.ConeGeometry(0.035, h, 4), m(0xf2c84a), x, 0.4 + h / 2, z);

// ---------- the camera: a drone following the climber ----------
const cam = { pos: new THREE.Vector3(0, 20, 60), look: new THREE.Vector3(0, 0, 0) };
function updateCamera(dt, snap){
  const t = performance.now() / 1000, n = softNormal(P.s), pw = surf(P.s, 0, P.y + 1), portrait = innerWidth < innerHeight;
  const tan = new THREE.Vector3(n.z, 0, -n.x);                   // along the wall, to the right
  let want, look;
  if (S.shot === 'top' && S.t - S.shotT < 1.8){ want = pw.clone().addScaledVector(n, 6).add(new THREE.Vector3(0, 9, 0)); look = pw.clone(); }
  else {
    if (S.shot === 'top') S.shot = null;
    const hang = P.mode === 'wall' && P.wall.node ? 1 : 0;   // on a bamboo node: pull back and drop a little, so you see the street under you
    const dist = (portrait ? 14 : 12) + hang * 4, side = P.face * ((portrait ? 1.0 : 2.2) + hang * 8);   // and swing round to the side, so the lean shows
    want = pw.clone().addScaledVector(n, dist).addScaledVector(tan, side).add(new THREE.Vector3(0, (portrait ? 3.2 : 2.4) - hang * 3.5, 0));
    look = pw.clone().addScaledVector(tan, side * 0.4).add(new THREE.Vector3(0, portrait ? 2.0 : 1.2, 0));
  }
  // a little lag + handheld wobble (more in the wind)
  if (snap){ cam.pos.copy(want); cam.look.copy(look); }
  cam.pos.lerp(want, Math.min(1, dt * 2.6)); cam.look.lerp(look, Math.min(1, dt * 4));
  let wob = S.windDir && S.t > S.windAt ? 0.35 : 0.06;
  if (S.shake > 0){ S.shake -= dt; wob += S.shake * 1.5; }
  camera.position.set(cam.pos.x + Math.sin(t * 1.3) * wob + Math.sin(t * 7.1) * wob * 0.3, cam.pos.y + Math.sin(t * 1.7) * wob, cam.pos.z + Math.cos(t * 1.1) * wob);
  camera.lookAt(cam.look);
}

// ---------- Eddie's pose ----------
function poseEddie(dt, now){
  const e = me.eddie;
  const wantOut = P.mode === 'wall' ? wallOut(P.wall, P.y + 1) + (P.wall.over ? 0.25 : 0.32) : P.on && P.on.standOut != null ? P.on.standOut : 0.75;
  P.rOut = P.rOut == null ? wantOut : P.rOut + (wantOut - P.rOut) * Math.min(1, dt * 8);   // ease in and out over a node's lean
  me.group.position.copy(surf(P.s, P.rOut, P.y));
  const fa = faceAngle(P.s);
  if (P.mode === 'wall'){
    const n = P.wall.node, lean = n ? Math.atan2(n.out1 - n.out0, n.y1 - n.y0) : 0;
    me.group.rotation.order = 'YXZ'; me.group.rotation.set(lean, fa, 0);   // facing the wall (back to the camera); hanging back on a node
    const c = P.climbPh, [aL, aR] = e.arms, [lL, lR] = e.legs;
    aL.rotation.set(Math.PI - 0.3 + Math.sin(c) * 0.35, 0, -0.25); aR.rotation.set(Math.PI - 0.3 - Math.sin(c) * 0.35, 0, 0.25);
    aL.userData.elbow.rotation.x = 0.4; aR.userData.elbow.rotation.x = 0.4;
    lL.rotation.x = 0.5 + Math.sin(c) * 0.4; lR.rotation.x = 0.5 - Math.sin(c) * 0.4; lL.userData.knee.rotation.x = -0.9; lR.userData.knee.rotation.x = -0.9;
    e.face.set(P.grip < 30 ? 'surprised' : 'smile');
    if (P.grip < 30){ me.group.position.x += (Math.random() - 0.5) * 0.06; me.group.position.y += (Math.random() - 0.5) * 0.04; }   // arms shaking
  } else {
    me.group.rotation.set(0, fa + (P.face > 0 ? -1.25 : 1.25), 0);   // running along the wall, turned a bit toward the camera
    const mk = (S.t - (P.mantleAt ?? -9)) / 0.45;
    if (mk >= 0 && mk < 1){ me.group.position.y -= Math.sin(mk * Math.PI) * 0.5; me.group.rotation.x = Math.sin(mk * Math.PI) * 0.6; }   // 嘿咻: the mantle over the node's top
    const moving = P.mode === 'ground' && Math.abs(P.vs) > 0.6;
    if (moving) P.phase += dt * Math.abs(P.vs) * 1.7;
    animateEddie(me, { t: now, dt, moving, phase: P.phase, onGround: P.mode === 'ground', mood: S.windDir ? 'surprised' : 'smile' });
    if (S.t < (S.vUntil || 0)){ e.arms[1].rotation.set(2.7, 0, -0.35); e.arms[1].userData.elbow.rotation.x = 0.2; e.face.set('laugh'); }   // ✌️ for the camera
  }
  if (S.t < (S.ptooUntil || 0)){ e.head.rotation.z = Math.sin(now * 32) * 0.45; e.face.set('sad'); }    // 呸呸呸: shake it off
}

// ---------- loop ----------
let last = 0;
function frame(nowMs){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.033, Math.max(0, (nowMs - last) / 1000)) : 0.016; last = nowMs; const now = nowMs / 1000;
  if (S.phase === 'run') step(dt);
  if (S.phase === 'intro'){
    S.cine = (performance.now() - S.cine0) / 1000; introFrame(S.cine); introText(S.cine);   // real time, so a slow phone still gets 15 s
    me.group.position.copy(surf(9, 0.75, 0)); me.group.rotation.set(0, 0, 0);
    animateEddie(me, { t: now, dt, moving: false, onGround: true, mood: 'smug' });
    if (S.cine > 11.5){ const e = me.eddie; e.head.rotation.x = -0.5;          // looks up at the tower, claps the chalk off
      if (S.cine > 13.2 && S.cine < 13.9){ e.arms[0].rotation.set(1.3, 0, 0.5); e.arms[1].rotation.set(1.3, 0, -0.5); } }
    if (S.cine > INTRO) endIntro();
  } else {
    poseEddie(dt, now);
    updateTalk(dt); updateMarker(now); updatePoop(dt); updateHearts(dt);
    splatHat.visible = S.t < (S.splatUntil || 0); tongue.visible = S.t < (S.ptooUntil || 0);
    // pigeons fly off; the cleaner rides along
    for (const p of plats) if (p.bird && p.bird.fly){ const b = p.bird; b.fly += dt; b.g.position.y += dt * 4; b.g.position.addScaledVector(softNormal(p.s0), dt * 3); b.g.rotation.z = Math.sin(now * 30) * 0.3; if (b.fly > 3) b.g.visible = false; }
    if (S.phase === 'menu'){ const a = now * 0.08; camera.position.set(Math.sin(a) * 80, 60, Math.cos(a) * 80); camera.lookAt(0, 50, 0); }
    else updateCamera(dt);
  }
  // flags flap, people pose and snap photos
  for (const p of plats) if (p.flagMesh){ p.flagMesh.rotation.z = Math.sin(now * 6) * 0.08 + (S.windDir ? Math.sin(now * 20) * 0.2 : 0); p.flagMesh.scale.x = S.windDir ? 1.25 : 1; }
  for (const q of people){
    q.sp.position.y = q.base + Math.abs(Math.sin(now * 2 + q.ph)) * 0.05;
    if (q.photo && Math.abs(q.base - P.y) < 8 && Math.sin(now * 1.7 + q.ph) > 0.985){ if (q.fl.material.opacity < 0.1 && S.phase === 'run') sfx.shutter(); q.fl.material.opacity = 1; }
    q.fl.material.opacity = Math.max(0, q.fl.material.opacity - dt * 4);
  }
  for (const c of chalks) if (c.mesh.visible) c.mesh.children[1].rotation.z += dt * 2;
  for (const p of plats) if (p.drops) for (const d of p.drops){ const k = (now * 0.9 + d.userData.k * 0.33) % 1; d.position.copy(d.userData.home); d.position.y -= k * 3; d.material.opacity = 1 - k; }
  for (const it of ITEMS) if ((it.kind === 'toy' || it.kind === 'gripup') && it.mesh.visible) it.mesh.rotation.y += dt * (it.kind === 'toy' ? 6 : 2);
  // HUD: timecode, altimeter, grip
  const sec = S.phase === 'run' || S.phase === 'end' ? S.t : 0;
  $('tc').textContent = '00:' + String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  $('altM').textContent = Math.round(P.y * METERS);
  $('windTxt').textContent = '風速 ' + (S.windDir && S.t > S.windAt ? 18 : P.y > 30 ? 6 : 2) + ' m/s';
  $('floorTag').textContent = Math.max(1, Math.min(BUILT, floorOf(P.y) || 1)) + 'F';
  $('coinTag').textContent = '🪙 +' + S.coins;
  const gripOn = S.phase === 'run' && (P.mode === 'wall' || P.grip < P.gripMax - 1);
  $('grip').classList.toggle('on', gripOn); $('gripLbl').classList.toggle('on', gripOn);
  $('gripFill').style.width = Math.max(0, P.grip / P.gripMax * 100) + '%'; $('grip').classList.toggle('low', P.grip < 30);
  $('grip').style.width = 'min(' + (56 * P.gripMax / 100) + 'vw,' + (260 * P.gripMax / 100) + 'px)';   // a longer bar for a bigger grip
  $('gripLbl').textContent = '💪 握力' + (P.gripMax > 100 ? '（上限 ' + P.gripMax + '）' : '');
  $('tired').classList.toggle('on', S.phase === 'run' && P.mode === 'wall' && P.grip < 30);
  sweat.visible = S.phase === 'run' && P.grip < 45; if (sweat.visible){ sweat.position.copy(me.group.position); sweat.position.y += 2.1 + ((now * 1.5) % 1) * -0.6; sweat.position.addScaledVector(softNormal(P.s), 0.4); }
  for (const it of ITEMS) if (it.kind === 'coin' && it.mesh.visible) it.mesh.rotation.y = faceAngle(it.s) + now * 3;
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
