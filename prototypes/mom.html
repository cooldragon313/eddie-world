}
const COSMETICS_BY_ID = Object.fromEntries(COSMETICS.map(c => [c.id, c]));

function attachCosmetics(group, cosmetics){
  if (!cosmetics) return;
  for (const slot of ['hat','face','back','accessory']){
    const id = cosmetics[slot];
    if (!id) continue;
    const def = COSMETICS_BY_ID[id];
    if (!def) continue;
    const m = def.build();
    const off = COSMETIC_OFFSETS[slot], tw = COSMETIC_TWEAKS[id] || {};

// Eddie with the game's usual extras: bat in the right hand (levels swing it),

function buildEddieAvatar(custom, opts){

  if (cos.bag && !cos.back){ const b = makeBagMesh(cos.bag); b.position.set(0, 1.08, 0.55); e.body.add(b); }
  if (cos.accessory) e.scarf.visible = false;              // a necklace/cape replaces the monkey scarf
  if (opts.bat !== false){
    const bat = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.08, 0.95, 12), new THREE.MeshLambertMaterial({ color: 0xc08a4a }));
    bat.position.set(0, -0.61, -0.05); bat.rotation.x = 0.15; (e.arms[1].userData.elbow || e.arms[1]).add(bat);
  }
  attachCosmetics(e.body, cos);
  sbOutline(e.g, 0.035);

// Eddie's body language, shared by every level. Call once per frame after
// placing him; it owns legs/knees/elbows/lean/head/face, the caller keeps
// overall position, facing and any special arm pose (bat swing) applied after.
//   o = { t, dt, moving, phase, onGround, down, victory, swinging }
function animateEddie(A, o){
  const e = A && A.eddie; if (!e) return;
  const st = A._anim || (A._anim = { blinkAt: 2, blinkT: -1, mood: '' });
  const [armL, armR] = e.arms, [legL, legR] = e.legs;
  const eL = armL.userData.elbow, eR = armR.userData.elbow, kL = legL.userData.knee, kR = legR.userData.knee;
  for (const j of [legL, legR, kL, kR, eL, eR, e.head]) j.rotation.set(0, 0, 0);
  e.body.rotation.set(0, 0, 0); e.body.position.set(0, 0, 0);
  armL.rotation.z = -0.14; armR.rotation.z = 0.14;
  const t = o.t || 0, p = o.phase || 0, breath = Math.sin(t * 2.1);
  e.torso.scale.set(1 + breath * 0.012, 1.08 + breath * 0.02, 0.88 + breath * 0.01);
  if (o.victory){
    const b = Math.sin(t * 9), up = Math.abs(Math.sin(t * 4.5));
    armL.rotation.x = armR.rotation.x = 0; armL.rotation.z = -2.4 - b * 0.3; armR.rotation.z = 2.4 - b * 0.3;
    eL.rotation.x = eR.rotation.x = 0.6; e.body.rotation.z = b * 0.15; e.head.rotation.z = -b * 0.18;
    legL.rotation.z = -0.15; legR.rotation.z = 0.15; kL.rotation.x = -up * 0.6; kR.rotation.x = -(1 - up) * 0.6;
    e.body.position.y = up * 0.25;
  } else if (o.onGround === false){
    // airborne: tuck the legs, arms out for balance
    legL.rotation.x = 0.45; legR.rotation.x = -0.1; kL.rotation.x = -0.9; kR.rotation.x = -0.5;
    armL.rotation.z = -1.6; armR.rotation.z = 1.6; eL.rotation.x = eR.rotation.x = 0.4;
  } else if (o.moving){
    const sw = Math.sin(p) * 0.85;
    legL.rotation.x = sw; legR.rotation.x = -sw;
    kL.rotation.x = -(Math.max(0, Math.cos(p)) * 1.2 + 0.1);   // the leg swinging forward folds back at the knee
    kR.rotation.x = -(Math.max(0, -Math.cos(p)) * 1.2 + 0.1);
    armL.rotation.x = -sw; armR.rotation.x = sw;
    eL.rotation.x = eR.rotation.x = 1.1;                         // pumping, bent arms
    e.body.rotation.x = -0.16; e.body.rotation.y = sw * 0.1; e.head.rotation.x = 0.1;
    e.body.position.y = Math.abs(Math.cos(p)) * 0.1;
  } else {
    armL.rotation.x = armR.rotation.x = 0;
    eL.rotation.x = eR.rotation.x = 0.25;
    e.body.rotation.z = Math.sin(t * 0.9) * 0.02;
  }
  if (o.swinging){ eR.rotation.x = 0.15; eL.rotation.x = 0.3; }
  if (o.down){ e.body.rotation.x = 0.3; e.head.rotation.x = -0.25; }
  // face: knocked down = startled, winning = big laugh, otherwise a smile; blink now and then
  const mood = o.down ? 'surprised' : o.victory ? 'laugh' : (o.mood || 'smile');
  if (mood !== st.mood){ st.mood = mood; e.face.set(mood); }
  st.blinkAt -= o.dt || 0.016;
  if (st.blinkAt <= 0 && st.blinkT < 0){ st.blinkT = 0; st.blinkAt = 2.5 + Math.random() * 3; }
  if (st.blinkT >= 0){ st.blinkT += o.dt || 0.016; e.face.blink(Math.sin(Math.min(1, st.blinkT / 0.16) * Math.PI)); if (st.blinkT > 0.16){ st.blinkT = -1; e.face.blink(0); } }
}

    const naughtyBrows = [-1, 1].map(s => { const m = H(sbRoundBox(0.2, 0.05, 0.04, 0.02), ink, s * 0.24, HY + 0.19, -0.71, true); m.rotation.z = s * 0.35; return m; });
    // body: white tee with a light-blue print, light-blue shorts with a white stripe

      const el = new THREE.Group(); el.position.y = -0.24; a.add(el);

        const happy = name === 'happy', cry = name === 'cry', naughty = name === 'naughty', surprised = name === 'surprised';
        eyes.forEach(e => e.visible = !happy && !cry); glints.forEach(gl => gl.visible = !happy && !cry);

    face.set('smile');
    sbOutline(g, 0.03);
    return { g, body, head: headG, arms, legs, torso, face, toy, tears };
  };
})();

function buildAvatar(custom){
  custom = custom || DEFAULT_CUSTOM;
  if (custom.hero !== 'custom') return buildEddieAvatar(custom);   // everyone plays as Eddie
  // Q 版 storybook body: big round head, small round body, stubby limbs.
  // Face points toward -z. Arms/legs are pivot groups at the shoulder/hip so
  // the main loop's rotation.x swings them naturally.
  const g = new THREE.Group();
  const isFem = custom.gender === 'female';
  const M = c => new THREE.MeshLambertMaterial({ color: c });
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  const part = (geo, mat, x, y, z, parent, noLine) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    if (noLine) m.userData.noLine = true;
    (parent || g).add(m); return m;
  };
  const skin = M(custom.skin), shirt = M(custom.shirt), pants = M(custom.pants),
        shoes = M(custom.shoes), hair = M(custom.hairColor);

  // Body
  const torso = part(new THREE.SphereGeometry(0.58, 24, 16), shirt, 0, 1.0, 0);
  torso.scale.set(isFem ? 0.9 : 1.0, 1.1, isFem ? 0.82 : 0.88);
  // Head
  const HEAD_Y = 2.25, HEAD_R = 0.85;
  part(new THREE.SphereGeometry(HEAD_R, 32, 22), skin, 0, HEAD_Y, 0);

  // Face (unlit flat colours, no outline)
  const eyeMat = flat(0x2a1d18), glint = flat(0xffffff), blush = flat(isFem ? 0xff9fb4 : 0xffb3a8);
  for (const s of [-1, 1]){
    const e = part(new THREE.SphereGeometry(0.14, 16, 12), eyeMat, s * 0.29, 2.22, -0.76, g, true);
    e.scale.set(1, 1.35, 0.5);
    part(new THREE.SphereGeometry(0.05, 8, 6), glint, s * 0.29 - 0.045, 2.31, -0.83, g, true);
    if (isFem){
      const lash = part(new THREE.BoxGeometry(0.1, 0.03, 0.03), eyeMat, s * 0.42, 2.37, -0.72, g, true);
      lash.rotation.z = s * -0.5;
    }
    const b = part(new THREE.SphereGeometry(0.11, 12, 8), blush, s * 0.5, 2.03, -0.66, g, true);
    b.scale.set(1, 0.55, 0.35);
  }
  if (custom.expression === 'smile'){
    const smile = part(new THREE.TorusGeometry(0.12, 0.028, 6, 14, Math.PI), flat(0x8a3a2a), 0, 2.02, -0.82, g, true);
    smile.rotation.z = Math.PI;
  } else {
    const m = part(new THREE.SphereGeometry(0.08, 10, 6), flat(0x3a2a22), 0, 1.98, -0.83, g, true);
    m.scale.set(1.3, 0.35, 0.4);
  }

  // Hair
  const hairParts = [];
  const capGeo = new THREE.SphereGeometry(HEAD_R + 0.06, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.55);
  const addCap = () => { const c = part(capGeo, hair, 0, HEAD_Y + 0.02, 0); c.rotation.x = 0.42; return c; };
  if (custom.hair === 'short'){
    addCap();
    part(new THREE.SphereGeometry(0.34, 16, 12), hair, 0, HEAD_Y - 0.12, 0.62);
  } else if (custom.hair === 'cap'){
    const c = part(new THREE.SphereGeometry(HEAD_R + 0.07, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, HEAD_Y + 0.05, 0);
    c.rotation.x = 0.12;
    const brim = part(new THREE.CylinderGeometry(0.62, 0.62, 0.08, 24, 1, false, Math.PI * 0.5, Math.PI), hair, 0, HEAD_Y + 0.28, -0.55);
    brim.rotation.x = -0.12;
    part(new THREE.SphereGeometry(0.09, 10, 8), hair, 0, HEAD_Y + 0.93, 0, g, true);
  } else if (custom.hair === 'spiky'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const spikeGroup = new THREE.Group();
      spikeGroup.position.set(i * 0.34, HEAD_Y + 0.72 - Math.abs(i) * 0.12, 0.05);
      spikeGroup.rotation.z = -i * 0.35;
      part(new THREE.ConeGeometry(0.2, 0.55, 12), hair, 0, 0.24, 0, spikeGroup);
      g.add(spikeGroup);
      hairParts.push({ group: spikeGroup, type: 'spike' });
    }
  } else if (custom.hair === 'long'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const strandGroup = new THREE.Group();
      strandGroup.position.set(i * 0.32, HEAD_Y + 0.35, 0.62);
      const st = part(new THREE.SphereGeometry(0.2, 14, 10), hair, 0, -0.6, 0, strandGroup);
      st.scale.set(1, 3.2, 0.7);
      g.add(strandGroup);
      hairParts.push({ group: strandGroup, type: 'strand' });
    }
  }

  // Legs (pivot at hip)
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.24, 0.62, 0); g.add(l);
    const leg = part(new THREE.SphereGeometry(0.2, 14, 10), pants, 0, -0.22, 0, l); leg.scale.set(1, 1.5, 1);
    const shoe = part(new THREE.SphereGeometry(0.23, 14, 10), shoes, 0, -0.5, -0.07, l); shoe.scale.set(1.1, 0.6, 1.35);
    return l;
  });
  // Arms (pivot at shoulder)
  const armOff = isFem ? 0.56 : 0.6;
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * armOff, 1.32, 0); g.add(a);
    part(new THREE.SphereGeometry(0.2, 14, 10), shirt, 0, -0.06, 0, a);
    const arm = part(new THREE.SphereGeometry(0.16, 14, 10), skin, 0, -0.32, 0, a); arm.scale.set(1, 1.9, 1);
    return a;
  });
  // Wooden bat in the right hand
  const bat = part(new THREE.CylinderGeometry(0.13, 0.08, 0.95, 12), M(0xc08a4a), 0, -0.95, -0.05, arms[1]);
  bat.rotation.x = 0.15;
  // Backpack in the chosen bag skin (hidden when a back cosmetic takes its place)
  if (!(custom.cosmetics && custom.cosmetics.back)){
    const bag = makeBagMesh((custom.cosmetics && custom.cosmetics.bag) || '');
    bag.position.set(0, 1.08, 0.55); g.add(bag);
  }

  attachCosmetics(g, custom.cosmetics);
  return { group: g, legL: legs[0], legR: legs[1], armL: arms[0], armR: arms[1], hairParts };
}

// ============================================================
// MOM (艾迪的媽媽) — from reference photos: long dark-brown hair fading to
// ash-blonde wavy ends, soft side part with face-framing strands, almond
// eyes, brown long-sleeve top, black wide-leg pants, black Mary-Jane flats,
// purple phone lanyard. Faces -z, feet at y=0. Same rig idea as Eddie:
// head pivot, elbows, knees, face controller. Holds a glue stick (熱熔膠條).
// ============================================================
function buildMom(){
  const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  const part = (p, geo, mat, x, y, z, nl) => { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (nl) m.userData.noLine = true; p.add(m); return m; };
  const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);
  const Cy = (a, b, h, n) => new THREE.CylinderGeometry(a, b, h, n || 16);
  // hair colour runs dark at the roots to ash-blonde at the tips (by height)
  const DARK = new THREE.Color(0x2b1e18), MID = new THREE.Color(0x5a4334), ASH = new THREE.Color(0xc2b3a3);
  const hairMat = LM(0xffffff, { vertexColors: true });
  function hairPiece(p, geo, x, y, z, sx, sy, sz, y0, y1){
    const m = part(p, geo, hairMat, x, y, z); m.scale.set(sx || 1, sy || 1, sz || 1);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
    for (let i = 0; i < pos.count; i++){
      const wy = y + pos.getY(i) * (sy || 1), k = Math.min(1, Math.max(0, (y0 - wy) / (y0 - y1)));
      if (k < 0.45) c.copy(DARK).lerp(MID, k / 0.45); else c.copy(MID).lerp(ASH, (k - 0.45) / 0.55);
      col.set([c.r, c.g, c.b], i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return m;
  }
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const skin = LM(0xf3cfb3), top = LM(0x5e3b2c), pants = LM(0x232026), shoe = LM(0x1c1a1d), purple = LM(0x7b5fb0);
  // ---- legs: wide trousers, knee, Mary-Jane flats
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.2, 1.5, 0); body.add(l);
    part(l, Cy(0.22, 0.25, 0.75), pants, 0, -0.37, 0);
    const kn = new THREE.Group(); kn.position.y = -0.72; l.add(kn);
    part(kn, Cy(0.25, 0.33, 0.66, 18), pants, 0, -0.32, 0);
    const f = part(kn, S(0.15, 16, 10), shoe, 0, -0.7, -0.08); f.scale.set(0.9, 0.45, 1.55);
    const strap = part(kn, sbRoundBox(0.25, 0.04, 0.05, 0.02), shoe, 0, -0.64, -0.2, true); strap.rotation.y = s * 0.5;
    part(kn, sbRoundBox(0.06, 0.06, 0.02, 0.01), LM(0xd8d4cc), s * 0.1, -0.64, -0.24, true);
    l.userData.knee = kn; return l;
  });
  // ---- torso: loose brown top
  const torso = part(body, Cy(0.34, 0.47, 1.1, 22), top, 0, 2.02, 0);
  const chest = part(body, S(0.36, 22, 14), top, 0, 2.5, 0); chest.scale.set(1.25, 0.55, 0.95);
  part(body, Cy(0.1, 0.12, 0.25), skin, 0, 2.68, 0);
  // ---- arms: long sleeves, elbows, hands
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * 0.46, 2.47, 0); body.add(a);
    part(a, S(0.14, 12, 10), top, 0, 0, 0);
    part(a, Cy(0.13, 0.11, 0.55), top, 0, -0.28, 0);
    const el = new THREE.Group(); el.position.y = -0.55; a.add(el);
    part(el, Cy(0.11, 0.12, 0.45), top, 0, -0.22, 0);
    const hand = part(el, S(0.09, 12, 10), skin, 0, -0.5, 0); hand.scale.set(0.9, 1.15, 0.8);
    a.userData.elbow = el; return a;
  });
  // glue stick in the right hand, phone on a purple lanyard
  const glue = part(arms[1].userData.elbow, Cy(0.05, 0.05, 1.1, 10), LM(0xfff4d6), 0, -0.52, -0.5);
  glue.rotation.x = Math.PI / 2;
  const lan = part(body, Cy(0.018, 0.018, 1.0, 6), purple, 0.12, 2.15, -0.38, true); lan.rotation.z = 0.32; lan.rotation.x = 0.05;
  const phone = part(body, sbRoundBox(0.16, 0.28, 0.03, 0.02), LM(0x2a2a30), 0.27, 1.62, -0.46);
  const handPhone = part(arms[0].userData.elbow, sbRoundBox(0.16, 0.28, 0.03, 0.02), LM(0x2a2a30), 0, -0.55, -0.1); handPhone.visible = false;
  part(handPhone, new THREE.PlaneGeometry(0.13, 0.24), flat(0x9fd3ff), 0, 0, 0.02, true);
  // ---- head (pivot at the neck)
  const NECK = 2.72, HY = 0.45;
  const headG = new THREE.Group(); headG.position.y = NECK; headG.scale.setScalar(1.4); body.add(headG);   // storybook: a bit big-headed
  const head = part(headG, S(0.5, 32, 22), skin, 0, HY, 0); head.scale.set(0.94, 1.06, 0.96);
  for (const s of [-1, 1]){ const ear = part(headG, S(0.09, 10, 8), skin, s * 0.47, HY - 0.02, 0.04); ear.scale.set(0.5, 1, 0.8); }
  // hair: crown cap, long back curtain, face-framing front strands with wavy ash tips
  const cap = hairPiece(headG, new THREE.SphereGeometry(0.535, 32, 18, 0, Math.PI * 2, 0, Math.PI * 0.5), 0, HY + 0.02, 0.04, 1.0, 1.0, 1.02, 1.2, -1.4);
  cap.rotation.x = 0.38;   // tipped back: the forehead shows
  hairPiece(headG, S(0.56, 26, 20), 0, HY - 0.55, 0.26, 1.06, 1.75, 0.45, 1.2, -1.4);
  for (const s of [-1, 1]){
    // long strands framing the face, falling in front of the shoulders
    const fr = hairPiece(headG, S(0.2, 16, 14), s * 0.5, HY - 0.45, -0.04, 0.45, 2.3, 0.45, 0.6, -1.1); fr.rotation.z = s * -0.06;
    const lo = hairPiece(headG, S(0.2, 16, 12), s * 0.55, HY - 1.05, -0.12, 0.55, 1.4, 0.45, 0.6, -1.1); lo.rotation.z = s * 0.2;
    const tip = hairPiece(headG, S(0.12, 14, 10), s * 0.5, HY - 1.38, -0.15, 1.0, 1.0, 0.7, 0.6, -1.1); tip.rotation.z = s * -0.4;
  }
  // side part: a soft swoop from the left parting across the top of the forehead
  const swoop = hairPiece(headG, S(0.25, 18, 12), -0.1, HY + 0.4, -0.3, 1.55, 0.5, 0.55, 1.2, -1.4); swoop.rotation.z = 0.28;
  const swoop2 = hairPiece(headG, S(0.2, 16, 12), 0.33, HY + 0.28, -0.3, 0.9, 0.7, 0.5, 1.2, -1.4); swoop2.rotation.z = -0.5;
  for (let i = 0; i < 4; i++){   // wavy ends at the back
    const x = (i - 1.5) * 0.24;
    hairPiece(headG, S(0.17, 14, 10), x, HY - 1.38 + Math.abs(x) * 0.15, 0.32, 1, 1.2, 0.8, 1.2, -1.4);
  }
  // face
  const ink = flat(0x241812), white = flat(0xffffff), lip = flat(0xc96a6a), mouthDark = flat(0x6e2626);
  const eyes = [], glints = [], brows = [];
  for (const s of [-1, 1]){
    const e = part(headG, S(0.085, 16, 12), ink, s * 0.19, HY + 0.01, -0.46, true); e.scale.set(1.35, 1.0, 0.45); eyes.push(e);
    glints.push(part(headG, S(0.026, 8, 6), white, s * 0.19 - 0.035, HY + 0.045, -0.5, true));
    const la = part(headG, sbRoundBox(0.2, 0.025, 0.02, 0.01), ink, s * 0.19, HY + 0.085, -0.47, true); la.rotation.z = s * -0.12;
    const b = part(headG, sbRoundBox(0.17, 0.03, 0.02, 0.012), flat(0x4a3428), s * 0.19, HY + 0.2, -0.47, true); b.rotation.z = s * -0.08; brows.push(b);
    const bl = part(headG, S(0.075, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffa8a0, transparent: true, opacity: 0.55 }), s * 0.28, HY - 0.12, -0.42, true); bl.scale.set(1.1, 0.55, 0.3);
  }
  part(headG, S(0.03, 10, 8), LM(0xeab89a), 0, HY - 0.09, -0.49, true);
  const mSmile = part(headG, new THREE.TorusGeometry(0.07, 0.018, 6, 14, Math.PI), lip, 0, HY - 0.17, -0.47, true); mSmile.rotation.z = Math.PI;
  const mFrown = part(headG, new THREE.TorusGeometry(0.065, 0.018, 6, 14, Math.PI), lip, 0, HY - 0.23, -0.47, true);
  const mYell = part(headG, new THREE.CircleGeometry(0.075, 18), mouthDark, 0, HY - 0.2, -0.475, true); mYell.rotation.y = Math.PI; mYell.scale.set(1.1, 1.25, 1);
  const mO = part(headG, new THREE.CircleGeometry(0.045, 14), mouthDark, 0, HY - 0.19, -0.475, true); mO.rotation.y = Math.PI;
  const mFlat = part(headG, sbRoundBox(0.1, 0.018, 0.015, 0.008), lip, 0.02, HY - 0.18, -0.47, true);
  const vein = part(headG, new THREE.TorusGeometry(0.05, 0.012, 4, 10), flat(0xd94b3c), 0.3, HY + 0.3, -0.38, true); vein.rotation.y = 0.6;
  let expr = '';
  const eyeY = () => expr === 'suspicious' ? 0.45 : expr === 'shocked' ? 1.35 : expr === 'angry' || expr === 'yell' ? 0.8 : 1.0;
  const face = {
    set(name){
      if (name === expr) return; expr = name;
      const angry = name === 'angry' || name === 'yell', sus = name === 'suspicious', shock = name === 'shocked';
      mSmile.visible = name === 'smile'; mFrown.visible = name === 'angry'; mYell.visible = name === 'yell'; mO.visible = shock; mFlat.visible = sus;
      vein.visible = angry;
      brows.forEach((b, i) => { const s = i ? 1 : -1;
        b.rotation.z = angry ? s * 0.45 : sus ? (i ? -0.25 : 0.05) : shock ? s * -0.25 : s * -0.08;
        b.position.y = HY + (angry ? 0.15 : shock ? 0.25 : sus && i ? 0.23 : 0.2); });
      eyes.forEach(e => e.scale.set(1.35, eyeY(), 0.45));
      glints.forEach(gl => gl.visible = !sus);
    },
    blink(k){ eyes.forEach(e => e.scale.y = eyeY() * (1 - k * 0.9)); },
    get name(){ return expr; },
  };
  face.set('smile');
  sbOutline(g, 0.025);
  return { g, body, head: headG, arms, legs, torso, face, glue, phone, handPhone };
}

const mom = buildMom(); scene.add(mom.g);
let eddie = null;

// ---------- moves ----------
let yaw = 0, t = 0, act = null, actT = 0, walking = false, blinkAt = 2, blinkT = -1, fi = 0;
const FACES = ['smile', 'suspicious', 'angry', 'yell', 'shocked'];
const ease = k => k * k * (3 - 2 * k);
const btn = (id, f) => $(id).addEventListener('click', f);
const go = (a, f) => { act = a; actT = 0; walking = false; mom.face.set(f); };
btn('bWalk', () => { walking = !walking; act = null; mom.face.set('smile'); });
btn('bPeek', () => go('peek', 'suspicious'));
btn('bWhip', () => go('whip', 'yell'));
btn('bHips', () => go('hips', 'angry'));
btn('bPhone', () => go('phone', 'smile'));
btn('bFace', () => { act = null; fi = (fi + 1) % FACES.length; mom.face.set(FACES[fi]); });
btn('bEddie', () => {
  if (eddie){ scene.remove(eddie.group); eddie = null; mom.g.position.x = 0; return; }
  eddie = buildEddieAvatar(DEFAULT_CUSTOM, { bat: false }); eddie.group.position.x = -1.1; scene.add(eddie.group); mom.g.position.x = 0.7;
});
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = e.clientX; });
addEventListener('pointermove', e => { if (drag === null) return; yaw += (e.clientX - drag) * 0.01; drag = e.clientX; });
addEventListener('pointerup', () => { drag = null; });

const [aL, aR] = mom.arms, [lL, lR] = mom.legs, eL = aL.userData.elbow, eR = aR.userData.elbow, kL = lL.userData.knee, kR = lR.userData.knee;
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0.016; last = now; t += dt;
  mom.g.rotation.y = yaw;
  for (const j of [aL, aR, lL, lR, eL, eR, kL, kR, mom.head, mom.body]) j.rotation.set(0, 0, 0);
  mom.body.position.set(0, 0, 0);
  mom.handPhone.visible = act === 'phone'; mom.phone.visible = act !== 'phone';
  const br = Math.sin(t * 2.2);
  mom.torso.scale.set(1 + br * 0.015, 1 + br * 0.01, 1);
  aL.rotation.z = -0.12; aR.rotation.z = 0.12; eL.rotation.x = eR.rotation.x = 0.25;
  mom.head.rotation.z = Math.sin(t * 1.1) * 0.03;
  if (walking){
    const p = t * 6, w = Math.sin(p);
    lL.rotation.x = w * 0.45; lR.rotation.x = -w * 0.45;
    kL.rotation.x = -Math.max(0, Math.sin(p + 1.2)) * 0.5; kR.rotation.x = -Math.max(0, -Math.sin(p + 1.2)) * 0.5;
    aL.rotation.x = -w * 0.4; aR.rotation.x = w * 0.4; eL.rotation.x = eR.rotation.x = 0.35;
    mom.body.position.y = Math.abs(Math.cos(p)) * 0.04; mom.body.rotation.y = w * 0.06;
  }
  if (act === 'peek'){
    actT += dt;
    // lean round a door frame, eyes narrowed, slow look left-right
    const k = ease(Math.min(1, actT / 0.4)) * (actT > 2.6 ? Math.max(0, 1 - (actT - 2.6) / 0.4) : 1);
    mom.body.rotation.z = -0.22 * k; mom.body.position.x = -0.2 * k;
    mom.head.rotation.z = 0.15 * k; mom.head.rotation.y = Math.sin(actT * 1.6) * 0.4 * k;
    aR.rotation.z = 1.2 * k; aR.rotation.x = -0.5 * k; eR.rotation.x = 1.3 * k;   // hand on the door frame
    if (actT > 3){ act = null; mom.face.set('smile'); }
  } else if (act === 'whip'){
    actT += dt;
    const c = actT % 0.9, up = c < 0.4 ? ease(c / 0.4) : 0, down = c >= 0.4 ? 1 - ease(Math.min(1, (c - 0.4) / 0.2)) : 0;
    aR.rotation.x = -2.9 * (c < 0.4 ? up : down) + (c >= 0.4 && c < 0.6 ? 0.6 : 0);
    eR.rotation.x = 0.6 * up;
    mom.body.rotation.y = -0.2 * up + 0.15 * (1 - down) * (c >= 0.4 ? 1 : 0);
    aL.rotation.z = -0.6; eL.rotation.x = 1.6; aL.rotation.x = -0.4;   // other fist on the hip
    mom.head.rotation.x = 0.08;
    if (actT > 2.7){ act = null; mom.face.set('smile'); }
  } else if (act === 'hips'){
    actT += dt;
    const k = ease(Math.min(1, actT / 0.3));
    aL.rotation.z = -0.75 * k; aR.rotation.z = 0.75 * k;
    eL.rotation.z = 1.9 * k; eR.rotation.z = -1.9 * k;
    mom.head.rotation.x = 0.1 * k; mom.head.rotation.z = Math.sin(actT * 3) * 0.05;
    lL.rotation.z = -0.08 * k; lR.rotation.z = 0.08 * k;
    mom.body.position.y = actT > 0.6 ? Math.abs(Math.sin(actT * 9)) * 0.02 : 0;   // foot tapping
    if (actT > 2.6){ act = null; mom.face.set('smile'); }
  } else if (act === 'phone'){
    actT += dt;
    const k = ease(Math.min(1, actT / 0.4));
    aL.rotation.x = -1.1 * k; eL.rotation.x = 1.5 * k; aL.rotation.z = 0.25 * k;
    mom.head.rotation.x = 0.28 * k;
    if (actT > 1.2) mom.face.set(Math.floor(actT * 0.8) % 2 ? 'smile' : 'shocked');
    if (actT > 3.6){ act = null; mom.face.set('smile'); }
  }
  blinkAt -= dt;
  if (blinkAt <= 0 && blinkT < 0){ blinkT = 0; blinkAt = 2 + Math.random() * 3; }
  if (blinkT >= 0){ blinkT += dt; mom.face.blink(Math.sin(Math.min(1, blinkT / 0.16) * Math.PI)); if (blinkT > 0.16){ blinkT = -1; mom.face.blink(0); } }
  if (eddie) animateEddie(eddie, { t, dt, moving: false, onGround: true });
  const mobile = innerWidth < innerHeight;
  camera.position.set(0, 2.5, mobile ? -13 : -10.5);
  camera.lookAt(0, 2.15, 0);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
