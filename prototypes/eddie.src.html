<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>艾迪原型</title>
<!--
  SOURCE — edit this file, then run:  python tools/build_proto.py eddie
  Writes prototypes/eddie.html with the storybook look copied from island.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --sb-paper:#fff8ec; --sb-ink:#5b3a29; --sb-text:#4a3426; --sb-muted:#9a7d5f; --sb-line:#e2c9a0;
    --sb-gold-soft:#ffcf5a; --sb-sky:#6fb3e0;
    --sb-font:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color-scheme:light;
  }
  html,body{height:100%}
  body{margin:0;position:fixed;inset:0;overflow:hidden;color:var(--sb-text);font-family:var(--sb-font);
       background:radial-gradient(circle at 50% 60%,#fff6e4,#cfe6f0 75%);user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  #head{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;pointer-events:none;z-index:2}
  #head h1{margin:0;font:900 30px var(--sb-font);color:#ffcf5a;-webkit-text-stroke:3px var(--sb-ink);paint-order:stroke fill;letter-spacing:2px;white-space:nowrap}
  #head p{margin:2px 0 0;font:700 14px var(--sb-font);color:var(--sb-muted)}
  #bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px;z-index:2}
  .btn{font:700 15px var(--sb-font);background:var(--sb-gold-soft);color:var(--sb-ink);border:2.5px solid var(--sb-ink);border-radius:999px;
       padding:7px 16px;cursor:pointer;box-shadow:0 4px 0 rgba(91,58,41,.35)}
  .btn[aria-pressed="true"]{background:var(--sb-ink);color:#fff}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(91,58,41,.35)}
  .btn:focus-visible{outline:3px solid var(--sb-sky);outline-offset:2px}
  #tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));font:600 12px var(--sb-font);color:var(--sb-muted);pointer-events:none;white-space:nowrap;z-index:2}
  @media (max-height:520px){ #head h1{font-size:20px;-webkit-text-stroke:2px var(--sb-ink)} #head p{font-size:11px} .btn{font-size:13px;padding:5px 12px} #tip{display:none} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="head"><h1>艾迪的幻想世界</h1><p>主角原型：艾迪</p></div>
<div id="tip">手指拖曳可以轉艾迪</div>
<div id="bar">
  <button class="btn" id="bWave">👋 揮手</button>
  <button class="btn" id="bRun">🏃 跑步</button>
  <button class="btn" id="bJump">⬆ 跳</button>
  <button class="btn" id="bSpin">🔄 轉一圈</button>
  <button class="btn" id="bScarf" aria-pressed="true">🦧 猩猩圍巾</button>
  <button class="btn" id="bBag" aria-pressed="true">🎒 背包</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*@@INCLUDE:LOOK@@*/

(() => {
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff2dc, 0xb9d99c, 0.8));
const sun = new THREE.DirectionalLight(0xffeccc, 0.55); sun.position.set(-3, 6, -6); scene.add(sun);
function fit(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h;
  camera.fov = w < h ? 44 : 30; camera.updateProjectionMatrix();
}
addEventListener('resize', fit); fit();

const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const flat = c => new THREE.MeshBasicMaterial({ color: c });
function part(parent, geo, mat, x, y, z, noLine){ const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (noLine) m.userData.noLine = true; parent.add(m); return m; }
const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);

// Galaxy print for the backpack
function galaxyTex(){
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 128, 128); g.addColorStop(0, '#1c2a6b'); g.addColorStop(0.5, '#3a3d9a'); g.addColorStop(1, '#1b6f8f');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 40; i++){ x.fillStyle = Math.random() < 0.3 ? '#ffe9a8' : '#ffffff'; const s = Math.random() * 2.2 + 0.6; x.fillRect(Math.random() * 128, Math.random() * 128, s, s); }
  x.fillStyle = 'rgba(120,220,255,.35)'; x.beginPath(); x.ellipse(70, 60, 40, 14, -0.6, 0, 6.3); x.fill();
  const t = new THREE.CanvasTexture(c); return t;
}

// ---------- Eddie (Q 版 · 繪本), faces -z ----------
const SKIN = 0xf6cdb4, HAIR = 0x1f1a1a;
function buildEddie(){
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const skin = LM(SKIN), hair = LM(HAIR), tee = LM(0xf7f6f0), shorts = LM(0x6e7046), sock = LM(0x2a2a2a), shoe = LM(0xf2f2ee), sole = LM(0xc9c9c2);
  const HY = 2.25;
  // head: round, a touch wider than tall
  const head = part(body, S(0.86, 32, 22), skin, 0, HY, 0); head.scale.set(1.04, 0.98, 1);
  for (const s of [-1, 1]){ const ear = part(body, S(0.19, 14, 10), skin, s * 0.9, HY - 0.04, 0.05); ear.scale.set(0.5, 1, 0.8); }
  // hair: one black shell hugging the head (no second layer = no hat brim);
  // short on the sides just by being skin-tight, length only from the tufts on top
  const shellGeo = new THREE.SphereGeometry(0.875, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.56);
  const shell = part(body, shellGeo, hair, 0, HY + 0.0, 0.04); shell.rotation.x = 0.32; shell.scale.set(1.045, 0.99, 1.01);
  const hairSpikes = [];
  const tufts = [];
  for (let row = 0; row < 3; row++){
    const n = [5, 6, 5][row], z = [-0.42, -0.05, 0.32][row], y = [0.66, 0.76, 0.7][row];
    for (let i = 0; i < n; i++){
      const x = (i - (n - 1) / 2) * 0.2 * (row === 1 ? 1.05 : 1);
      const front = row === 0, mid = Math.abs(x) < 0.15;
      const centre = 1 - Math.min(1, Math.abs(x) / 0.55);      // 1 in the middle, 0 at the sides
      tufts.push([x, y + 0.1 - Math.abs(x) * 0.3, z, front ? 0.15 : 0.16, (front ? 0.36 : 0.3) + centre * 0.26, front ? -0.4 : row === 1 ? -0.12 : 0.32]);
    }
  }
  for (const [x, y, z, r, h, tilt] of tufts){
    const pivot = new THREE.Group(); pivot.position.set(x, HY + y - 0.12, z); pivot.rotation.x = tilt; pivot.rotation.z = x * 0.75;
    part(pivot, new THREE.ConeGeometry(r, h, 8), hair, 0, h / 2 - 0.06, 0, true);
    body.add(pivot); hairSpikes.push(pivot);
  }
  // face
  const ink = flat(0x22180f), white = flat(0xffffff);
  for (const s of [-1, 1]){
    const brow = part(body, sbRoundBox(0.26, 0.07, 0.05, 0.03), ink, s * 0.3, HY + 0.24, -0.79, true); brow.rotation.z = s * -0.12;
    const eye = part(body, S(0.12, 16, 12), ink, s * 0.29, HY + 0.02, -0.78, true); eye.scale.set(1, 1.05, 0.5);
    part(body, S(0.04, 8, 6), white, s * 0.29 - 0.04, HY + 0.07, -0.84, true);
    const cheek = part(body, S(0.11, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffb3a8, transparent: true, opacity: 0.8 }), s * 0.52, HY - 0.15, -0.66, true);
    cheek.scale.set(1, 0.55, 0.35);
  }
  part(body, S(0.06, 10, 8), LM(0xe8b48f), 0, HY - 0.1, -0.85, true);                 // nose
  const mouth = part(body, new THREE.CircleGeometry(0.17, 20, Math.PI, Math.PI), flat(0x7a2a2a), 0, HY - 0.26, -0.845, true);   // big open smile
  mouth.scale.set(1.15, 0.95, 1); mouth.rotation.y = Math.PI;
  part(body, new THREE.PlaneGeometry(0.3, 0.06), white, 0, HY - 0.275, -0.85, true).rotation.y = Math.PI;    // top teeth
  const tongue = part(body, new THREE.CircleGeometry(0.07, 14, Math.PI, Math.PI), flat(0xf08a8a), 0, HY - 0.38, -0.849, true);
  tongue.scale.set(1.3, 0.8, 1); tongue.rotation.y = Math.PI;
  // body: white tee
  const torso = part(body, S(0.6, 24, 16), tee, 0, 1.0, 0); torso.scale.set(1.0, 1.08, 0.88);
  part(body, new THREE.CylinderGeometry(0.2, 0.24, 0.12, 16), tee, 0, 1.6, 0);          // collar
  // shorts (hips)
  const hips = part(body, S(0.5, 20, 12), shorts, 0, 0.72, 0); hips.scale.set(1.08, 0.55, 0.9);
  // arms (pivot at shoulder); wristband on the left
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * 0.6, 1.34, 0); body.add(a);
    part(a, S(0.22, 14, 10), tee, 0, -0.06, 0);
    const arm = part(a, S(0.15, 14, 10), skin, 0, -0.34, 0); arm.scale.set(1, 1.9, 1);
    part(a, S(0.13, 12, 10), skin, 0, -0.62, 0);   // hand
    if (s < 0){ const band = part(a, new THREE.TorusGeometry(0.13, 0.04, 8, 16), LM(0xffffff), 0, -0.5, 0); band.rotation.x = Math.PI / 2; }
    return a;
  });
  // legs: shorts → shin → black sock → white sneaker
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.25, 0.66, 0); body.add(l);
    const thigh = part(l, S(0.24, 14, 10), shorts, 0, -0.1, 0); thigh.scale.set(1, 1.15, 1);
    const shin = part(l, S(0.15, 14, 10), skin, 0, -0.3, 0); shin.scale.set(1, 1.2, 1);
    part(l, new THREE.CylinderGeometry(0.14, 0.14, 0.1, 14), sock, 0, -0.46, 0);
    const sh = part(l, S(0.22, 16, 10), shoe, 0, -0.55, -0.07); sh.scale.set(1.1, 0.6, 1.4);
    const so = part(l, new THREE.CylinderGeometry(0.23, 0.23, 0.05, 18), sole, 0, -0.63, -0.07); so.scale.set(1.05, 1, 1.35);
    return l;
  });
  // galaxy backpack
  const bag = new THREE.Group();
  part(bag, sbRoundBox(0.72, 0.82, 0.34, 0.14), LM(0xffffff, { map: galaxyTex() }), 0, 0, 0);
  part(bag, sbRoundBox(0.5, 0.3, 0.1, 0.06), LM(0x1b1b2a), 0, -0.18, 0.18);
  for (const s of [-1, 1]) part(bag, sbRoundBox(0.1, 0.8, 0.08, 0.03), LM(0x1b1b2a), s * 0.26, 0.05, -0.2);
  bag.position.set(0, 1.08, 0.56); body.add(bag);
  // orange orangutan plush scarf (like the one from Baltimore)
  const scarf = new THREE.Group();
  const fur = LM(0xff8a2a), fur2 = LM(0xffc83d), face = LM(0xffd84a);
  const ring = part(scarf, new THREE.TorusGeometry(0.42, 0.13, 10, 24), fur, 0, 0, 0); ring.rotation.x = Math.PI / 2 - 0.25;
  for (let i = 0; i < 6; i++){ const a = i / 6 * Math.PI * 2; part(scarf, S(0.1, 10, 8), fur2, Math.cos(a) * 0.42, 0.06, Math.sin(a) * 0.42); }
  for (const s of [-1, 1]){ const tail = part(scarf, S(0.11, 12, 8), s < 0 ? fur : fur2, s * 0.22, -0.4, -0.5); tail.scale.set(1, 2.2, 0.8); }
  const monkey = new THREE.Group();
  part(monkey, S(0.2, 16, 12), fur, 0, 0, 0);
  const mf = part(monkey, S(0.14, 14, 10), face, 0, -0.02, -0.12); mf.scale.set(1.15, 0.85, 0.6);
  for (const s of [-1, 1]){
    part(monkey, S(0.065, 12, 8), LM(0xffffff), s * 0.07, 0.06, -0.17, true);      // big googly eyes
    part(monkey, S(0.035, 8, 6), ink, s * 0.07, 0.06, -0.225, true);
    part(monkey, S(0.06, 10, 8), fur, s * 0.19, 0.02, 0);
  }
  const hood = part(monkey, sbRoundBox(0.34, 0.3, 0.16, 0.06), fur, 0, -0.27, -0.03);
  monkey.position.set(0.08, -0.25, -0.5); scarf.add(monkey);
  scarf.position.set(0, 1.58, -0.02); body.add(scarf);

  sbOutline(g, 0.035);
  return { g, body, arms, legs, scarf, bag, hairSpikes };
}
const ed = buildEddie(); scene.add(ed.g);

// ---------- poses ----------
let yaw = 0, spin = 0, act = null, actT = 0, running = false, jumpT = -1, t = 0;
const btn = (id, on) => $(id).addEventListener('click', on);
btn('bWave', () => { act = 'wave'; actT = 0; });
btn('bRun', () => { running = !running; $('bRun').setAttribute('aria-pressed', String(running)); });
btn('bJump', () => { if (jumpT < 0) jumpT = 0; });
btn('bSpin', () => { spin = Math.PI * 2; });
btn('bScarf', () => { ed.scarf.visible = !ed.scarf.visible; $('bScarf').setAttribute('aria-pressed', String(ed.scarf.visible)); });
btn('bBag', () => { ed.bag.visible = !ed.bag.visible; $('bBag').setAttribute('aria-pressed', String(ed.bag.visible)); });
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = e.clientX; });
addEventListener('pointermove', e => { if (drag === null) return; yaw += (e.clientX - drag) * 0.01; drag = e.clientX; });
addEventListener('pointerup', () => { drag = null; });

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0.016; last = now; t += dt;
  if (spin > 0){ const s = Math.min(spin, dt * 6); spin -= s; yaw += s; }
  ed.g.rotation.y = yaw;     // model faces -z, the camera sits on -z
  // limbs
  for (const l of [...ed.arms, ...ed.legs]){ l.rotation.x = 0; l.rotation.z = 0; }
  let bob = Math.sin(t * 2.2) * 0.03;
  if (running){
    const p = t * 11, sw = Math.sin(p) * 0.8;
    ed.legs[0].rotation.x = sw; ed.legs[1].rotation.x = -sw; ed.arms[0].rotation.x = -sw * 0.8; ed.arms[1].rotation.x = sw * 0.8;
    bob = Math.abs(Math.sin(p)) * 0.12;
  }
  if (act === 'wave'){
    actT += dt;
    ed.arms[1].rotation.z = 2.6; ed.arms[1].rotation.x = -0.2 + Math.sin(actT * 14) * 0.35;
    if (actT > 1.6) act = null;
  } else {
    ed.arms[0].rotation.z = -0.12; ed.arms[1].rotation.z = 0.12;
  }
  let jy = 0;
  if (jumpT >= 0){ jumpT += dt; jy = Math.max(0, 6 * jumpT - 13 * jumpT * jumpT); if (jumpT > 0.5){ jumpT = -1; } ed.arms[0].rotation.z = -1; ed.arms[1].rotation.z = 1; }
  ed.body.position.y = bob + jy;
  for (const [i, s] of ed.hairSpikes.entries()) s.rotation.y = Math.sin(t * 3 + i) * (running ? 0.08 : 0.02);
  const mobile = innerWidth < innerHeight;
  camera.position.set(0, 2.1, mobile ? -12 : -10.5);
  camera.lookAt(0, 1.6, 0);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
