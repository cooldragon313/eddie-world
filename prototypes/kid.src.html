<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>小屁孩原型</title>
<!--
  SOURCE — edit this file, then run:  python tools/build_proto.py kid
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --sb-paper:#fff8ec; --sb-ink:#5b3a29; --sb-text:#4a3426; --sb-muted:#9a7d5f;
    --sb-gold-soft:#ffcf5a; --sb-sky:#6fb3e0;
    --sb-font:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color-scheme:light;
  }
  html,body{height:100%}
  body{margin:0;position:fixed;inset:0;overflow:hidden;color:var(--sb-text);font-family:var(--sb-font);
       background:radial-gradient(circle at 50% 60%,#fff6e4,#ffe1ea 75%);user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  #head{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;pointer-events:none;z-index:2}
  #head h1{margin:0;font:900 30px var(--sb-font);color:#ffcf5a;-webkit-text-stroke:3px var(--sb-ink);paint-order:stroke fill;letter-spacing:2px;white-space:nowrap}
  #head p{margin:2px 0 0;font:700 14px var(--sb-font);color:var(--sb-muted)}
  #bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px;z-index:2}
  .btn{font:700 15px var(--sb-font);background:var(--sb-gold-soft);color:var(--sb-ink);border:2.5px solid var(--sb-ink);border-radius:999px;
       padding:7px 16px;cursor:pointer;box-shadow:0 4px 0 rgba(91,58,41,.35)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(91,58,41,.35)}
  .btn:focus-visible{outline:3px solid var(--sb-sky);outline-offset:2px}
  #tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));font:600 12px var(--sb-font);color:var(--sb-muted);pointer-events:none;white-space:nowrap;z-index:2}
  @media (max-height:520px){ #head h1{font-size:20px;-webkit-text-stroke:2px var(--sb-ink)} #head p{font-size:11px} .btn{font-size:13px;padding:5px 12px} #tip{display:none} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="head"><h1>小屁孩</h1><p>原型：土星家的小屁孩（旁邊是艾迪，比身高用）</p></div>
<div id="tip">手指拖曳可以轉</div>
<div id="bar">
  <button class="btn" id="bWalk">🚼 搖搖擺擺走</button>
  <button class="btn" id="bThrow">🧸 丟東西</button>
  <button class="btn" id="bClap">👏 拍手笑</button>
  <button class="btn" id="bCry">😭 大哭</button>
  <button class="btn" id="bNaughty">😈 壞笑</button>
  <button class="btn" id="bEddie">👦 艾迪</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*@@INCLUDE:LOOK@@*/

/*@@INCLUDE:AVATAR@@*/

(() => {
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff2dc, 0xb9d99c, 0.8));
const sun = new THREE.DirectionalLight(0xffeccc, 0.55); sun.position.set(-3, 6, -6); scene.add(sun);
function fit(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 44 : 30; camera.updateProjectionMatrix(); }
addEventListener('resize', fit); fit();

const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const flat = c => new THREE.MeshBasicMaterial({ color: c });
function part(parent, geo, mat, x, y, z, noLine){ const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (noLine) m.userData.noLine = true; parent.add(m); return m; }
const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);

// ---------- the little kid (faces -z, ~2/3 of Eddie's height) ----------
function buildKid(){
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const skin = LM(0xffd9c4), hair = LM(0x3a2a22), tee = LM(0xffd84a), diaper = LM(0xffffff), tape = LM(0x8fd0f0);
  const NECK = 1.05, HY = 1.55;
  const headG = new THREE.Group(); headG.position.y = NECK; body.add(headG);
  const H = (geo, mat, x, y, z, nl) => part(headG, geo, mat, x, y - NECK, z, nl);
  // big round baby head, chubby cheeks
  const head = H(S(0.72, 32, 22), skin, 0, HY, 0); head.scale.set(1.06, 0.98, 1);
  for (const s of [-1, 1]){
    const cheek = H(S(0.26, 16, 12), skin, s * 0.38, HY - 0.25, -0.42); cheek.scale.set(1, 0.85, 0.7);
    const ear = H(S(0.14, 12, 8), skin, s * 0.74, HY - 0.02, 0.05); ear.scale.set(0.5, 1, 0.8);
  }
  // hair: a little curl on top + a soft fringe
  const fringe = H(new THREE.SphereGeometry(0.75, 32, 14, 0, Math.PI * 2, 0, Math.PI * 0.3), hair, 0, HY + 0.03, 0.04); fringe.rotation.x = 0.2;
  const curl = H(new THREE.TorusGeometry(0.15, 0.06, 8, 16, Math.PI * 1.6), hair, 0, HY + 0.86, 0.02); curl.rotation.y = Math.PI / 2;
  for (const s of [-1, 0, 1]){ const tf = H(new THREE.ConeGeometry(0.09, 0.22, 8), hair, s * 0.16, HY + 0.62, -0.42 + Math.abs(s) * 0.05); tf.rotation.x = -0.9; tf.rotation.z = -s * 0.4; }
  // face
  const ink = flat(0x22180f), white = flat(0xffffff);
  const eyes = [], glints = [];
  for (const s of [-1, 1]){
    const e = H(S(0.115, 16, 12), ink, s * 0.24, HY + 0.02, -0.7, true); e.scale.set(1, 1.2, 0.5); eyes.push(e);
    const gl = H(S(0.045, 8, 6), white, s * 0.24 - 0.035, HY + 0.08, -0.755, true); glints.push(gl);
    const b = H(S(0.12, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff9fb0, transparent: true, opacity: 0.85 }), s * 0.42, HY - 0.15, -0.56, true); b.scale.set(1, 0.6, 0.35);
  }
  // mouths
  const mouthSmile = H(new THREE.CircleGeometry(0.1, 16, Math.PI, Math.PI), flat(0x7a2a2a), 0, HY - 0.22, -0.715, true); mouthSmile.rotation.y = Math.PI;
  const mouthCry = H(new THREE.CircleGeometry(0.15, 18), flat(0x7a2a2a), 0, HY - 0.26, -0.71, true); mouthCry.rotation.y = Math.PI; mouthCry.scale.set(1.2, 0.9, 1);
  const mouthGrin = H(new THREE.TorusGeometry(0.11, 0.025, 6, 14, Math.PI), flat(0x7a2a2a), 0.04, HY - 0.18, -0.72, true); mouthGrin.rotation.z = Math.PI * 1.1;
  const happyEyes = [-1, 1].map(s => H(new THREE.TorusGeometry(0.08, 0.025, 6, 14, Math.PI), ink, s * 0.24, HY + 0.0, -0.71, true));
  const cryEyes = [-1, 1].map(s => { const m = H(new THREE.TorusGeometry(0.08, 0.025, 6, 14, Math.PI), ink, s * 0.24, HY + 0.04, -0.71, true); m.rotation.z = Math.PI; return m; });
  const tears = [-1, 1].map(s => { const m = H(S(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: 0x8fd0f0 }), s * 0.3, HY - 0.1, -0.68, true); m.scale.set(0.8, 1.5, 0.5); return m; });
  const naughtyBrows = [-1, 1].map(s => { const m = H(sbRoundBox(0.2, 0.05, 0.04, 0.02), ink, s * 0.24, HY + 0.2, -0.7, true); m.rotation.z = s * 0.35; return m; });
  // pacifier
  const paci = new THREE.Group();
  part(paci, new THREE.CylinderGeometry(0.16, 0.16, 0.05, 20), LM(0x8fd0f0), 0, 0, 0).rotation.x = Math.PI / 2;
  part(paci, new THREE.TorusGeometry(0.1, 0.025, 8, 16), LM(0xff8fb0), 0, 0, -0.06);
  paci.position.set(0, HY - 0.24 - NECK, -0.74); headG.add(paci);
  // body: chubby tummy in a yellow tee with a little Saturn, diaper below
  const torso = part(body, S(0.5, 24, 16), tee, 0, 0.62, 0); torso.scale.set(1.0, 0.95, 0.9);
  const print = part(body, new THREE.CircleGeometry(0.13, 18), flat(0xffb35c), 0, 0.68, -0.455, true); print.rotation.y = Math.PI;
  const ringp = part(body, new THREE.TorusGeometry(0.2, 0.02, 6, 24), flat(0xd9884a), 0, 0.68, -0.46, true); ringp.scale.set(1, 0.3, 1); ringp.rotation.z = -0.3;
  const dia = part(body, S(0.46, 22, 14), diaper, 0, 0.3, 0); dia.scale.set(1.08, 0.62, 0.95);
  for (const s of [-1, 1]) part(body, sbRoundBox(0.12, 0.08, 0.05, 0.02), tape, s * 0.3, 0.42, -0.4, true);
  // arms: shoulder → elbow, chubby hands
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * 0.46, 0.86, 0); body.add(a);
    part(a, S(0.15, 12, 10), tee, 0, -0.04, 0);
    const up = part(a, S(0.12, 12, 10), skin, 0, -0.14, 0); up.scale.set(1, 1.1, 1);
    const el = new THREE.Group(); el.position.y = -0.24; a.add(el);
    const fo = part(el, S(0.11, 12, 10), skin, 0, -0.08, 0); fo.scale.set(1, 1.1, 1);
    part(el, S(0.12, 12, 10), skin, 0, -0.2, 0);
    a.userData.elbow = el; return a;
  });
  // legs: short and chubby, bare feet
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.2, 0.26, 0); body.add(l);
    const th = part(l, S(0.16, 12, 10), skin, 0, -0.06, 0); th.scale.set(1, 1.0, 1);
    const kn = new THREE.Group(); kn.position.y = -0.14; l.add(kn);
    const foot = part(kn, S(0.15, 14, 10), skin, 0, -0.08, -0.06); foot.scale.set(1, 0.6, 1.35);
    l.userData.knee = kn; return l;
  });
  // the toy he carries around (and throws)
  const toy = new THREE.Group();
  part(toy, sbRoundBox(0.34, 0.18, 0.5, 0.06), LM(0xe0584a), 0, 0, 0);
  part(toy, sbRoundBox(0.26, 0.14, 0.24, 0.05), LM(0x8fd0f0), 0, 0.14, 0.04);
  for (const [x, z] of [[-0.18, -0.17], [0.18, -0.17], [-0.18, 0.17], [0.18, 0.17]]){ const w = part(toy, new THREE.CylinderGeometry(0.07, 0.07, 0.06, 12), LM(0x2a2a2a), x, -0.09, z); w.rotation.z = Math.PI / 2; }
  toy.position.set(0, -0.3, -0.1); arms[1].userData.elbow.add(toy);

  const face = {
    set(name){
      const happy = name === 'happy', cry = name === 'cry', naughty = name === 'naughty';
      eyes.forEach(e => e.visible = !happy && !cry); glints.forEach(g => g.visible = !happy && !cry);
      happyEyes.forEach(m => m.visible = happy); cryEyes.forEach(m => m.visible = cry); tears.forEach(m => m.visible = cry);
      naughtyBrows.forEach(m => m.visible = naughty);
      mouthSmile.visible = name === 'smile' || happy; mouthCry.visible = cry; mouthGrin.visible = naughty;
      paci.visible = name === 'smile';
    },
    blink(k){ eyes.forEach(e => e.scale.y = 1.2 * (1 - k * 0.92)); },
  };
  face.set('smile');
  sbOutline(g, 0.03);
  return { g, body, head: headG, arms, legs, torso, face, toy, tears };
}

const kid = buildKid(); scene.add(kid.g);
let eddie = null;

// ---------- moves ----------
let yaw = 0, t = 0, act = null, actT = 0, walking = false, blinkAt = 2, blinkT = -1;
const ease = k => k * k * (3 - 2 * k);
const btn = (id, f) => $(id).addEventListener('click', f);
btn('bWalk', () => { walking = !walking; act = null; kid.face.set(walking ? 'happy' : 'smile'); });
btn('bThrow', () => { act = 'throw'; actT = 0; walking = false; kid.face.set('naughty'); });
btn('bClap', () => { act = 'clap'; actT = 0; walking = false; kid.face.set('happy'); });
btn('bCry', () => { act = 'cry'; actT = 0; walking = false; kid.face.set('cry'); });
btn('bNaughty', () => { act = 'naughty'; actT = 0; walking = false; kid.face.set('naughty'); });
btn('bEddie', () => {
  if (eddie){ scene.remove(eddie.group); eddie = null; kid.g.position.x = 0; return; }
  eddie = buildEddieAvatar(DEFAULT_CUSTOM, { bat: false }); eddie.group.position.x = -1.6; scene.add(eddie.group); kid.g.position.x = 0.9;
});
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = e.clientX; });
addEventListener('pointermove', e => { if (drag === null) return; yaw += (e.clientX - drag) * 0.01; drag = e.clientX; });
addEventListener('pointerup', () => { drag = null; });

const [aL, aR] = kid.arms, [lL, lR] = kid.legs, eL = aL.userData.elbow, eR = aR.userData.elbow, kL = lL.userData.knee, kR = lR.userData.knee;
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0.016; last = now; t += dt;
  kid.g.rotation.y = yaw;
  for (const j of [aL, aR, lL, lR, eL, eR, kL, kR, kid.head, kid.body]) j.rotation.set(0, 0, 0);
  kid.body.position.set(0, 0, 0);
  kid.toy.visible = act === 'throw' ? actT < 0.45 : true;
  // idle: breathing + rocking
  const br = Math.sin(t * 2.6);
  kid.torso.scale.set(1 + br * 0.02, 0.95 + br * 0.025, 0.9);
  aL.rotation.z = -0.35; aR.rotation.z = 0.35; eL.rotation.x = eR.rotation.x = 0.4;
  kid.head.rotation.z = Math.sin(t * 1.3) * 0.05;
  if (walking){
    // toddler waddle: rock side to side, short stiff steps, arms out for balance
    const p = t * 7, w = Math.sin(p);
    kid.body.rotation.z = w * 0.14; kid.body.position.y = Math.abs(Math.cos(p)) * 0.06;
    lL.rotation.x = w * 0.45; lR.rotation.x = -w * 0.45; kL.rotation.x = -Math.max(0, Math.cos(p)) * 0.5; kR.rotation.x = -Math.max(0, -Math.cos(p)) * 0.5;
    aL.rotation.z = -1.1 + w * 0.15; aR.rotation.z = 1.1 + w * 0.15;
    kid.head.rotation.z = -w * 0.1;
  }
  if (act === 'throw'){
    actT += dt;
    const wind = actT < 0.3 ? ease(actT / 0.3) : 0, fling = actT >= 0.3 && actT < 0.5 ? ease((actT - 0.3) / 0.2) : actT >= 0.5 ? 1 - ease(Math.min(1, (actT - 0.5) / 0.5)) : 0;
    aR.rotation.x = -2.6 * wind + 1.2 * fling * (actT >= 0.3 ? 1 : 0) - (actT >= 0.3 && actT < 0.5 ? 2.6 * (1 - fling) : 0);
    eR.rotation.x = 0.9 * wind;
    kid.body.rotation.y = -0.35 * wind + 0.35 * fling;
    kid.body.rotation.x = 0.1 * wind - 0.15 * fling;
    if (actT > 1.1){ act = null; kid.face.set('smile'); }
  } else if (act === 'clap'){
    actT += dt;
    const c = Math.abs(Math.sin(actT * 10));
    aL.rotation.x = aR.rotation.x = -1.3; aL.rotation.z = -0.35 * c - 0.05; aR.rotation.z = 0.35 * c + 0.05;
    eL.rotation.x = eR.rotation.x = 0.6;
    kid.body.position.y = Math.abs(Math.sin(actT * 5)) * 0.1; kid.head.rotation.x = -0.15;
    if (actT > 2.2){ act = null; kid.face.set('smile'); }
  } else if (act === 'cry'){
    actT += dt;
    // tantrum: stomp, fists up, head back, wailing
    const s = Math.sin(actT * 14);
    kid.head.rotation.x = -0.35 + s * 0.04;
    aL.rotation.z = -2.2 + s * 0.3; aR.rotation.z = 2.2 - s * 0.3; eL.rotation.x = eR.rotation.x = 0.8;
    lL.rotation.x = Math.max(0, s) * 0.4; lR.rotation.x = Math.max(0, -s) * 0.4;
    kid.body.position.y = Math.abs(s) * 0.04;
    kid.tears.forEach((m, i) => { const k = (actT * 1.6 + i * 0.4) % 1; m.position.y = 1.55 - 0.1 - 1.05 - k * 0.35; m.scale.set(0.8, 1.5, 0.5); });
    if (actT > 2.6){ act = null; kid.face.set('smile'); }
  } else if (act === 'naughty'){
    actT += dt;
    // sneaky: crouch, look side to side, rub hands
    const k = ease(Math.min(1, actT / 0.3));
    kid.body.position.y = -0.08 * k; kL.rotation.x = kR.rotation.x = -0.5 * k; lL.rotation.x = lR.rotation.x = 0.3 * k;
    kid.head.rotation.y = Math.sin(actT * 3) * 0.5;
    aL.rotation.x = aR.rotation.x = -1.0; aL.rotation.z = -0.3 - Math.sin(actT * 12) * 0.12; aR.rotation.z = 0.3 + Math.sin(actT * 12) * 0.12; eL.rotation.x = eR.rotation.x = 0.9;
    if (actT > 2.4){ act = null; kid.face.set('smile'); }
  }
  // blink (only when the plain eyes are showing)
  blinkAt -= dt;
  if (blinkAt <= 0 && blinkT < 0){ blinkT = 0; blinkAt = 2 + Math.random() * 3; }
  if (blinkT >= 0){ blinkT += dt; kid.face.blink(Math.sin(Math.min(1, blinkT / 0.16) * Math.PI)); if (blinkT > 0.16){ blinkT = -1; kid.face.blink(0); } }
  if (eddie) animateEddie(eddie, { t, dt, moving: false, onGround: true });
  const mobile = innerWidth < innerHeight;
  camera.position.set(0, eddie ? 1.9 : 1.3, eddie ? (mobile ? -12 : -10) : (mobile ? -8.5 : -7));
  camera.lookAt(0, eddie ? 1.4 : 0.95, 0);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
