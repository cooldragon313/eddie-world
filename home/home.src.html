  The build pastes the island's storybook look and avatar/cosmetics into the
  @@INCLUDE markers and writes index.html (the site's front page). Never edit index.html by hand.

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --sb-paper:#fff8ec; --sb-ink:#5b3a29; --sb-text:#4a3426; --sb-muted:#9a7d5f; --sb-line:#e2c9a0;
    --sb-gold:#e8a317; --sb-gold-soft:#ffcf5a; --sb-red:#e0584a; --sb-mint:#7cc79a; --sb-sky:#6fb3e0;
    --sb-font:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color-scheme:light;
  }
  html,body{height:100%;overscroll-behavior:none}
  body{margin:0;position:fixed;inset:0;overflow:hidden;background:#e9d6b8;color:var(--sb-text);font-family:var(--sb-font);
       user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  #stage{position:fixed;inset:0}
  .chip{background:rgba(255,248,236,.94);border:2px solid var(--sb-ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px;
        box-shadow:0 3px 0 rgba(91,58,41,.25);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
  .coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc81e 45%,#c8901a);border:1.5px solid var(--sb-ink)}
  #tl{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  #tr{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:6px;font:700 16px var(--sb-font);background:var(--sb-gold-soft);color:var(--sb-ink);border:2.5px solid var(--sb-ink);
       border-radius:999px;padding:7px 16px;cursor:pointer;box-shadow:0 4px 0 rgba(91,58,41,.35);text-decoration:none;white-space:nowrap}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(91,58,41,.35)}
  .btn.ghost{background:#fff}
  .btn.mint{background:#d8f0e0}
  .btn.pink{background:#ffd6e8}
  .btn:disabled{background:#efe4d2;color:#b9a58a;border-color:#cdb999;box-shadow:none;cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--sb-sky);outline-offset:2px}
  #title{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;cursor:pointer;background:none;border:0;padding:0;
         font:900 26px var(--sb-font);color:#ffcf5a;-webkit-text-stroke:2.5px var(--sb-ink);paint-order:stroke fill;letter-spacing:2px;white-space:nowrap}
  #title .pen{font-size:.55em;-webkit-text-stroke:0;vertical-align:middle;margin-left:4px;opacity:.85}
  #nameBox{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(70,48,32,.45);padding:16px}
  #nameBox[hidden]{display:none}
  #nameBox>div{background:var(--sb-paper);border:3px solid var(--sb-ink);border-radius:18px;padding:16px 18px;width:min(92vw,340px);text-align:center;box-shadow:0 6px 0 rgba(91,58,41,.3)}
  #nameBox b{display:block;font:900 18px var(--sb-font);color:var(--sb-ink);margin-bottom:8px}
  #nameIn{width:100%;box-sizing:border-box;font:700 18px var(--sb-font);padding:8px 12px;border:2.5px solid var(--sb-ink);border-radius:12px;text-align:center}
  #nameBox .row{display:flex;gap:8px;justify-content:center;margin-top:10px}
  #works{position:fixed;inset:0;z-index:25;pointer-events:none;background:rgba(40,28,20,.35)}
  #works[hidden]{display:none}
  #works .fence{position:absolute;left:0;right:0;bottom:18%;height:90px;background:repeating-linear-gradient(-45deg,#ffcf5a 0 26px,#2a2a30 26px 52px);border-top:5px solid #5b3a29;border-bottom:5px solid #5b3a29;box-shadow:0 6px 0 rgba(0,0,0,.25)}
  #works .hammer{position:absolute;left:50%;top:34%;font-size:min(22vw,120px);transform-origin:80% 80%;animation:bonk .35s ease-in infinite alternate}
  @keyframes bonk{from{transform:translate(-50%,-50%) rotate(-35deg)}to{transform:translate(-50%,-50%) rotate(20deg)}}
  #works .txt{position:absolute;left:50%;top:54%;transform:translateX(-50%);font:900 26px var(--sb-font);color:#fff;-webkit-text-stroke:2px var(--sb-ink);paint-order:stroke fill;white-space:nowrap}
  #confetti{position:fixed;inset:0;z-index:26;pointer-events:none;overflow:hidden}
  #confetti i{position:absolute;top:-20px;width:10px;height:12px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
  #buildNext .lv{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2.5px solid var(--sb-ink);border-radius:14px;padding:8px 12px;margin:6px 0}
  #buildNext .lv b{display:block;font-size:17px}
  #buildNext .lv span{font-size:13px;color:var(--sb-muted)}
  #buildNext .lv.off{opacity:.55}
  #shelfUI{position:fixed;inset:0;z-index:15;pointer-events:none}
  #shelfUI[hidden]{display:none}
  #shelfUI .shelfHead{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--sb-paper);border:3px solid var(--sb-ink);border-radius:999px;
    padding:5px 18px;font:900 20px var(--sb-font);color:var(--sb-ink);box-shadow:0 4px 0 rgba(91,58,41,.3);white-space:nowrap}
  #shelfUI .shelfSay{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,460px);background:#e8f6ff;border:2.5px solid var(--sb-ink);
    border-radius:16px;padding:8px 14px;font:800 16px/1.4 var(--sb-font);color:var(--sb-ink);text-align:center;box-shadow:0 4px 0 rgba(91,58,41,.3)}
  #shelfUI .shelfSay span:first-child{color:#3a7bc8}
  #shelfUI #shelfClose{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:auto}
  #toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);z-index:20;background:var(--sb-paper);border:2.5px solid var(--sb-ink);border-radius:14px;
         padding:7px 16px;font:700 15px var(--sb-font);color:var(--sb-ink);box-shadow:0 4px 0 rgba(91,58,41,.3);pointer-events:none;opacity:0;transition:opacity .25s}
  #toast.on{opacity:1}

  /* Decorate tray */
  #tray{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));
        background:rgba(255,248,236,.96);border-top:3px solid var(--sb-ink);box-shadow:0 -4px 0 rgba(91,58,41,.15)}
  #trayTabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
  #trayTabs button{font:700 14px var(--sb-font);background:#fff;color:var(--sb-text);border:2px solid var(--sb-line);border-radius:999px;padding:4px 14px;cursor:pointer}
  #trayTabs button[aria-pressed="true"]{background:var(--sb-ink);color:#fff;border-color:var(--sb-ink)}
  #trayTabs .spacer{flex:1}
  #items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .item{flex:0 0 auto;width:86px;background:#fff;border:2px solid var(--sb-line);border-radius:14px;padding:4px;text-align:center;cursor:pointer;
        font:700 12px var(--sb-font);color:var(--sb-text);display:flex;flex-direction:column;align-items:center;gap:2px}
  .item img{width:64px;height:52px;display:block}
  .item .price{color:#c27a00;font-variant-numeric:tabular-nums}
  .item .count{color:var(--sb-muted);font-weight:600}
  .item.sel{border-color:var(--sb-ink);box-shadow:0 0 0 3px var(--sb-gold-soft)}
  .item.off{opacity:.45}
  #holdBar{position:fixed;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:8px;bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #holdHint{position:fixed;left:50%;transform:translateX(-50%);z-index:9;bottom:calc(200px + env(safe-area-inset-bottom,0px));
            background:#fff6d8;border:2px solid var(--sb-ink);border-radius:12px;padding:4px 12px;font:700 13px var(--sb-font);color:var(--sb-ink);pointer-events:none;white-space:nowrap}

  /* Cards */
  .card{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(70,48,32,.45);padding:12px}
  .card>div{background:var(--sb-paper);border:3px solid var(--sb-ink);border-radius:22px;padding:16px 20px;max-width:520px;width:100%;max-height:92vh;overflow:auto;
            box-shadow:0 8px 0 rgba(91,58,41,.25);text-align:center}
  .card h2{margin:0 0 4px;font:900 24px var(--sb-font);color:var(--sb-ink)}
  .card p{margin:4px 0 12px;color:var(--sb-muted);font-weight:600}
  .levels{display:grid;gap:10px}
  .level{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2.5px solid var(--sb-ink);border-radius:16px;padding:10px 14px;
         text-decoration:none;color:var(--sb-text);box-shadow:0 4px 0 rgba(91,58,41,.25);cursor:pointer}
  .level .ico{font-size:34px;line-height:1}
  .level b{display:block;font:900 18px var(--sb-font);color:var(--sb-ink)}
  .level span{font-size:13px;color:var(--sb-muted);font-weight:600}
  .level.soon{opacity:.55;cursor:default;box-shadow:none}
  .level.soon b::after{content:'  即將推出';font-size:12px;color:var(--sb-red)}

  @media (max-height:520px){
    #title{font-size:18px;-webkit-text-stroke:2px var(--sb-ink)}
    #tray{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
    #trayTabs{margin-bottom:3px;gap:4px} #trayTabs button{font-size:12px;padding:2px 10px}
    .item{width:60px;font-size:11px;padding:2px;border-radius:10px} .item img{width:44px;height:34px}
    #holdBar{bottom:calc(122px + env(safe-area-inset-bottom,0px))}
    #holdHint{bottom:calc(166px + env(safe-area-inset-bottom,0px))}
    .btn{font-size:14px;padding:5px 12px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<button id="title" type="button" aria-label="幫家取名字">🪐 <span id="homeName">土星之家</span><span class="pen">✏️</span></button>
<div id="nameBox" hidden><div>
  <b>幫你的家取個名字</b>
  <input id="nameIn" maxlength="12" autocomplete="off" placeholder="例如：艾迪的秘密基地">
  <div class="row"><button class="btn" id="nameOk" type="button">好了</button><button class="btn" id="nameCancel" type="button" style="background:#fff">算了</button></div>
</div></div>
<div id="tl">
  <div class="chip"><span class="coin"></span><b id="money">0</b></div>
  <div class="chip" id="who" style="font-size:12px;font-weight:600">試玩版</div>
</div>
<div id="tr">
  <button class="btn pink" id="buildBtn">🔨 擴建</button>
  <button class="btn mint" id="decoBtn">🛋 裝潢</button>
  <button class="btn" id="goBtn">🚪 出門玩</button>
</div>
<div id="toast"></div>
<div id="shelfUI" hidden>
  <div class="shelfHead">🧸 艾迪的玩具架　<b id="shelfCount">0 / 6</b></div>
  <div class="shelfSay"><span>艾迪：</span><span id="shelfSay"></span></div>
  <button class="btn" id="shelfClose" type="button">✕ 回房間</button>
</div>

<div id="holdHint" hidden>手指在地板上拖，移動家具</div>
<div id="holdBar" hidden>
  <button class="btn ghost" id="rotBtn">↻ 轉</button>
  <button class="btn" id="placeBtn">✓ 放好</button>
  <button class="btn pink" id="stowBtn">收起來</button>
</div>

<div id="tray" hidden>
  <div id="trayTabs">
    <button id="tabMine" aria-pressed="true">我的家具</button>
    <button id="tabShop" aria-pressed="false">家具店</button>
    <button id="tabFloor" aria-pressed="false">地板</button>
    <button id="tabWall" aria-pressed="false">壁紙</button>
    <span class="spacer"></span>
    <button id="doneBtn" style="background:var(--sb-gold-soft);border-color:var(--sb-ink);color:var(--sb-ink)">完成</button>
  </div>
  <div id="items"></div>
</div>

<div class="card" id="buildCard" hidden>
  <div>
    <h2>🔨 擴建我的家</h2>
    <p id="buildNow"></p>
    <div id="buildNext"></div>
    <button class="btn ghost" id="buildClose" style="margin-top:12px">先不要</button>
  </div>
</div>
<div id="works" hidden><div class="fence"></div><div class="hammer">🔨</div><div class="txt">施工中…叮叮咚咚</div></div>
<div id="confetti"></div>

<div class="card" id="goCard" hidden>
  <div>
    <h2>要去哪裡玩？</h2>
    <p>在關卡裡賺金幣，回家買家具</p>
    <div class="levels">
      <a class="level" id="lvRace" href="race.html"><span class="ico">🏃</span><div><b>逃離土星</b><span>家庭聚會跑酷：躲酒鬼大叔、鬼媽媽和小屁孩</span></div></a>
      <a class="level" id="lvGlue" href="gluenight.html"><span class="ico">📚</span><div><b>恐怖考前複習夜</b><span>偷玩不能被媽媽抓到，撐到十點</span></div></a>
      <a class="level" id="lvTower" href="tower.html"><span class="ico">🏙️</span><div><b>101 跑酷</b><span>艾迪的提案：跳木頭塊爬到 101 頂端，一層 +10 金幣</span></div></a>
      <div class="level soon"><span class="ico">🧸</span><div><b>土星拆家王</b><span>趁大人轉頭拚命拆，被看到就裝乖</span></div></div>
    </div>
    <button class="btn ghost" id="goClose" style="margin-top:12px">留在家裡</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*@@INCLUDE:LOOK@@*/

/*@@INCLUDE:AVATAR@@*/

(() => {
const $ = id => document.getElementById(id);
let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

// ---------- save (this browser; the server copy comes in H2) ----------
const SAVE_KEY = 'etfm-home-v1';
const START = { money: 777, inv: { sofa: 1, table: 1, chair: 2, plant: 1 }, placed: [
  { uid: 1, id: 'sofa', x: 1, z: 1, rot: 0 }, { uid: 2, id: 'table', x: 3, z: 3, rot: 0 },
  { uid: 3, id: 'chair', x: 4, z: 3, rot: 3 }, { uid: 4, id: 'plant', x: 0, z: 0, rot: 0 },
], floor: 'wood', wall: 'cream', floors: ['wood'], walls: ['cream'] };
let save;
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){}
if (!save){
  save = JSON.parse(JSON.stringify(START));
  // starting furniture is already placed, so it isn't also waiting in the box
  for (const p of save.placed) save.inv[p.id] = Math.max(0, (save.inv[p.id] || 0) - 1);
}
save.level = save.level || 1;
// Online (eddie-world / localhost with an account): the home and the money are the account's, prices
// are checked by the server. Offline (claude.ai preview): a local test house that always has 777 to spend.
const ON_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname), ON_LIVE = /github\.io$/.test(location.hostname);
const API = ON_LOCAL ? 'http://localhost:1999/parties/main/global' : ON_LIVE ? 'https://etfm.cooldragon313.workers.dev/parties/main/global' : '';
const token = () => { try { return localStorage.getItem('etfm-token') || ''; } catch (e) { return ''; } };
const online = () => !!(API && token());
if (!API) save.money = Math.max(save.money || 0, 777);   // preview only: always enough to shop
async function api(path, body){
  const r = await fetch(API + '/' + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() }, body: JSON.stringify(body) }
                                           : { headers: { Authorization: 'Bearer ' + token() } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || '連不上伺服器'), { status: r.status });
  return j;
}
let pushT = 0;
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
  if (!online()) return;
  clearTimeout(pushT);   // batch quick changes into one save
  pushT = setTimeout(() => api('home_save', { placed: save.placed, floor: save.floor, wall: save.wall, name: save.homeName || '' }).catch(() => toast('家沒存到，等一下再試')), 700);
}
// the server's copy → this page (furniture in the box = owned − placed)
function applyServerHome(j){
  const h = j.home, inv = {};
  for (const id in h.own) inv[id] = h.own[id];
  for (const p of h.placed) inv[p.id] = (inv[p.id] || 0) - 1;
  Object.assign(save, { money: j.money, level: h.level, inv, placed: h.placed, floor: h.floor, wall: h.wall, floors: h.floors, walls: h.walls, homeName: h.name || '' });
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
}
// the home's name: anyone can rename it (tap the title). Up to 12 characters, shown as plain text.
const DEFAULT_HOME_NAME = '土星之家';
function showHomeName(){ const n = save.homeName || DEFAULT_HOME_NAME; $('homeName').textContent = n; document.title = n; }
showHomeName();
$('title').addEventListener('click', () => { $('nameIn').value = save.homeName || DEFAULT_HOME_NAME; $('nameBox').hidden = false; $('nameIn').focus(); $('nameIn').select(); });
function closeName(){ $('nameBox').hidden = true; }
$('nameCancel').addEventListener('click', closeName);
$('nameOk').addEventListener('click', () => {
  const n = $('nameIn').value.replace(/\s+/g, ' ').trim().slice(0, 12);
  save.homeName = n && n !== DEFAULT_HOME_NAME ? n : ''; persist(); showHomeName(); closeName();
  toast(n ? '🏠 歡迎來到「' + (n || DEFAULT_HOME_NAME) + '」！' : '名字改回土星之家');
});
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameOk').click(); else if (e.key === 'Escape') closeName(); e.stopPropagation(); });
function setMoney(){ $('money').textContent = save.money; }
// one purchase: online the server takes the money (and says no if it isn't there); offline it's local
let buying = false;
async function buy(kind, id, price, done){
  if (API && !token()){ toast('先登入才能買（到「逃離土星」登入）'); return false; }
  if (!online()){ save.money -= price; setMoney(); done(); persist(); return true; }
  if (buying) return false; buying = true;
  try { const j = await api('home_buy', { kind, id }); save.money = j.money; setMoney(); done(); persist(); return true; }
  catch (e){ toast(e.message); return false; }
  finally { buying = false; }
}
setMoney();

// ---------- three.js ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9d6b8);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xfff2dc, 0xb9a07c, 0.8));
const sun = new THREE.DirectionalLight(0xffeccc, 0.55); sun.position.set(8, 14, 10); scene.add(sun);
let camDist = 19, lastTrayH = -1;
function fit(){
  const w = innerWidth, h = innerHeight; if (!w || !h) return;
  renderer.setSize(w, h); camera.aspect = w / h; lastTrayH = -1;
  // Pull back on narrow / short screens so the whole room fits
  const portrait = w < h;
  camera.fov = portrait ? 62 : 42;
  camera.updateProjectionMatrix();
  camDist = (portrait ? 25 : (h < 520 ? 21 : 19)) * (typeof camScale === 'number' ? camScale : 1);
}
addEventListener('resize', fit); fit();

const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const RB = (w, h, d, r) => sbRoundBox(w, h, d, r || Math.min(w, h, d) * 0.18);
function part(parent, geo, mat, x, y, z){ const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); parent.add(m); return m; }

// ---------- room ----------
// home levels (prices are checked again by the server: party/server.js HOME_LEVELS)
const LEVELS = {
  1: { name: '小套房', size: 8 },
  2: { name: '大客廳', size: 10, price: 600, desc: '牆往外推，客廳變成 10×10' },
  3: { name: '艾迪的房間', price: 1000, desc: '多一間自己的房間（施工規劃中）', soon: true },
  4: { name: '廚房', price: 1400, desc: '冰箱、餐桌、冰淇淋機（施工規劃中）', soon: true },
  5: { name: '頂樓陽台', price: 2000, desc: '彈跳床、帳篷、看土星的望遠鏡（施工規劃中）', soon: true },
};

// ---------- placement grid ----------
const placedObjs = new Map();   // uid -> { data, group }
const footprint = (id, rot) => rot % 2 ? [FURN[id].d, FURN[id].w] : [FURN[id].w, FURN[id].d];
function cellsOf(p){
  const [w, d] = footprint(p.id, p.rot), out = [];
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) out.push([p.x + i, p.z + j]);
  return out;
}
function placeTransform(group, p){
  const [w, d] = footprint(p.id, p.rot);
  group.position.set(-HALF + (p.x + w / 2) * CELL, 0, -HALF + (p.z + d / 2) * CELL);
  group.rotation.y = -p.rot * Math.PI / 2;
}
function fits(p, ignoreUid){
  const flat = !!FURN[p.id].flat;
  for (const [cx, cz] of cellsOf(p)){
    if (cx < 0 || cz < 0 || cx >= N || cz >= N) return false;
    if (cx === DOOR_CELL.x && cz === DOOR_CELL.z && !flat) return false;   // keep the doorway clear
    for (const [uid, o] of placedObjs){
      if (uid === ignoreUid) continue;
      if (!!FURN[o.data.id].flat !== flat) continue;            // rugs layer under furniture
      if (cellsOf(o.data).some(([x, z]) => x === cx && z === cz)) return false;
    }
  }
  return true;
}
function addPlaced(p){
  const g = buildFurniture(p.id); placeTransform(g, p);
  g.traverse(o => { o.userData.uid = p.uid; });
  scene.add(g); placedObjs.set(p.uid, { data: p, group: g });
}
for (const p of save.placed) addPlaced(p);
let nextUid = save.placed.reduce((m, p) => Math.max(m, p.uid), 0) + 1;
function solidAt(cx, cz){
  for (const [, o] of placedObjs){
    if (!FURN[o.data.id].solid) continue;
    if (cellsOf(o.data).some(([x, z]) => x === cx && z === cz)) return true;
  }
  return false;
}
// If a piece lands on top of the player, step them to the nearest free cell
function nudgeOutOfFurniture(){
  const cx = Math.floor((pos.x + HALF) / CELL), cz = Math.floor((pos.z + HALF) / CELL);
  if (!solidAt(cx, cz)) return;
  let best = null, bd = Infinity;
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++){
    if (solidAt(x, z)) continue;
    const d = Math.hypot(x - cx, z - cz); if (d < bd){ bd = d; best = [x, z]; }
  }
  if (best){ const c = cellCenter(best[0], best[1]); pos.x = c.x; pos.z = c.z; target = null; }
}
function syncSave(){ save.placed = [...placedObjs.values()].map(o => o.data); persist(); }

function reloadHome(){

const ghostOk = new THREE.MeshBasicMaterial({ color: 0x7cc79a, transparent: true, opacity: 0.45, depthWrite: false });
const ghostBad = new THREE.MeshBasicMaterial({ color: 0xe0584a, transparent: true, opacity: 0.45, depthWrite: false });
let ghost = null;
function refreshGhost(){
  if (ghost){ scene.remove(ghost); ghost = null; }
  if (!holding) return;
  const [w, d] = footprint(holding.data.id, holding.data.rot);
  ghost = new THREE.Mesh(new THREE.PlaneGeometry(w * CELL - 0.08, d * CELL - 0.08), fits(holding.data, holding.uid) ? ghostOk : ghostBad);
  ghost.rotation.x = -Math.PI / 2;

  scene.add(ghost);
  placeTransform(holding.group, holding.data);

}
function firstFreeSpot(id, rot){
  const order = [];
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) order.push([x, z]);
  order.sort((a, b) => Math.hypot(a[0] - 3.5, a[1] - 3.5) - Math.hypot(b[0] - 3.5, b[1] - 3.5));
  for (const [x, z] of order){ if (fits({ id, x, z, rot })) return { x, z }; }
  return null;
}
function startHolding(id, fromInv){
  const spot = firstFreeSpot(id, 0);
  if (!spot){ toast('房間放不下了，先收起一些家具'); return false; }
  const data = { uid: nextUid++, id, x: spot.x, z: spot.z, rot: 0 };
  const g = buildFurniture(id); scene.add(g);
  holding = { data, group: g, uid: null, fromInv };
  showHoldUI(); refreshGhost(); return true;
}
function pickUp(uid){
  const o = placedObjs.get(uid); if (!o) return;
  placedObjs.delete(uid);
  holding = { data: o.data, group: o.group, uid, fromInv: false, prev: { ...o.data } };
  showHoldUI(); refreshGhost(); renderTray();
}
function moveHoldingTo(e){
  const p = pickFloor(e); if (!p) return;
  const [w, d] = footprint(holding.data.id, holding.data.rot);
  const cx = Math.round((p.x + HALF) / CELL - w / 2), cz = Math.round((p.z + HALF) / CELL - d / 2);
  holding.data.x = Math.max(0, Math.min(N - w, cx));
  holding.data.z = Math.max(0, Math.min(N - d, cz));

}
function rotateHolding(){

  const [w, d] = footprint(holding.data.id, holding.data.rot);
  holding.data.x = Math.min(holding.data.x, N - w); holding.data.z = Math.min(holding.data.z, N - d);
  refreshGhost();
}
function placeHolding(){
  if (!holding) return;

  if (holding.fromInv) save.inv[holding.data.id] = Math.max(0, (save.inv[holding.data.id] || 0) - 1);
  scene.remove(holding.group);
  addPlaced(holding.data);

  nudgeOutOfFurniture();

}
function stowHolding(){

// ---------- loop ----------
let last = 0, nearDoorT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0.016; last = now;
  // walking: keys or tap target
  let mx = 0, mz = 0;
  if (mode === 'walk'){
    if (keys.KeyW || keys.ArrowUp) mz -= 1; if (keys.KeyS || keys.ArrowDown) mz += 1;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (mx || mz) target = null;
    else if (target){
      const dx = target.x - pos.x, dz = target.z - pos.z, L = Math.hypot(dx, dz);
      if (L < 0.12) target = null; else { mx = dx / L; mz = dz / L; }
    }
  }
  const L = Math.hypot(mx, mz), moving = L > 0;
  if (moving){
    mx /= L; mz /= L;
    const nx = pos.x + mx * 4 * dt, nz = pos.z + mz * 4 * dt;
    const cx = Math.floor((nx + HALF) / CELL), cz = Math.floor((nz + HALF) / CELL);
    const inside = Math.abs(nx) < HALF - 0.4 && Math.abs(nz) < HALF - 0.4;
    if (inside && !solidAt(cx, cz)){ pos.x = nx; pos.z = nz; }
    else target = null;
    me.group.rotation.y = Math.atan2(-mx, -mz);
    walkPhase += dt * 11;
  }
  animateEddie(me, { t: now / 1000, dt, moving, phase: walkPhase * 0.75, onGround: true, mood: mode === 'deco' ? 'smug' : 'smile' });
  me.group.position.set(pos.x, 0, pos.z);
  // standing in front of the door offers the level list once
  const atDoor = Math.floor((pos.x + HALF) / CELL) === DOOR_CELL.x && Math.floor((pos.z + HALF) / CELL) === DOOR_CELL.z;
  if (atDoor && mode === 'walk'){ nearDoorT += dt; if (nearDoorT > 0.35 && nearDoorT < 1 && $('goCard').hidden){ openGo(); nearDoorT = 1; } }
  else nearDoorT = 0;
  for (const [, o] of placedObjs) if (o.data.id === 'toyshelf') o.group.traverse(c => { if (c.userData.spin) c.userData.spin.rotation.y += dt * 6; });
  if (mode === 'shelf' && shelfView){
    // close-up straight in front of the shelf (its front is +z before it's turned)
    const g = shelfView.group, a = g.rotation.y, fx2 = Math.sin(a), fz2 = Math.cos(a);
    camera.position.set(g.position.x + fx2 * 4.6, 2.0, g.position.z + fz2 * 4.6); camera.lookAt(g.position.x, 1.25, g.position.z);
    if (lastTrayH !== 0){ lastTrayH = 0; camera.clearViewOffset(); }
    renderer.render(scene, camera); return;
  }
  // camera: fixed storybook angle on the room, a little drift toward the player
  const fx = pos.x * 0.25, fz = pos.z * 0.2;
  const cd = camDist * (mode === 'deco' && innerHeight < 520 ? 1.3 : 1);   // short screens: back off so the room fits above the tray
  camera.position.set(fx + cd * 0.42, cd * 0.72, fz + cd * 0.78);
  camera.lookAt(fx, 0.6, fz);
  // While decorating, slide the picture up so the tray doesn't cover the room
  const trayH = mode === 'deco' ? $('tray').offsetHeight : 0;
  if (trayH !== lastTrayH){
    lastTrayH = trayH;
    if (trayH) camera.setViewOffset(innerWidth, innerHeight, 0, trayH * 0.5, innerWidth, innerHeight);
    else camera.clearViewOffset();
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
connect();

async function expand(k){
  const ok = await buy('expand', 'Lv' + k, LEVELS[k].price, () => {});
  if (!ok) return;
  $('buildCard').hidden = true;
  const w = $('works'); w.hidden = false; knock();
  setTimeout(() => {
    w.hidden = true; save.level = k; resizeRoom(); persist(); celebrate();
    toast('🎉 ' + LEVELS[k].name + '蓋好了！');
  }, 2600);
}
function celebrate(){
  const box = $('confetti'), colors = ['#ffcf5a', '#ff8fb0', '#6fb3e0', '#7cc79a', '#e0584a'];
  box.innerHTML = '';
  for (let i = 0; i < 80; i++){
    const c = document.createElement('i'); c.style.left = Math.random() * 100 + '%'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.4) + 's'; c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px'); c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg'); box.appendChild(c);
  }
  setTimeout(() => { box.innerHTML = ''; }, 3600);
}
// hammer knocks while the builders work (WebAudio, nothing to download)
function knock(){
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 7; i++){
      const t = ac.currentTime + i * 0.35, o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(220 + (i % 2) * 60, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
      g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.16);
    }
    setTimeout(() => ac.close(), 3200);
  } catch (e) {}
}
$('buildBtn').onclick = () => { renderBuild(); $('buildCard').hidden = false; };
$('shelfClose').onclick = closeShelf;
$('buildClose').onclick = () => { $('buildCard').hidden = true; };
$('buildCard').addEventListener('click', e => { if (e.target === $('buildCard')) $('buildCard').hidden = true; });
})();
</script>
