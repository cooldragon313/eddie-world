<meta charset="utf-8">
<title>海嘯撿錢風格試玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; style switcher pinned top, touch controls pinned to the bottom corners. Single committed look (game UI over a bright sky). */
:root{
  --ink:#0f2236;
  --chip:rgba(10,28,48,.72);
  --chip-line:rgba(255,255,255,.18);
  --paper:#ffffff;
  --gold:#ffc83d;
  --sea:#2fa8ff;
  --font-display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#7cc7ff;color:var(--paper);font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{display:block;width:100%;height:100%}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
.styles{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-line);backdrop-filter:blur(6px);pointer-events:auto;max-width:100%}
.styles button{font:800 14px/1 var(--font-ui);color:#cfe3f5;background:transparent;border:0;border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.styles button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.styles button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.variants{background:rgba(255,200,61,.92);border-color:rgba(0,0,0,.08)}
.variants button{font-size:13px;padding:7px 12px;color:#5a4300}
.variants button[aria-pressed="true"]{background:var(--ink);color:#fff}
.has-variants .hud,.has-variants .lb-btn{top:calc(env(safe-area-inset-top,0px) + 136px)}
.desc{font:500 12px/1.4 var(--font-ui);color:#e8f3ff;background:var(--chip);padding:5px 12px;border-radius:999px;text-align:center;max-width:100%}

.hud{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none}
.pill{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:5px 12px 5px 6px;font:700 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,#d48a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.meter{width:22px;height:22px;border-radius:50%;background:var(--sea);display:grid;place-items:center;font:700 11px/1 var(--font-display)}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:800 clamp(20px,5vw,30px)/1.2 var(--font-ui);text-align:center;color:var(--paper);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .25s;z-index:6;padding-inline:16px;width:max-content;max-width:calc(100% - 32px)}
#toast.show{opacity:1}

.touch{display:none}
.is-touch .touch{display:block}
#stick{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:130px;height:130px;border-radius:50%;background:rgba(10,28,48,.35);border:2px solid rgba(255,255,255,.35);touch-action:none;z-index:5}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btns{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:flex-end;gap:12px;z-index:5}
.btn{border-radius:50%;border:0;display:grid;place-items:center;font:800 16px/1 var(--font-ui);color:var(--ink);touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#bJump{width:86px;height:86px;background:var(--gold)}
#bRun{width:64px;height:64px;background:var(--paper);margin-bottom:40px}
.btn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}

.keys{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font:500 12px/1.4 var(--font-ui);background:var(--chip);padding:6px 14px;border-radius:999px;z-index:4;white-space:nowrap}
.is-touch .keys{display:none}
.lb-btn{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:4;font:800 14px/1 var(--font-ui);color:var(--ink);background:var(--gold);border:0;border-radius:999px;padding:9px 14px;box-shadow:0 3px 0 rgba(0,0,0,.22);cursor:pointer}
.lb-btn:focus-visible,.sheet button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(8,20,36,.45)}
.sheet-card{--cream:#fff8ec;--line:#ecdcc0;--muted:#7a6a55;width:min(420px,100%);max-height:min(86vh,680px);overflow:auto;background:var(--cream);color:var(--ink);border-radius:22px;padding:14px 16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-card h2{margin:0;font:800 18px/1.2 var(--font-ui);text-wrap:balance}
.sheet-card .x,.sheet-card .back{border:0;background:transparent;color:var(--ink);font:800 15px/1 var(--font-ui);padding:8px;cursor:pointer;border-radius:10px}
.note{margin:4px 0 10px;font:500 12px/1.4 var(--font-ui);color:var(--muted)}
.lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb-row{width:100%;display:grid;grid-template-columns:30px 52px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:700 15px/1.2 var(--font-ui);text-align:left;cursor:pointer}
.lb-row.me{background:#fff3c9;border-color:#f1d27a}
.lb-row .rk{font:700 17px/1 var(--font-display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-row[data-rank="1"] .rk{color:#d99a00}.lb-row[data-rank="2"] .rk{color:#8b98a6}.lb-row[data-rank="3"] .rk{color:#c27a3c}
.lb-row img{width:52px;height:52px;border-radius:50%;background:#e9f5ff;display:block}
.lb-row[data-rank="1"] img{box-shadow:0 0 0 3px #ffc83d}.lb-row[data-rank="2"] img{box-shadow:0 0 0 3px #c9d3dd}.lb-row[data-rank="3"] img{box-shadow:0 0 0 3px #e0a36b}
.lb-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .ds{font:700 15px/1 var(--font-display);font-variant-numeric:tabular-nums;color:#2a6fb0}
.stage{height:260px;border-radius:18px;margin-top:4px;background:radial-gradient(circle at 50% 70%,#fffdf6,#d9efff);touch-action:none;cursor:grab;overflow:hidden}
.stage canvas{width:100%!important;height:100%!important;display:block}
.hint{margin:6px 0 2px;text-align:center;font:500 12px/1.4 var(--font-ui);color:var(--muted)}
.pname{text-align:center;margin-top:6px!important}
.pdist{text-align:center;margin:4px 0 10px;font:700 16px/1 var(--font-display);color:#2a6fb0}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{font:700 13px/1 var(--font-ui);padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.chip.none{color:var(--muted);font-weight:500}
@media (max-width:420px){.styles button{padding:8px 9px;font-size:12.5px}}
</style>

<div id="game"></div>

<div class="top">
  <div class="styles" id="styleBar" role="group" aria-label="切換風格">
    <button id="s-voxel" data-style="voxel" aria-pressed="false">精緻方塊</button>
    <button id="s-chibi" data-style="chibi" aria-pressed="false">Q版可愛</button>
    <button id="s-cozy" data-style="cozy" aria-pressed="false">動森風</button>
    <button id="s-jelly" data-style="jelly" aria-pressed="false">果凍派對</button>
  </div>
  <div class="styles variants" id="variants" role="group" aria-label="Q版變化" hidden>
    <button id="v-orig" data-variant="orig" aria-pressed="false">原版</button>
    <button id="v-soft" data-variant="soft" aria-pressed="false">不刺眼</button>
    <button id="v-book" data-variant="book" aria-pressed="false">繪本</button>
    <button id="v-color" data-variant="color" aria-pressed="false">彩色描邊</button>
  </div>
  <div class="desc" id="desc"></div>
</div>

<div class="hud">
  <div class="pill"><span class="coin"></span><span id="coins">0</span></div>
  <div class="pill"><span class="meter">m</span><span id="dist">0</span></div>
</div>

<button id="lbBtn" class="lb-btn" aria-haspopup="dialog">排行榜</button>

<div id="lb" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <div class="sheet-card">
    <div class="sheet-head">
      <h2 id="lbTitle">排行榜 · 最遠距離</h2>
      <button class="x" id="lbClose" aria-label="關閉排行榜">✕</button>
    </div>
    <p class="note">點頭像看造型 · 其他玩家是範例資料</p>
    <ol id="lbList" class="lb-list"></ol>
  </div>
</div>

<div id="card" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cardName">
  <div class="sheet-card profile">
    <div class="sheet-head">
      <button class="back" id="cardBack">← 排行榜</button>
      <button class="x" id="cardClose" aria-label="關閉">✕</button>
    </div>
    <div id="cardStage" class="stage"></div>
    <p class="hint">拖曳可以轉角色</p>
    <h2 id="cardName" class="pname"></h2>
    <p id="cardDist" class="pdist"></p>
    <div id="cardChips" class="chips"></div>
  </div>
</div>

<div id="toast"></div>

<div id="stick" class="touch" aria-label="移動搖桿"><div id="knob"></div></div>
<div class="btns touch">
  <button class="btn" id="bRun" aria-label="衝刺">衝刺</button>
  <button class="btn" id="bJump" aria-label="跳">跳</button>
</div>
<div class="keys">WASD／方向鍵 移動 · 空白鍵 跳 · Shift 衝刺 · 1–4 換風格 · 站著不動角色會轉身</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const STYLES = {
  voxel: { name:'精緻方塊', desc:'保留方塊人，邊角磨圓、加光澤和柔和陰影' },
  chibi: { name:'Q版可愛', desc:'大頭小身體、卡通著色加黑描邊，像動畫' },
  cozy:  { name:'動森風', desc:'同樣的 Q 版角色，拿掉描邊、柔和光影、暖色調' },
  jelly: { name:'果凍派對', desc:'軟糖豆身體、亮面反光，跳起來會 Q 彈' },
};
const RUN_W = 12, RUN_END = -390, START_Z = 6;

// ---------- renderer ----------
const host = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 78 : 58;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa77, 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-14, right:14, top:14, bottom:-14, near:1, far:60 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// ---------- geometry helpers ----------
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function RB(w,h,d,r,s){
  s = s || 4; r = Math.min(r, w/2-1e-3, h/2-1e-3, d/2-1e-3);
  const g = new THREE.BoxGeometry(w,h,d,s,s,s);
  const p = g.attributes.position, n = g.attributes.normal;
  const v = new THREE.Vector3(), c = new THREE.Vector3(), k = new THREE.Vector3();
  const hx=w/2-r, hy=h/2-r, hz=d/2-r;
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    c.set(clamp(v.x,-hx,hx), clamp(v.y,-hy,hy), clamp(v.z,-hz,hz));
    k.subVectors(v,c); if (k.lengthSq() < 1e-12) continue;
    k.normalize(); v.copy(c).addScaledVector(k,r);
    p.setXYZ(i,v.x,v.y,v.z); n.setXYZ(i,k.x,k.y,k.z);
  }
  return g;
}
function capsule(r,len,seg){
  seg = seg || 10; const pts=[];
  for (let i=0;i<=seg;i++){ const t=-Math.PI/2+(Math.PI/2)*(i/seg); pts.push(new THREE.Vector2(Math.max(0,r*Math.cos(t)), r*Math.sin(t))); }
  for (let i=0;i<=seg;i++){ const t=(Math.PI/2)*(i/seg); pts.push(new THREE.Vector2(Math.max(0,r*Math.cos(t)), len+r*Math.sin(t))); }
  const g = new THREE.LatheGeometry(pts, 24); g.translate(0,-len/2,0); return g;
}
const sphere = (r,ws,hs) => new THREE.SphereGeometry(r, ws||28, hs||18);

const toonRamp = (() => {
  const t = new THREE.DataTexture(new Uint8Array([90,90,90, 180,180,180, 255,255,255]), 3, 1, THREE.RGBFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t;
})();
const outlineMat = new THREE.MeshBasicMaterial({ color:0x1b1530, side:THREE.BackSide });
outlineMat.userData.shared = true;

// Q版 variants: same character, different line / light / color treatment
const QV = {
  orig:  { name:'原版', desc:'黑描邊、鮮豔、明暗分明', ramp:[90,180,255], line:0x1b1530, lineK:1, sat:0, lum:0, hemi:.85, sun:.85,
           pal:{ sky:['#8fd3ff','#fff1fb'], ground:0xa6e48e, plank:[0xf0bd84,0xe3aa6e], rail:0xffffff } },
  soft:  { name:'不刺眼', desc:'一樣有描邊，降低亮度和飽和，看久不累', ramp:[80,155,215], line:0x2c2440, lineK:.7, sat:-.14, lum:-.05, hemi:.72, sun:.6,
           pal:{ sky:['#6db7ea','#cfe6f2'], ground:0x8cc874, plank:[0xd9a674,0xcc9866], rail:0xe9e3d8 } },
  book:  { name:'繪本', desc:'咖啡色細描邊、暖色調，像童書插畫', ramp:[115,165,210,240], line:0x5b3a29, lineK:.6, sat:-.1, lum:-.03, hemi:.78, sun:.55, warm:true,
           pal:{ sky:['#9fd0ee','#f6ead2'], ground:0x9fcc7f, plank:[0xd8ae80,0xcca072], rail:0xf0e2c8 } },
  color: { name:'彩色描邊', desc:'描邊用物件自己的深色，鮮豔但不刺眼', ramp:[85,165,235], tintLine:true, lineK:.8, sat:-.05, lum:-.03, hemi:.75, sun:.7,
           pal:{ sky:['#7cc6f5','#e2f2fa'], ground:0x92d47c, plank:[0xe6b07a,0xd9a06a], rail:0xffffff } },
};
let VARIANT = 'orig';
const rampCache = {}, lineCache = {};
function rampFor(v){
  if (rampCache[v]) return rampCache[v];
  const r = QV[v].ramp, d = new Uint8Array(r.length*3); r.forEach((x,i) => d.fill(x, i*3, i*3+3));
  const t = new THREE.DataTexture(d, r.length, 1, THREE.RGBFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return rampCache[v] = t;
}
function outlineFor(mat){
  const v = QV[VARIANT];
  if (v.tintLine){
    const c = mat && mat.color ? mat.color.clone().offsetHSL(0,.06,-.32) : new THREE.Color(0x222222);
    return new THREE.MeshBasicMaterial({ color:c, side:THREE.BackSide });
  }
  if (!lineCache[VARIANT]){ lineCache[VARIANT] = new THREE.MeshBasicMaterial({ color:v.line, side:THREE.BackSide }); lineCache[VARIANT].userData.shared = true; }
  return lineCache[VARIANT];
}
const lineScale = k => 1 + (k - 1) * QV[VARIANT].lineK;

let STYLE = 'voxel';
function M(color, o){
  o = o || {};
  if (STYLE === 'voxel') return new THREE.MeshStandardMaterial(Object.assign({ color, roughness:.55, metalness:0 }, o));
  if (STYLE === 'chibi'){
    const v = QV[VARIANT], c = new THREE.Color(color).offsetHSL(0, v.sat, v.lum);
    return new THREE.MeshToonMaterial(Object.assign({ color:c, gradientMap:rampFor(VARIANT) }, o));
  }
  if (STYLE === 'cozy') return new THREE.MeshStandardMaterial(Object.assign({ color, roughness:.92, metalness:0 }, o));
  return new THREE.MeshPhysicalMaterial(Object.assign({ color, roughness:.28, clearcoat:1, clearcoatRoughness:.12 }, o));
}
function mesh(geo, mat, x, y, z, parent, opt){
  const m = new THREE.Mesh(geo, mat); m.position.set(x||0, y||0, z||0);
  m.castShadow = true; m.receiveShadow = !!(opt && opt.receive);
  if (STYLE === 'chibi' && !(opt && opt.noOutline)){
    const o = new THREE.Mesh(geo, outlineFor(mat)); o.scale.setScalar(lineScale((opt && opt.ol) || 1.07)); m.add(o);
  }
  if (parent) parent.add(m); return m;
}
function limb(parent, x, y, z){ const p = new THREE.Group(); p.position.set(x,y,z); parent.add(p); return p; }

// ---------- avatars (face toward +z) ----------
const DEFAULT_LOOK = { skin:0xf5cfb0, shirt:0x7ec8ff, pants:0x6a7bd8, hair:0x6b4430, shoes:0xff8fa3, hat:'', face:'', back:'' };
function avatarVoxel(c){
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const skin=M(c.skin), shirt=M(c.shirt), pants=M(c.pants), shoe=M(c.shoes), hair=M(c.hair), pack=M(0x8b5a2b), dark=M(0x111111,{roughness:.3}), white=M(0xffffff);
  mesh(RB(1.1,1.2,.65,.1), shirt, 0,1.55,0, body);
  mesh(RB(.95,.95,.95,.14), skin, 0,2.66,0, body);
  mesh(RB(1.02,.34,1.02,.1), hair, 0,3.03,0, body);
  mesh(RB(1.02,.62,.26,.08), hair, 0,2.76,-.4, body);
  for (const s of [-1,1]){
    mesh(RB(.16,.22,.06,.03), dark, s*.21,2.7,.48, body);
    mesh(new THREE.BoxGeometry(.06,.06,.02), white, s*.21-.03,2.77,.515, body);
  }
  mesh(RB(.32,.07,.05,.02), M(0xa83a3a), 0,2.44,.48, body);
  mesh(RB(.76,.82,.36,.1), pack, 0,1.6,-.5, body);
  const arms=[], legs=[];
  for (const s of [-1,1]){
    const a = limb(body, s*.72, 2.1, 0);
    mesh(RB(.36,.42,.42,.08), shirt, 0,-.16,0, a);
    mesh(RB(.32,.95,.38,.09), skin, 0,-.55,0, a);
    if (s>0){ mesh(new THREE.CylinderGeometry(.09,.13,.9,10), M(0xb57b3e), 0,-1.25,.08, a); }
    arms.push(a);
    const l = limb(body, s*.3, 1.0, 0);
    mesh(RB(.42,1.0,.5,.09), pants, 0,-.5,0, l);
    mesh(RB(.46,.2,.64,.07), shoe, 0,-.92,.06, l);
    legs.push(l);
  }
  return { g, body, arms, legs, squashy:false, anc:{ eyeX:.21, eyeY:2.7, top:3.2, front:.5, backZ:-.7, backY:1.7, headR:.5, w:1.1 } };
}
function avatarChibi(c){
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const skin=M(c.skin), shirt=M(c.shirt), pants=M(c.pants), shoe=M(c.shoes), hair=M(c.hair), pack=M(0xd99a5b);
  const head = mesh(sphere(.9,32,22), skin, 0,2.1,0, body, {ol:1.05});
  const cap = new THREE.SphereGeometry(.96,32,18,0,Math.PI*2,0,Math.PI*.56);
  const hm = mesh(cap, hair, 0,2.12,0, body, {ol:1.04}); hm.rotation.x = -.45;
  mesh(sphere(.32,20,14), hair, 0,2.0,-.78, body, {ol:1.08});
  const eyeM = new THREE.MeshBasicMaterial({color:0x221a2e}), wM = new THREE.MeshBasicMaterial({color:0xffffff}), blushM = new THREE.MeshBasicMaterial({color:0xff9fb0, transparent:true, opacity:.75});
  for (const s of [-1,1]){
    const e = mesh(sphere(.15,18,14), eyeM, s*.3,2.02,.8, body, {noOutline:true}); e.scale.set(1,1.35,.5);
    mesh(sphere(.055,10,8), wM, s*.3-.05,2.12,.88, body, {noOutline:true});

function waveProfile(){

  s.quadraticCurveTo(.3,.4,.5,1.6);
  s.quadraticCurveTo(.8,2.3,1.6,1.7);
  s.quadraticCurveTo(1.2,2.6,-.2,2.3);
  s.quadraticCurveTo(-1.8,1.6,-3,0);
  return s;
}

    const deep = M(0x1d5fc0,{roughness:.2});

function disposeTree(o){ o.traverse(n => { if (n.geometry) n.geometry.dispose(); if (n.material && !n.material.userData.shared) n.material.dispose(); }); }
function setStyle(id, variant){

  if (QV[variant]) VARIANT = variant;
  STYLE = id;
  for (const b of document.querySelectorAll('#styleBar button')) b.setAttribute('aria-pressed', String(b.dataset.style === id));
  for (const b of document.querySelectorAll('#variants button')) b.setAttribute('aria-pressed', String(b.dataset.variant === VARIANT));
  document.getElementById('variants').hidden = id !== 'chibi';
  document.documentElement.classList.toggle('has-variants', id === 'chibi');
  document.getElementById('desc').textContent = id === 'chibi' ? QV[VARIANT].desc : STYLES[id].desc;
  if (world){ scene.remove(world); disposeTree(world); }
  if (avatar){ scene.remove(avatar.g); disposeTree(avatar.g); }
  if (wave){ scene.remove(wave); disposeTree(wave); wave = null; waveTimer = 2.5; }
  for (const c of coins){ scene.remove(c); disposeTree(c); }
  world = buildWorld(); scene.add(world);
  avatar = makeAvatar(MY_LOOK); scene.add(avatar.g);
  closeSheets();
  coins = [];
  for (let i=0;i<34;i++){ const c = buildCoin(); placeCoin(c, true); scene.add(c); coins.push(c); }
  const tag = id === 'chibi' ? 'chibi-' + VARIANT : id;

  if (location.hash.slice(1) !== tag) history.replaceState(null, '', '#'+tag);
}

const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null;
function stickMove(e){
  const r = stickEl.getBoundingClientRect(), R = r.width/2;
  let dx = e.clientX - (r.left+R), dy = e.clientY - (r.top+R);
  const L = Math.hypot(dx,dy), max = R*.62;
  if (L > max){ dx *= max/L; dy *= max/L; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  stick = { x: dx/max, y: -dy/max };
}
stickEl.addEventListener('pointerdown', e => { stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId); stickMove(e); });

const stickEnd = e => { if (e.pointerId !== stickId) return; stickId = null; stick = {x:0,y:0}; knob.style.transform = ''; };
stickEl.addEventListener('pointerup', stickEnd); stickEl.addEventListener('pointercancel', stickEnd);
function holdBtn(el, down, up){

}

// ---------- loop ----------
const clock = new THREE.Clock(); let T = 0;
const camPos = new THREE.Vector3(0, 7, START_Z + 11), look = new THREE.Vector3();
function angLerp(a, b, t){ let d = ((b - a + Math.PI) % (Math.PI*2)) - Math.PI; if (d < -Math.PI) d += Math.PI*2; return a + d*t; }

function tick(){
  const dt = Math.min(clock.getDelta(), .05); T += dt;
  // input
  let ix = stick.x, iy = stick.y;
  if (key.KeyA || key.ArrowLeft) ix -= 1; if (key.KeyD || key.ArrowRight) ix += 1;
  if (key.KeyW || key.ArrowUp) iy += 1; if (key.KeyS || key.ArrowDown) iy -= 1;
  if (!lbEl.hidden || !cardEl.hidden){ ix = 0; iy = 0; jumpQueued = false; }
  const L = Math.hypot(ix, iy); if (L > 1){ ix /= L; iy /= L; }
  const sprint = run || key.ShiftLeft || key.ShiftRight;
  const spd = sprint ? 10.5 : 6.8, moving = L > .12;
  P.x += (ix*spd + P.kx)*dt; P.z += (-iy*spd + P.kz)*dt;
  P.kx *= Math.pow(.02, dt); P.kz *= Math.pow(.02, dt);
  P.x = clamp(P.x, -RUN_W/2+.8, RUN_W/2-.8); P.z = clamp(P.z, RUN_END+2, 14);
  if (jumpQueued && P.grounded){ P.vy = 11; P.grounded = false; }
  jumpQueued = false;
  P.vy -= 28*dt; P.y += P.vy*dt;
  if (P.y <= 0){ if (!P.grounded && P.vy < -6) P.squash = .28; P.y = 0; P.vy = 0; P.grounded = true; }

  // facing: move direction, or turn to camera after standing still
  if (moving){ P.idle = 0; P.yaw = angLerp(P.yaw, Math.atan2(ix, -iy), 1 - Math.pow(.0005, dt)); }
  else { P.idle += dt; if (P.idle > .6) P.yaw = angLerp(P.yaw, 0, 1 - Math.pow(.02, dt)); }

  // animate avatar
  const A = avatar; A.g.position.set(P.x, P.y, P.z); A.g.rotation.y = P.yaw;
  P.phase += dt * (moving ? (sprint ? 15 : 11) : 0);
  const amp = moving && P.grounded ? .75 : 0;
  A.legs[0].rotation.x = Math.sin(P.phase)*amp; A.legs[1].rotation.x = -Math.sin(P.phase)*amp;
  A.arms[0].rotation.x = -Math.sin(P.phase)*amp*.8; A.arms[1].rotation.x = Math.sin(P.phase)*amp*.8;
  if (!P.grounded){ A.arms[0].rotation.z = -.9; A.arms[1].rotation.z = .9; A.legs[0].rotation.x = -.5; A.legs[1].rotation.x = .3; }
  else { A.arms[0].rotation.z = A.arms[1].rotation.z = 0; }
  P.squash *= Math.pow(.004, dt);
  if (A.squashy){
    const bob = moving && P.grounded ? Math.abs(Math.sin(P.phase))*.12 : Math.sin(T*2.2)*.03;
    const wob = A.jelly ? Math.sin(P.phase*2)*.05*(moving?1:0) : 0;
    const stretch = !P.grounded ? clamp(P.vy*.012, -.12, .14) : 0;
    const sy = 1 - P.squash + wob + stretch, sxz = 1 + P.squash*.6 - wob*.5 - stretch*.5;
    A.body.scale.set(sxz, sy, sxz); A.body.position.y = bob;
  } else {
    A.body.position.y = moving && P.grounded ? Math.abs(Math.sin(P.phase))*.08 : 0;
  }
  A.g.visible = P.inv <= 0 || Math.floor(T*14) % 2 === 0;
  P.inv -= dt;

  // coins
  for (const c of coins){
    c.rotation.y += dt*2.6; c.position.y = 1.1 + Math.sin(T*3 + c.position.z)*.12;
    const dx = c.position.x - P.x, dz = c.position.z - P.z, dy = c.position.y - (P.y+1.3);
    if (dx*dx + dz*dz < 1.6 && Math.abs(dy) < 1.6){ money += 1; placeCoin(c); }
    else if (dz > 16) placeCoin(c);
  }

  // tsunami
  waveTimer -= dt;
  if (!wave && waveTimer <= 0){
    wave = buildWave(); wave.position.set(0, 0, Math.max(RUN_END, P.z - 58)); scene.add(wave);
    if (firstWave){ toast(isTouch ? '海嘯來了！按「跳」跳過去' : '海嘯來了！按空白鍵跳過去', 2.2); firstWave = false; }
  }
  if (wave){
    wave.position.z += 9.5*dt;
    wave.userData.foam.forEach((f,i) => { f.position.y += Math.sin(T*5 + i)*.004; f.scale.setScalar(1 + Math.sin(T*4 + i*1.3)*.06); });
    const dz = wave.position.z - P.z;
    if (Math.abs(dz) < 1.3 && P.y < 1.45 && P.inv <= 0){
      P.kz = 16; P.vy = 7; P.grounded = false; P.inv = 1.4;
      const lost = Math.ceil(money/2); money -= lost;
      toast(lost ? `被浪打到！掉了 ${lost} 枚金幣` : '被浪打到！', 1.6);
    }
    if (dz > 22){ scene.remove(wave); disposeTree(wave); wave = null; waveTimer = 2.5 + Math.random()*3; }
  }

  // treasure
  if (P.z < RUN_END + 4){ money += 100; toast('拿到大寶箱！+100', 2); P.z = START_Z; P.x = 0; }

  // camera + sun follow
  camPos.lerp(new THREE.Vector3(P.x*.55, 6.4 + P.y*.35, P.z + 10.5), 1 - Math.pow(.001, dt));
  camera.position.copy(camPos);
  look.set(P.x*.75, 1.6 + P.y*.4, P.z - 6); camera.lookAt(look);
  sun.position.set(P.x + 8, 18, P.z + 6); sun.target.position.set(P.x, 0, P.z - 2);

  coinsEl.textContent = money;
  const curDist = Math.max(0, Math.round(START_Z - P.z));
  distEl.textContent = curDist; P.best = Math.max(P.best, curDist);
  renderCard(dt);
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------- leaderboard + profile card (sample data) ----------
const MY_LOOK = { shirt:0x7ec8ff, hair:0x6b4430 };
const SAMPLE_PLAYERS = [
  { name:'海嘯獵人', dist:1820, look:{ shirt:0xffc83d, pants:0x3a3a5a, hair:0x2a1c14, hat:'crown', back:'cape' } },
  { name:'金幣王阿寶', dist:1544, look:{ shirt:0xf28aa0, pants:0x5a6bd0, hair:0xd9a35a, face:'shades', back:'wings' } },
  { name:'衝浪貓', dist:1310, look:{ shirt:0x7ed7a6, pants:0x2f6f5a, hair:0x1d1d1d, hat:'party' } },
  { name:'小鯨魚', dist:990, look:{ shirt:0x6fb4ff, pants:0x2d3a6b, skin:0xe8b48f, hair:0x3a2414, back:'wings' } },
  { name:'跑跑豆', dist:860, look:{ shirt:0xb48cff, pants:0x4b3f7a, hair:0xff9f6b, face:'shades' } },
  { name:'Leo', dist:740, look:{ shirt:0xff8a3d, pants:0x444444, skin:0xc98f6a, hair:0x111111, hat:'crown' } },
  { name:'跳高高', dist:615, look:{ shirt:0xffffff, pants:0xd65a5a, hair:0x6b4430, hat:'party', back:'cape' } },
  { name:'沙灘拖鞋', dist:480, look:{ shirt:0x9fd27f, pants:0x8a6a3a, hair:0xe8d27a } },
  { name:'慢慢來', dist:352, look:{ shirt:0xd0d6de, pants:0x56606e, hair:0x7a5230, face:'shades' } },
];
const lbEl = document.getElementById('lb'), cardEl = document.getElementById('card'), stageEl = document.getElementById('cardStage');
const tR = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
tR.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const tScene = new THREE.Scene(), tCam = new THREE.PerspectiveCamera(30, 1, .1, 50);
tScene.add(new THREE.HemisphereLight(0xffffff, 0xc8d8c0, 1.0));
const tSun = new THREE.DirectionalLight(0xffffff, .6); tSun.position.set(2,4,5); tScene.add(tSun);
let cardA = null, cardSpin = 0, cardDrag = null, thumbsStyle = '';
const thumbCache = new Map();

function headshot(look){
  const A = makeAvatar(look), a = A.anc; tScene.add(A.g);
  tR.setSize(128, 128, false); tCam.aspect = 1; tCam.updateProjectionMatrix();
  const d = a.headR * 4.6 + 1;
  tCam.position.set(d*.28, a.eyeY + .25, d); tCam.lookAt(0, a.eyeY - .05, 0);
  tR.render(tScene, tCam);
  const url = tR.domElement.toDataURL('image/png');
  tScene.remove(A.g); disposeTree(A.g); return url;
}
function rowsData(){
  const me = { name:'你', dist:P.best, look:MY_LOOK, me:true };
  return SAMPLE_PLAYERS.concat([me]).sort((a,b) => b.dist - a.dist);
}
function openLeaderboard(){
  if (thumbsStyle !== STYLE + VARIANT){ thumbCache.clear(); thumbsStyle = STYLE + VARIANT; }
  const list = document.getElementById('lbList'); list.textContent = '';
  rowsData().forEach((p, i) => {
    const key = p.me ? 'me:' + JSON.stringify(MY_LOOK) : p.name;
    if (!thumbCache.has(key)) thumbCache.set(key, headshot(p.look));
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'lb-row' + (p.me ? ' me' : ''); b.dataset.rank = String(i+1);
    b.setAttribute('aria-label', `第 ${i+1} 名 ${p.name}，${p.dist} 公尺，看造型`);
    b.innerHTML = `<span class="rk">${i+1}</span><img alt="" src="${thumbCache.get(key)}"><span class="nm"></span><span class="ds">${p.dist} m</span>`;
    b.querySelector('.nm').textContent = p.name;
    b.addEventListener('click', () => openCard(p, i+1));
    li.appendChild(b); list.appendChild(li);
  });
  cardEl.hidden = true; lbEl.hidden = false;
}
function openCard(p, rank){
  lbEl.hidden = true; cardEl.hidden = false;
  if (cardA){ tScene.remove(cardA.g); disposeTree(cardA.g); }
  cardA = makeAvatar(p.look); tScene.add(cardA.g); cardSpin = .5;
  if (tR.domElement.parentNode !== stageEl) stageEl.appendChild(tR.domElement);
  const r = stageEl.getBoundingClientRect();
  tR.setSize(r.width, r.height, false); tCam.aspect = r.width / r.height; tCam.updateProjectionMatrix();
  const a = cardA.anc, mid = a.top * .5 + .1, d = a.top * 1.55 + 2.2;
  tCam.position.set(0, mid + .6, d); tCam.lookAt(0, mid, 0);
  document.getElementById('cardName').textContent = `#${rank}　${p.name}`;
  document.getElementById('cardDist').textContent = `最遠 ${p.dist} m`;
  const chips = document.getElementById('cardChips'); chips.textContent = '';
  const c = Object.assign({}, DEFAULT_LOOK, p.look), parts = [['帽子', COSMETICS.hat[c.hat]], ['臉', COSMETICS.face[c.face]], ['背後', COSMETICS.back[c.back]]];
  let any = false;
  for (const [slot, item] of parts){ if (!item) continue; any = true; const s = document.createElement('span'); s.className = 'chip'; s.textContent = `${slot}：${item}`; chips.appendChild(s); }
  if (!any){ const s = document.createElement('span'); s.className = 'chip none'; s.textContent = '還沒買造型'; chips.appendChild(s); }
}
function closeSheets(){
  lbEl.hidden = true; cardEl.hidden = true;
  if (cardA){ tScene.remove(cardA.g); disposeTree(cardA.g); cardA = null; }
}
function renderCard(dt){
  if (!cardA || cardEl.hidden) return;
  if (!cardDrag) cardA.g.rotation.y += dt * .6;
  cardA.body.position.y = Math.sin(T*2.4) * .05;
  tR.render(tScene, tCam);
}
document.getElementById('lbBtn').addEventListener('click', openLeaderboard);
document.getElementById('lbClose').addEventListener('click', closeSheets);
document.getElementById('cardClose').addEventListener('click', closeSheets);
document.getElementById('cardBack').addEventListener('click', () => { if (cardA){ tScene.remove(cardA.g); disposeTree(cardA.g); cardA = null; } openLeaderboard(); });
for (const s of [lbEl, cardEl]) s.addEventListener('click', e => { if (e.target === s) closeSheets(); });
addEventListener('keydown', e => { if (e.code === 'Escape') closeSheets(); });
stageEl.addEventListener('pointerdown', e => { cardDrag = { x:e.clientX }; stageEl.setPointerCapture(e.pointerId); });
stageEl.addEventListener('pointermove', e => { if (!cardDrag || !cardA) return; cardA.g.rotation.y += (e.clientX - cardDrag.x) * .012; cardDrag.x = e.clientX; });
const dragEnd = () => { cardDrag = null; };
stageEl.addEventListener('pointerup', dragEnd); stageEl.addEventListener('pointercancel', dragEnd);

let start = 'chibi-orig';
try { start = localStorage.getItem('ets-style') || start; } catch(e){}
if (location.hash.length > 1) start = location.hash.slice(1);
if (!setFromTag(start)) setStyle('chibi', 'orig');
toast(STYLE === 'chibi' ? '第二排可以切換 Q 版的 4 種變化' : '上面可以切換風格', 2.6);
requestAnimationFrame(tick);
})();
