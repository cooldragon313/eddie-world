// Eddie's body language, shared by every level. Call once per frame after
// placing him; it owns legs/knees/elbows/lean/head/face, the caller keeps
// overall position, facing and any special arm pose (bat swing) applied after.
//   o = { t, dt, moving, phase, onGround, down, victory, swinging }
function animateEddie(A, o){
  const e = A && A.eddie; if (!e) return;
  const st = A._anim || (A._anim = { blinkAt: 2, blinkT: -1, mood: '' });
  const [armL, armR] = e.arms, [legL, legR] = e.legs;
  const eL = armL.userData.elbow, eR = armR.userData.elbow, kL = legL.userData.knee, kR = legR.userData.knee;
  for (const j of [legL, legR, kL, kR, eL, eR, e.head]) j.rotation.set(0, 0, 0);
  e.body.rotation.set(0, 0, 0); e.body.position.set(0, 0, 0);
  armL.rotation.z = -0.14; armR.rotation.z = 0.14;
  const t = o.t || 0, p = o.phase || 0, breath = Math.sin(t * 2.1);
  e.torso.scale.set(1 + breath * 0.012, 1.08 + breath * 0.02, 0.88 + breath * 0.01);
  if (o.victory){
    const b = Math.sin(t * 9), up = Math.abs(Math.sin(t * 4.5));
    armL.rotation.x = armR.rotation.x = 0; armL.rotation.z = -2.4 - b * 0.3; armR.rotation.z = 2.4 - b * 0.3;
    eL.rotation.x = eR.rotation.x = 0.6; e.body.rotation.z = b * 0.15; e.head.rotation.z = -b * 0.18;
    legL.rotation.z = -0.15; legR.rotation.z = 0.15; kL.rotation.x = -up * 0.6; kR.rotation.x = -(1 - up) * 0.6;
    e.body.position.y = up * 0.25;
  } else if (o.onGround === false){
    // airborne: tuck the legs, arms out for balance
    legL.rotation.x = 0.45; legR.rotation.x = -0.1; kL.rotation.x = -0.9; kR.rotation.x = -0.5;
    armL.rotation.z = -1.6; armR.rotation.z = 1.6; eL.rotation.x = eR.rotation.x = 0.4;
  } else if (o.moving){
    const sw = Math.sin(p) * 0.85;
    legL.rotation.x = sw; legR.rotation.x = -sw;
    kL.rotation.x = -(Math.max(0, Math.cos(p)) * 1.2 + 0.1);   // the leg swinging forward folds back at the knee
    kR.rotation.x = -(Math.max(0, -Math.cos(p)) * 1.2 + 0.1);
    armL.rotation.x = -sw; armR.rotation.x = sw;
    eL.rotation.x = eR.rotation.x = 1.1;                         // pumping, bent arms
    e.body.rotation.x = -0.16; e.body.rotation.y = sw * 0.1; e.head.rotation.x = 0.1;
    e.body.position.y = Math.abs(Math.cos(p)) * 0.1;
  } else {
    armL.rotation.x = armR.rotation.x = 0;
    eL.rotation.x = eR.rotation.x = 0.25;
    e.body.rotation.z = Math.sin(t * 0.9) * 0.02;
  }
  if (o.swinging){ eR.rotation.x = 0.15; eL.rotation.x = 0.3; }
  if (o.down){ e.body.rotation.x = 0.3; e.head.rotation.x = -0.25; }
  // face: knocked down = startled, winning = big laugh, otherwise a smile; blink now and then
  const mood = o.down ? 'surprised' : o.victory ? 'laugh' : (o.mood || 'smile');
  if (mood !== st.mood){ st.mood = mood; e.face.set(mood); }
  st.blinkAt -= o.dt || 0.016;
  if (st.blinkAt <= 0 && st.blinkT < 0){ st.blinkT = 0; st.blinkAt = 2.5 + Math.random() * 3; }
  if (st.blinkT >= 0){ st.blinkT += o.dt || 0.016; e.face.blink(Math.sin(Math.min(1, st.blinkT / 0.16) * Math.PI)); if (st.blinkT > 0.16){ st.blinkT = -1; e.face.blink(0); } }
}

// ============================================================
// LITTLE KID (土星家的小屁孩) — a toddler, built from a reference photo:
// short soft black hair with a fringe, big round eyes, white tee with a
// light-blue print, light-blue shorts, bare feet, a toy car in hand.
// Faces -z, about 2/3 of Eddie's height. Same rig idea as Eddie:
// head pivot, elbows, knees, and a face controller.
// ============================================================
const buildKid = (() => {
  const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  function part(parent, geo, mat, x, y, z, noLine){ const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (noLine) m.userData.noLine = true; parent.add(m); return m; }
  const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);
  return function buildKid(){
    const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
    const skin = LM(0xf2c9a8), hair = LM(0x1f1a1a), tee = LM(0xf7f6f0), blue = LM(0x9fcfe8), blueDark = LM(0x6fb3e0);
    const NECK = 1.05, HY = 1.55;
    const headG = new THREE.Group(); headG.position.y = NECK; body.add(headG);
    const H = (geo, mat, x, y, z, nl) => part(headG, geo, mat, x, y - NECK, z, nl);
    const head = H(S(0.72, 32, 22), skin, 0, HY, 0); head.scale.set(1.04, 0.98, 1);
    for (const s of [-1, 1]){
      const cheek = H(S(0.24, 16, 12), skin, s * 0.36, HY - 0.25, -0.44); cheek.scale.set(1, 0.85, 0.7);
      const ear = H(S(0.15, 12, 8), skin, s * 0.74, HY - 0.04, 0.05); ear.scale.set(0.5, 1, 0.8);
    }
    // hair: one soft black cap that comes down low on the forehead (a fringe),
    // with short tufts sticking up a little on top
    const capGeo = new THREE.SphereGeometry(0.755, 36, 18, 0, Math.PI * 2, 0, Math.PI * 0.5);
    const cap = H(capGeo, hair, 0, HY + 0.02, 0.02); cap.rotation.x = 0.12; cap.scale.set(1.04, 1, 1.02);
    for (let i = 0; i < 7; i++){
      const x = (i - 3) * 0.13;
      const tf = H(new THREE.ConeGeometry(0.09, 0.2, 8), hair, x, HY + 0.38 - Math.abs(x) * 0.25, -0.6 + Math.abs(x) * 0.12, true);
      tf.rotation.x = -1.9; tf.rotation.z = -x * 0.6;                       // fringe tips poking down over the forehead
    }
    for (const [x, z] of [[-0.15, -0.1], [0.12, 0.05], [0, 0.25], [-0.25, 0.2], [0.26, -0.15]]){
      const tf = H(new THREE.ConeGeometry(0.11, 0.24, 8), hair, x, HY + 0.72, z, true); tf.rotation.z = -x * 0.8; tf.rotation.x = z * 0.6;
    }
    // face
    const ink = flat(0x22180f), white = flat(0xffffff), mouthC = flat(0x7a2a2a);
    const eyes = [], glints = [];
    for (const s of [-1, 1]){
      const e = H(S(0.115, 16, 12), ink, s * 0.24, HY + 0.0, -0.7, true); e.scale.set(1, 1.2, 0.5); eyes.push(e);
      const gl = H(S(0.045, 8, 6), white, s * 0.24 - 0.035, HY + 0.06, -0.755, true); glints.push(gl);
      const brow = H(sbRoundBox(0.16, 0.035, 0.03, 0.015), ink, s * 0.24, HY + 0.2, -0.7, true); brow.rotation.z = s * -0.12;
      const b = H(S(0.11, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffa8a0, transparent: true, opacity: 0.7 }), s * 0.42, HY - 0.16, -0.57, true); b.scale.set(1, 0.6, 0.35);
    }
    const mouthSmile = H(new THREE.CircleGeometry(0.09, 16, Math.PI, Math.PI), mouthC, 0.02, HY - 0.23, -0.715, true); mouthSmile.rotation.y = Math.PI;
    const mouthCry = H(new THREE.CircleGeometry(0.14, 18), mouthC, 0, HY - 0.26, -0.71, true); mouthCry.rotation.y = Math.PI; mouthCry.scale.set(1.2, 0.9, 1);
    const mouthO = H(new THREE.CircleGeometry(0.07, 16), mouthC, 0, HY - 0.24, -0.715, true); mouthO.rotation.y = Math.PI; mouthO.scale.set(0.9, 1.2, 1);
    const mouthGrin = H(new THREE.TorusGeometry(0.1, 0.025, 6, 14, Math.PI), mouthC, 0.04, HY - 0.19, -0.72, true); mouthGrin.rotation.z = Math.PI * 1.1;
    const happyEyes = [-1, 1].map(s => H(new THREE.TorusGeometry(0.08, 0.025, 6, 14, Math.PI), ink, s * 0.24, HY - 0.02, -0.71, true));
    const cryEyes = [-1, 1].map(s => { const m = H(new THREE.TorusGeometry(0.08, 0.025, 6, 14, Math.PI), ink, s * 0.24, HY + 0.02, -0.71, true); m.rotation.z = Math.PI; return m; });
    const tears = [-1, 1].map(s => { const m = H(S(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: 0x8fd0f0 }), s * 0.3, HY - 0.12, -0.68, true); m.scale.set(0.8, 1.5, 0.5); return m; });
    const naughtyBrows = [-1, 1].map(s => { const m = H(sbRoundBox(0.2, 0.05, 0.04, 0.02), ink, s * 0.24, HY + 0.19, -0.71, true); m.rotation.z = s * 0.35; return m; });
    // body: white tee with a light-blue print, light-blue shorts with a white stripe
    const torso = part(body, S(0.48, 24, 16), tee, 0, 0.64, 0); torso.scale.set(1.0, 0.95, 0.9);
    const print1 = part(body, new THREE.PlaneGeometry(0.34, 0.08), flat(0x6fb3e0), 0.04, 0.7, -0.44, true); print1.rotation.set(0, Math.PI, 0.5);
    const print2 = part(body, new THREE.PlaneGeometry(0.3, 0.08), flat(0x6fb3e0), 0.1, 0.56, -0.43, true); print2.rotation.set(0, Math.PI, -0.4);
    const shorts = part(body, S(0.45, 22, 14), blue, 0, 0.32, 0); shorts.scale.set(1.08, 0.6, 0.95);
    // arms: shoulder → elbow
    const arms = [-1, 1].map(s => {
      const a = new THREE.Group(); a.position.set(s * 0.44, 0.88, 0); body.add(a);
      part(a, S(0.15, 12, 10), tee, 0, -0.04, 0);
      const up = part(a, S(0.12, 12, 10), skin, 0, -0.14, 0); up.scale.set(1, 1.1, 1);
      const el = new THREE.Group(); el.position.y = -0.24; a.add(el);
      const fo = part(el, S(0.11, 12, 10), skin, 0, -0.08, 0); fo.scale.set(1, 1.1, 1);
      part(el, S(0.12, 12, 10), skin, 0, -0.2, 0);
      a.userData.elbow = el; return a;
    });
    // legs: shorts leg → knee → bare foot
    const legs = [-1, 1].map(s => {
      const l = new THREE.Group(); l.position.set(s * 0.2, 0.26, 0); body.add(l);
      part(l, S(0.17, 12, 10), blue, 0, -0.04, 0);
      const stripe = part(l, new THREE.TorusGeometry(0.15, 0.025, 6, 16), LM(0xffffff), 0, -0.1, 0, true); stripe.rotation.x = Math.PI / 2;
      const kn = new THREE.Group(); kn.position.y = -0.14; l.add(kn);
      const shin = part(kn, S(0.12, 12, 10), skin, 0, -0.02, 0); shin.scale.set(1, 0.9, 1);
      const foot = part(kn, S(0.14, 14, 10), skin, 0, -0.1, -0.06); foot.scale.set(1, 0.55, 1.4);
      for (let k = 0; k < 4; k++) part(kn, S(0.03, 6, 4), skin, -0.07 + k * 0.045, -0.1, -0.24, true);   // little toes
      l.userData.knee = kn; return l;
    });
    // toy car in the right hand (what he throws)
    const toy = new THREE.Group();
    part(toy, sbRoundBox(0.34, 0.18, 0.5, 0.06), LM(0xe0584a), 0, 0, 0);
    part(toy, sbRoundBox(0.26, 0.14, 0.24, 0.05), LM(0x8fd0f0), 0, 0.14, 0.04);
    for (const [x, z] of [[-0.18, -0.17], [0.18, -0.17], [-0.18, 0.17], [0.18, 0.17]]){ const w = part(toy, new THREE.CylinderGeometry(0.07, 0.07, 0.06, 12), LM(0x2a2a2a), x, -0.09, z); w.rotation.z = Math.PI / 2; }
    toy.position.set(0, -0.3, -0.1); arms[1].userData.elbow.add(toy);

    let expr = '';
    const face = {
      set(name){
        if (name === expr) return; expr = name;
        const happy = name === 'happy', cry = name === 'cry', naughty = name === 'naughty', surprised = name === 'surprised';
        eyes.forEach(e => e.visible = !happy && !cry); glints.forEach(gl => gl.visible = !happy && !cry);
        happyEyes.forEach(m => m.visible = happy); cryEyes.forEach(m => m.visible = cry); tears.forEach(m => m.visible = cry);
        naughtyBrows.forEach(m => m.visible = naughty);
        mouthSmile.visible = name === 'smile' || happy; mouthCry.visible = cry; mouthGrin.visible = naughty; mouthO.visible = surprised;
      },
      blink(k){ eyes.forEach(e => e.scale.y = 1.2 * (1 - k * 0.92)); },
      get name(){ return expr; },
    };
    face.set('smile');
    sbOutline(g, 0.03);
    return { g, body, head: headG, arms, legs, torso, face, toy, tears };
  };
})();

// ============================================================
// MOM (艾迪的媽媽) — from reference photos: long dark-brown hair fading to
// ash-blonde wavy ends, soft side part with face-framing strands, almond
// eyes, brown long-sleeve top, black wide-leg pants, black Mary-Jane flats,
// purple phone lanyard. Faces -z, feet at y=0. Same rig idea as Eddie:
// head pivot, elbows, knees, face controller. Holds a glue stick (熱熔膠條).
// ============================================================
function buildMom(){
  const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  const part = (p, geo, mat, x, y, z, nl) => { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (nl) m.userData.noLine = true; p.add(m); return m; };
  const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);
  const Cy = (a, b, h, n) => new THREE.CylinderGeometry(a, b, h, n || 16);
  // hair colour runs dark at the roots to ash-blonde at the tips (by height)
  const DARK = new THREE.Color(0x2b1e18), MID = new THREE.Color(0x5a4334), ASH = new THREE.Color(0xc2b3a3);
  const hairMat = LM(0xffffff, { vertexColors: true });
  function hairPiece(p, geo, x, y, z, sx, sy, sz, y0, y1){
    const m = part(p, geo, hairMat, x, y, z); m.scale.set(sx || 1, sy || 1, sz || 1);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
    for (let i = 0; i < pos.count; i++){
      const wy = y + pos.getY(i) * (sy || 1), k = Math.min(1, Math.max(0, (y0 - wy) / (y0 - y1)));
      if (k < 0.45) c.copy(DARK).lerp(MID, k / 0.45); else c.copy(MID).lerp(ASH, (k - 0.45) / 0.55);
      col.set([c.r, c.g, c.b], i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return m;
  }
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const skin = LM(0xf3cfb3), top = LM(0x5e3b2c), pants = LM(0x232026), shoe = LM(0x1c1a1d), purple = LM(0x7b5fb0);
  // ---- legs: wide trousers, knee, Mary-Jane flats
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.2, 1.5, 0); body.add(l);
    part(l, Cy(0.22, 0.25, 0.75), pants, 0, -0.37, 0);
    const kn = new THREE.Group(); kn.position.y = -0.72; l.add(kn);
    part(kn, Cy(0.25, 0.33, 0.66, 18), pants, 0, -0.32, 0);
    const f = part(kn, S(0.15, 16, 10), shoe, 0, -0.7, -0.08); f.scale.set(0.9, 0.45, 1.55);
    const strap = part(kn, sbRoundBox(0.25, 0.04, 0.05, 0.02), shoe, 0, -0.64, -0.2, true); strap.rotation.y = s * 0.5;
    part(kn, sbRoundBox(0.06, 0.06, 0.02, 0.01), LM(0xd8d4cc), s * 0.1, -0.64, -0.24, true);
    l.userData.knee = kn; return l;
  });
  // ---- torso: loose brown top
  const torso = part(body, Cy(0.34, 0.47, 1.1, 22), top, 0, 2.02, 0);
  const chest = part(body, S(0.36, 22, 14), top, 0, 2.5, 0); chest.scale.set(1.25, 0.55, 0.95);
  part(body, Cy(0.1, 0.12, 0.25), skin, 0, 2.68, 0);
  // ---- arms: long sleeves, elbows, hands
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * 0.46, 2.47, 0); body.add(a);
    part(a, S(0.14, 12, 10), top, 0, 0, 0);
    part(a, Cy(0.13, 0.11, 0.55), top, 0, -0.28, 0);
    const el = new THREE.Group(); el.position.y = -0.55; a.add(el);
    part(el, Cy(0.11, 0.12, 0.45), top, 0, -0.22, 0);
    const hand = part(el, S(0.09, 12, 10), skin, 0, -0.5, 0); hand.scale.set(0.9, 1.15, 0.8);
    a.userData.elbow = el; return a;
  });
  // three weapons for the right hand (pointing forward when the arm hangs):
  // 熱熔膠條 glue stick, 愛的小手 (a stick with a little hand), 衣架 wire hanger
  const hand = arms[1].userData.elbow, weapons = {};
  { const w = new THREE.Group(); w.position.set(0, -0.52, 0); hand.add(w);
    const st = part(w, Cy(0.05, 0.05, 1.1, 10), LM(0xfff4d6), 0, 0, -0.5); st.rotation.x = Math.PI / 2; weapons.glue = w; }
  { const w = new THREE.Group(); w.position.set(0, -0.52, 0); hand.add(w); const pink = LM(0xff8fb0);
    const st = part(w, Cy(0.03, 0.035, 1.0, 8), pink, 0, 0, -0.5); st.rotation.x = Math.PI / 2;
    const palm = part(w, S(0.12, 14, 10), pink, 0, 0, -1.08); palm.scale.set(1, 0.35, 1.15);
    for (let i = 0; i < 4; i++){ const f = part(w, Cy(0.025, 0.028, 0.16, 6), pink, -0.075 + i * 0.05, 0, -1.26 - (i === 1 || i === 2 ? 0.02 : 0)); f.rotation.x = Math.PI / 2; }
    const th = part(w, Cy(0.025, 0.028, 0.13, 6), pink, -0.13, 0, -1.1); th.rotation.x = Math.PI / 2; th.rotation.y = 0.7;
    weapons.hand = w; }
  { const w = new THREE.Group(); w.position.set(0, -0.52, 0); hand.add(w); const blue = LM(0x6fb3e0);
    // hook in the fist, triangle reaching forward (in the y-z plane, flat side down)
    const hook = part(w, new THREE.TorusGeometry(0.08, 0.018, 6, 14, Math.PI * 1.3), blue, 0, 0.06, -0.02); hook.rotation.y = Math.PI / 2;
    const neck = part(w, Cy(0.018, 0.018, 0.16, 6), blue, 0, 0, -0.14); neck.rotation.x = Math.PI / 2;
    const L = 0.75, a = 0.42;
    for (const s of [-1, 1]){ const arm = part(w, Cy(0.02, 0.02, L, 6), blue, s * Math.sin(a) * L / 2, 0, -0.22 - Math.cos(a) * L / 2); arm.rotation.x = Math.PI / 2; arm.rotation.z = 0; arm.rotation.y = 0; arm.rotation.set(Math.PI / 2, 0, -s * a); }
    const bar = part(w, Cy(0.022, 0.022, 2 * Math.sin(a) * L, 6), blue, 0, 0, -0.22 - Math.cos(a) * L); bar.rotation.z = Math.PI / 2;
    weapons.hanger = w; }
  // held like a stick: out of the fist, down and a little forward along the forearm
  for (const k in weapons) weapons[k].rotation.x = -1.2;
  let weapon = 'glue';
  const setWeapon = name => { weapon = name; for (const k in weapons) weapons[k].visible = k === name; };
  setWeapon('glue');
  // phone on a purple lanyard
  const lan = part(body, Cy(0.018, 0.018, 1.0, 6), purple, 0.12, 2.15, -0.38, true); lan.rotation.z = 0.32; lan.rotation.x = 0.05;
  const phone = part(body, sbRoundBox(0.16, 0.28, 0.03, 0.02), LM(0x2a2a30), 0.27, 1.62, -0.46);
  const handPhone = part(arms[0].userData.elbow, sbRoundBox(0.2, 0.36, 0.035, 0.02), LM(0x2a2a30), 0, -0.56, -0.06); handPhone.visible = false;
  const phoneScreen = part(handPhone, new THREE.PlaneGeometry(0.17, 0.31), new THREE.MeshBasicMaterial({ color: 0x9fd3ff, side: THREE.DoubleSide }), 0, 0, 0.022, true);
  handPhone.userData.screen = phoneScreen;
  // ---- head (pivot at the neck)
  const NECK = 2.72, HY = 0.45;
  const headG = new THREE.Group(); headG.position.y = NECK; headG.scale.setScalar(1.4); body.add(headG);   // storybook: a bit big-headed
  const head = part(headG, S(0.5, 32, 22), skin, 0, HY, 0); head.scale.set(0.94, 1.06, 0.96);
  // hair: ONE piece over the whole head (no seams, so nothing reads as a hat).
  // A sphere a touch bigger than the head; the vertices where the face is get
  // pulled inside the head, which carves a curved hairline. The parting sits a
  // little left of centre, so the hair dips lower over the right temple.
  // Plus a long back curtain and two strands framing the face. One gradient:
  // dark roots → ash-blonde tips.
  const H0 = 0.95, H1 = -1.2, PART = -0.1;
  {
    const geo = new THREE.SphereGeometry(0.525, 96, 64), pos = geo.attributes.position, v = new THREE.Vector3();
    const ss = k => { k = Math.min(1, Math.max(0, k)); return k * k * (3 - 2 * k); };
    for (let i = 0; i < pos.count; i++){
      v.fromBufferAttribute(pos, i);
      const d = (v.x - PART) / 0.43, line = 0.38 - 0.3 * d * d;   // hairline height (arch, highest at the parting)
      // soft edge: vertices sink gradually, so the hairline is smooth, not stepped
      const k = ss((line - v.y) / 0.05) * ss((0.47 - Math.abs(v.x)) / 0.04) * ss((-0.05 - v.z) / 0.06);
      if (k > 0){ v.multiplyScalar(1 - 0.45 * k); pos.setXYZ(i, v.x, v.y, v.z); }
    }
    geo.computeVertexNormals();
    hairPiece(headG, geo, 0, HY, 0.01, 0.98, 1.06, 0.99, H0, H1);
  }
  hairPiece(headG, S(0.56, 26, 20), 0, HY - 0.45, 0.24, 1.04, 1.45, 0.42, H0, H1);
  for (const s of [-1, 1]){
    // long strands framing the face, lying in front of the shoulders
    const fr = hairPiece(headG, S(0.2, 16, 16), s * 0.47, HY - 0.62, -0.08, 0.4, 2.75, 0.4, H0, H1); fr.rotation.z = s * -0.05;
  }
  for (let i = 0; i < 4; i++){   // wavy ends at the back
    const x = (i - 1.5) * 0.24;
    hairPiece(headG, S(0.16, 14, 10), x, HY - 1.2 + Math.abs(x) * 0.12, 0.3, 1, 1.1, 0.75, H0, H1);
  }
  // face
  const ink = flat(0x241812), white = flat(0xffffff), lip = flat(0xc96a6a), mouthDark = flat(0x6e2626);
  const eyes = [], glints = [], brows = [];
  for (const s of [-1, 1]){
    const e = part(headG, S(0.085, 16, 12), ink, s * 0.19, HY + 0.01, -0.46, true); e.scale.set(1.35, 1.0, 0.45); eyes.push(e);
    glints.push(part(headG, S(0.026, 8, 6), white, s * 0.19 - 0.035, HY + 0.045, -0.5, true));

function buildAvatar(custom){
  custom = custom || DEFAULT_CUSTOM;
  if (custom.hero !== 'custom') return buildEddieAvatar(custom);   // everyone plays as Eddie
  // Q 版 storybook body: big round head, small round body, stubby limbs.
  // Face points toward -z. Arms/legs are pivot groups at the shoulder/hip so
  // the main loop's rotation.x swings them naturally.
  const g = new THREE.Group();
  const isFem = custom.gender === 'female';
  const M = c => new THREE.MeshLambertMaterial({ color: c });
  const flat = c => new THREE.MeshBasicMaterial({ color: c });

    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);

  };

  torso.scale.set(isFem ? 0.9 : 1.0, 1.1, isFem ? 0.82 : 0.88);
  // Head
  const HEAD_Y = 2.25, HEAD_R = 0.85;
  part(new THREE.SphereGeometry(HEAD_R, 32, 22), skin, 0, HEAD_Y, 0);

  // Face (unlit flat colours, no outline)
  const eyeMat = flat(0x2a1d18), glint = flat(0xffffff), blush = flat(isFem ? 0xff9fb4 : 0xffb3a8);
  for (const s of [-1, 1]){
    const e = part(new THREE.SphereGeometry(0.14, 16, 12), eyeMat, s * 0.29, 2.22, -0.76, g, true);
    e.scale.set(1, 1.35, 0.5);
    part(new THREE.SphereGeometry(0.05, 8, 6), glint, s * 0.29 - 0.045, 2.31, -0.83, g, true);
    if (isFem){
      const lash = part(new THREE.BoxGeometry(0.1, 0.03, 0.03), eyeMat, s * 0.42, 2.37, -0.72, g, true);
      lash.rotation.z = s * -0.5;
    }
    const b = part(new THREE.SphereGeometry(0.11, 12, 8), blush, s * 0.5, 2.03, -0.66, g, true);
    b.scale.set(1, 0.55, 0.35);
  }
  if (custom.expression === 'smile'){
    const smile = part(new THREE.TorusGeometry(0.12, 0.028, 6, 14, Math.PI), flat(0x8a3a2a), 0, 2.02, -0.82, g, true);
    smile.rotation.z = Math.PI;
  } else {
    const m = part(new THREE.SphereGeometry(0.08, 10, 6), flat(0x3a2a22), 0, 1.98, -0.83, g, true);
    m.scale.set(1.3, 0.35, 0.4);
  }

  // Hair
  const hairParts = [];
  const capGeo = new THREE.SphereGeometry(HEAD_R + 0.06, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.55);
  const addCap = () => { const c = part(capGeo, hair, 0, HEAD_Y + 0.02, 0); c.rotation.x = 0.42; return c; };
  if (custom.hair === 'short'){
    addCap();
    part(new THREE.SphereGeometry(0.34, 16, 12), hair, 0, HEAD_Y - 0.12, 0.62);
  } else if (custom.hair === 'cap'){
    const c = part(new THREE.SphereGeometry(HEAD_R + 0.07, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, HEAD_Y + 0.05, 0);
    c.rotation.x = 0.12;
    const brim = part(new THREE.CylinderGeometry(0.62, 0.62, 0.08, 24, 1, false, Math.PI * 0.5, Math.PI), hair, 0, HEAD_Y + 0.28, -0.55);
    brim.rotation.x = -0.12;
    part(new THREE.SphereGeometry(0.09, 10, 8), hair, 0, HEAD_Y + 0.93, 0, g, true);
  } else if (custom.hair === 'spiky'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const spikeGroup = new THREE.Group();
      spikeGroup.position.set(i * 0.34, HEAD_Y + 0.72 - Math.abs(i) * 0.12, 0.05);
      spikeGroup.rotation.z = -i * 0.35;
      part(new THREE.ConeGeometry(0.2, 0.55, 12), hair, 0, 0.24, 0, spikeGroup);
      g.add(spikeGroup);
      hairParts.push({ group: spikeGroup, type: 'spike' });
    }
  } else if (custom.hair === 'long'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const strandGroup = new THREE.Group();
      strandGroup.position.set(i * 0.32, HEAD_Y + 0.35, 0.62);
      const st = part(new THREE.SphereGeometry(0.2, 14, 10), hair, 0, -0.6, 0, strandGroup);
      st.scale.set(1, 3.2, 0.7);
      g.add(strandGroup);

  // Legs (pivot at hip)
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.24, 0.62, 0); g.add(l);

    return l;
  });
  // Arms (pivot at shoulder)
  const armOff = isFem ? 0.56 : 0.6;
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * armOff, 1.32, 0); g.add(a);
    part(new THREE.SphereGeometry(0.2, 14, 10), shirt, 0, -0.06, 0, a);
    const arm = part(new THREE.SphereGeometry(0.16, 14, 10), skin, 0, -0.32, 0, a); arm.scale.set(1, 1.9, 1);
    return a;
  });
  // Wooden bat in the right hand
  const bat = part(new THREE.CylinderGeometry(0.13, 0.08, 0.95, 12), M(0xc08a4a), 0, -0.95, -0.05, arms[1]);

    const bag = makeBagMesh((custom.cosmetics && custom.cosmetics.bag) || '');
    bag.position.set(0, 1.08, 0.55); g.add(bag);
  }

  attachCosmetics(g, custom.cosmetics);
  return { group: g, legL: legs[0], legR: legs[1], armL: arms[0], armR: arms[1], hairParts };
}

  function tone(type, f0, f1, dur, vol, delay){ if (!on || !ctx()) return; const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05); }
  return {
    get on(){ return on; }, toggle(){ on = !on; try { localStorage.setItem('race.sound', on ? 'on' : 'off'); } catch (e) {} return on; },
    jump: () => tone('square', 330, 660, 0.11, 0.07), spring: () => tone('triangle', 200, 1200, 0.3, 0.12),
    coin: () => { tone('square', 988, 0, 0.06, 0.06); tone('square', 1319, 0, 0.14, 0.06, 0.06); },
    crack: () => tone('sawtooth', 160, 60, 0.25, 0.08), bonk: () => tone('sine', 160, 60, 0.2, 0.3),
    cp: () => [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, 0, 0.25, 0.09, i * 0.08)),
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('square', f, 0, i === 6 ? 0.8 : 0.14, 0.07, i * 0.13)),
    wind: () => tone('sawtooth', 120, 80, 1.0, 0.03),
  };
})();
$('soundBtn').textContent = sfx.on ? '🔊' : '🔇';
$('soundBtn').onclick = () => { $('soundBtn').textContent = sfx.toggle() ? '🔊' : '🔇'; };

// ---------- account (same as the other levels): coins + checkpoint ----------
const ON_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname), ON_LIVE = /github\.io$/.test(location.hostname);
const API = ON_LOCAL ? 'http://localhost:1999/parties/main/global' : ON_LIVE ? 'https://etfm.cooldragon313.workers.dev/parties/main/global' : '';
const token = () => { try { return localStorage.getItem('etfm-token') || ''; } catch (e) { return ''; } };
const who = () => { try { return localStorage.getItem('etfm-username') || 'guest'; } catch (e) { return 'guest'; } };
const CP_KEY = () => 'etfm-tower-cp-' + who();
function savedCp(){ try { return +localStorage.getItem(CP_KEY()) || 0; } catch (e) { return 0; } }
function storeCp(n){ try { if (n > savedCp()) localStorage.setItem(CP_KEY(), String(n)); } catch (e) {} }
let claimFrom = 0, claimAt = 0;     // floors [claimFrom+1 .. S.best] not yet paid
async function claim(){
  const to = S.best, from = claimFrom;
  if (to <= from) return null;
  if (!API || !token()) return { offline: true, coins: (to - from) * 10 };
  const secs = (performance.now() - claimAt) / 1000;
  try {
    const r = await fetch(API + '/tower_reward', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() }, body: JSON.stringify({ from, to, secs }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok){ claimFrom = to; claimAt = performance.now(); return j; }
    return { error: j.message || '金幣沒存到' };
  } catch (e){ return { error: '連不上伺服器' }; }
}

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const touch = { L: false, R: false, J: false };
for (const [id, k] of [['tL', 'L'], ['tR', 'R'], ['tJ', 'J']]){
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); touch[k] = true; el.classList.add('on'); el.setPointerCapture(e.pointerId); });
  const up = () => { touch[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}

// ---------- game state ----------
let S = { phase: 'menu', t: 0, best: 0, start: 0, coins: 0, jumpHeld: false, windNext: 0, windDir: 0, windAt: 0, hitCool: 0, cut: 0 };
function startAt(floor){
  const L = plats.find(p => p.kind === 'ledge' && p.floor === floor);
  S = { phase: 'run', t: 0, best: floor, start: floor, coins: 0, jumpHeld: true, windNext: 2, windDir: 0, windAt: 0, hitCool: 0, cut: 0 };
  claimFrom = floor; claimAt = performance.now();
  Object.assign(P, { x: L.x, y: L.y, vx: 0, vy: 0, onGround: true, on: L });
  for (const p of plats){ p.alive = true; p.crumbleAt = 0; p.mesh.visible = true; p.mesh.position.y = p.y; }
  $('startCard').hidden = true; $('endCard').hidden = true;
  flash(floor ? '從 ' + floor + 'F 繼續！' : '出發！目標 101 樓！');
}
function floorOfY(y){ return Math.floor((y + 0.3) / H); }

function step(dt){
  S.t += dt;
  const left = keys.KeyA || keys.ArrowLeft || touch.L, right = keys.KeyD || keys.ArrowRight || touch.R, jump = keys.Space || keys.KeyW || keys.ArrowUp || touch.J;
  const want = (right ? 1 : 0) - (left ? 1 : 0);
  P.vx += (want * RUN - P.vx) * Math.min(1, dt * (P.onGround ? 14 : 5));
  if (want) P.face = want;
  // wind (60F+): warned gusts that shove you sideways
  if (P.y > 60 * H){
    if (S.t > S.windNext - 1 && !S.windDir){ S.windDir = Math.random() < 0.5 ? -1 : 1; S.windAt = S.windNext; flash(S.windDir < 0 ? '⬅️ 🌪 颱風要來了！' : '🌪 颱風要來了！➡️'); sfx.wind(); }
    if (S.windDir && S.t > S.windAt && S.t < S.windAt + 1.3) P.x += S.windDir * 4.5 * dt;
    if (S.windDir && S.t > S.windAt + 1.3){ S.windDir = 0; S.windNext = S.t + 3.5 + Math.random() * 2; }
  }
  // jump (fresh press)
  if (jump && !S.jumpHeld && P.onGround){ P.vy = JUMP_V; P.onGround = false; P.on = null; sfx.jump(); }
  S.jumpHeld = jump;
  // moving platforms
  for (const p of plats){
    if (p.type === 'move'){ const nx = p.x0 + Math.sin(S.t * p.speed + p.ph) * p.range; p.dx = nx - p.x; p.x = nx; p.mesh.position.x = nx; }
    if (p.type === 'crumble' && p.crumbleAt){
      const k = S.t - p.crumbleAt;
      if (k > 0 && p.alive){ p.mesh.position.x = p.x + Math.sin(S.t * 60) * 0.06; }
      if (k > 0.6 && p.alive){ p.alive = false; sfx.crack(); if (P.on === p){ P.on = null; P.onGround = false; } }
      if (!p.alive){ p.mesh.position.y -= dt * (6 + k * 10); }
      if (k > 3.5){ p.alive = true; p.crumbleAt = 0; p.mesh.position.set(p.x, p.y, 0); }
    }
  }
  if (P.on && P.on.dx) P.x += P.on.dx;
  // integrate
  const prevY = P.y;
  P.vy -= GRAV * dt; P.y += P.vy * dt; P.x += P.vx * dt;
  P.x = clamp(P.x, -HALFW + 0.4, HALFW - 0.4);
  // land on platforms from above (one-way: you can jump up through them)
  P.onGround = false;
  if (P.vy <= 0){
    for (const p of plats){
      if (!p.alive) continue;
      if (Math.abs(P.x - p.x) > p.w / 2 + 0.3) continue;
      if (prevY >= p.y - 0.05 && P.y <= p.y){
        P.y = p.y; P.vy = 0; P.onGround = true; P.on = p;
        if (p.type === 'spring'){ P.vy = SPRING_V; P.onGround = false; P.on = null; sfx.spring(); p.springT = S.t; }
        else if (p.type === 'crumble' && !p.crumbleAt){ p.crumbleAt = S.t; }
        break;
      }
    }
  }
  if (!P.onGround && P.on && P.vy <= 0) P.on = null;
  // new floor reached
  const f = P.onGround && P.on && P.on.kind === 'ledge' ? P.on.floor : -1;
  if (f > S.best){
    S.coins += (f - S.best) * 10; S.best = f; sfx.coin();
    if (f % 10 === 0 && f < FLOORS){ storeCp(f); sfx.cp(); flash('🚩 ' + f + 'F 檢查點！下次可以從這裡繼續'); claim(); }
    else if (f < FLOORS) flash(f + 'F　+10 🪙', 0.8);
  }
  if (f === FLOORS && S.phase === 'run') topReached();
  // birds
  for (const b of birds){
    const bx = ((S.t * b.speed + b.ph * 7) % (W + 16)) - (W / 2 + 8), x = b.dir > 0 ? bx : -bx;
    b.g.position.set(x, b.y + Math.sin(S.t * 3 + b.ph) * 0.4, 0.3); b.g.rotation.y = b.dir > 0 ? 0 : Math.PI;
    b.wings.forEach((wg, i) => { wg.rotation.x = Math.sin(S.t * 18 + i * Math.PI) * 0.6; });
    if (S.t > S.hitCool && Math.abs(P.x - x) < 0.9 && Math.abs(P.y + 1 - b.g.position.y) < 1.0){
      S.hitCool = S.t + 1; P.vx = b.dir * 11; P.vy = Math.max(P.vy, 5); P.onGround = false; P.on = null; sfx.bonk(); flash('🐦 被大鳥撞到！');
    }
  }
}

// ---------- the top: grab the lightning rod, King-Kong style ----------
function topReached(){
  S.phase = 'top'; S.cut = 0; sfx.win(); storeCp(FLOORS - 1);
  claim();

}
function poseTop(dt){
  S.cut += dt;
  const e = me.eddie, k = Math.min(1, S.cut / 1.4);
  // climb to the rod tip
  const tipY = topY + 20.2, sx = 0.75;
  P.x += (sx - P.x) * Math.min(1, dt * 3); P.y += ((k < 1 ? topY + 20.2 * k : tipY) - P.y) * Math.min(1, dt * 4);
  me.group.position.set(P.x, P.y, -0.4);
  me.group.rotation.set(0, Math.PI + 0.35, 0.28);     // facing out over the city, leaning away from the rod
  // (turned around, arms[1] is on the rod's side) one hand holds the rod above, the other fist beats the chest
  const [aBeat, aHold] = e.arms;
  aHold.rotation.set(Math.PI - 0.15, 0, 0.5); aHold.userData.elbow.rotation.x = 0.1;
  const beat = Math.abs(Math.sin(S.cut * 9));
  aBeat.rotation.set(1.1 + beat * 0.5, 0, -0.6); aBeat.userData.elbow.rotation.x = 1.8;
  for (const l of e.legs){ l.rotation.x = 0.4; l.userData.knee.rotation.x = -0.7; }
  e.legs[1].rotation.x = -0.3;
  e.head.rotation.x = -0.3; e.face.set(S.cut > 1.6 ? 'laugh' : 'smug');
  if (S.cut > 1.6 && Math.floor(S.cut * 2) !== Math.floor((S.cut - dt) * 2)) fireworks();
  if (S.cut > 1.6 && !S.banner){ S.banner = true; const w = $('win'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); }
  if (S.cut > 7 && !S.ended){ S.ended = true; endCard(true); }   // driven by the animation, not a timer
}
const fw = [];
function fireworks(){
  const colors = [0xff5a4a, 0xffcf5a, 0x6fb3e0, 0x7cc79a, 0xff8fb0];
  const c = colors[(Math.random() * colors.length) | 0], cx = (Math.random() - 0.5) * 30, cy = topY + 14 + Math.random() * 18;
  const g = new THREE.BufferGeometry(), pts = [], vel = [];
  for (let i = 0; i < 60; i++){ pts.push(cx, cy, -6); const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI, s = 6 + Math.random() * 4; vel.push(Math.cos(a) * Math.sin(b) * s, Math.cos(b) * s, Math.sin(a) * Math.sin(b) * s * 0.3); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const m = new THREE.Points(g, new THREE.PointsMaterial({ color: c, size: 0.6, transparent: true })); scene.add(m);
  fw.push({ m, vel, life: 1.6 });
}
function updateFireworks(dt){
  for (let i = fw.length - 1; i >= 0; i--){
    const f = fw[i], a = f.m.geometry.attributes.position; f.life -= dt;
    for (let j = 0; j < a.count; j++){ a.setXYZ(j, a.getX(j) + f.vel[j * 3] * dt, a.getY(j) + f.vel[j * 3 + 1] * dt, a.getZ(j) + f.vel[j * 3 + 2] * dt); f.vel[j * 3 + 1] -= 6 * dt; }
    a.needsUpdate = true; f.m.material.opacity = Math.max(0, f.life / 1.6);
    if (f.life <= 0){ scene.remove(f.m); f.m.geometry.dispose(); fw.splice(i, 1); }
  }
}

// ---------- end / save ----------
async function endCard(won){
  S.phase = 'end';
  const res = await claim();
  $('endTitle').textContent = won ? '🏙️ 101 征服者！' : '存檔了！';
  $('endSub').textContent = '這次從 ' + S.start + 'F 爬到 ' + S.best + 'F，拿到 $' + S.coins;
  const mins = Math.floor(S.t / 60), secs = Math.floor(S.t % 60);
  let line = '花了 ' + mins + ' 分 ' + secs + ' 秒。';
  if (res && res.offline) line += API ? '（先到「逃離土星」登入，金幣才會存進帳號）' : '（試玩版不存金幣）';
  else if (res && res.error) line += '（' + res.error + '）';
  else if (res && res.money != null) line += '金幣已存入帳號（現在 $' + res.money + '）';
  const cp = savedCp();
  line += won ? '　艾迪抓著避雷針大吼：「我是 101 之王！！」' : (cp ? '　下次可以從 ' + cp + 'F 繼續。' : '');
  $('endLine').textContent = line;
  $('againBtn').textContent = won ? '再爬一次' : (cp ? '從 ' + cp + 'F 繼續' : '再爬一次');
  $('endCard').hidden = false;
}
$('quitBtn').onclick = () => { if (S.phase === 'run') endCard(false); };
$('startBtn').onclick = () => startAt(0);
$('contBtn').onclick = () => startAt(savedCp());
$('againBtn').onclick = () => { const cp = savedCp(); startAt(S.best >= FLOORS ? 0 : cp); };
function menu(){
  const cp = savedCp();
  $('contBtn').hidden = !cp; $('contBtn').textContent = '從 ' + cp + 'F 繼續';
  $('loginLine').textContent = !API ? '試玩版：金幣不會存進帳號' : token() ? '金幣會存進你的帳號' : '還沒登入：先到「逃離土星」登入，金幣才會存';
}
menu();
if (ON_LOCAL) window.__tw = { get S(){ return S; }, P, plats, startAt, step, keys, poseTop };   // local testing only
// 🏠 back to 土星之家 (the hub is the front page of eddie-world)
{ const live = ON_LIVE, local = ON_LOCAL;
  document.querySelectorAll('.homeLink').forEach(a => { if (live) a.href = 'https://cooldragon313.github.io/eddie-world/'; else if (!local) a.hidden = true; }); }

// ---------- loop ----------
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(0.033, Math.max(0, (now - last) / 1000)) : 0.016; last = now;
  if (S.phase === 'run') step(dt);
  if (S.phase === 'top') poseTop(dt);
  updateFireworks(dt);
  // Eddie
  if (S.phase !== 'top'){
    me.group.position.set(P.x, P.y, 0);
    me.group.rotation.set(0, P.face > 0 ? -1.15 : 1.15, 0);
    const moving = P.onGround && Math.abs(P.vx) > 0.6;
    if (moving) P.phase += dt * Math.abs(P.vx) * 1.6;
    animateEddie(me, { t: now / 1000, dt, moving, phase: P.phase, onGround: P.onGround, mood: P.y > 60 * H ? 'surprised' : 'smile' });
  }
  for (const p of plats) if (p.springTop){ const k = S.t - (p.springT || -9); p.springTop.position.y = k < 0.25 ? 0.8 : 0.5; }
  // HUD
  $('hFloor').textContent = Math.max(S.best, 0) || 1; $('hCoins').textContent = S.coins;
  $('hTime').textContent = Math.floor(S.t / 60) + ':' + String(Math.floor(S.t % 60)).padStart(2, '0');
  // sky by height
  scene.background.copy(skyAt(clamp(P.y / topY, 0, 1)));
  // camera follows (side view); at the top it swings around for the pose
  const portrait = innerWidth < innerHeight;
  if (S.phase === 'top' || (S.phase === 'end' && S.best >= FLOORS)){
    // close on the pose, then pull back slowly to show the whole city below
    const a = 0.5 + Math.sin(S.cut * 0.35) * 0.45, r = 6 + Math.min(10, Math.max(0, S.cut - 2.5) * 2);
    camera.position.set(P.x + Math.sin(a) * r, P.y + 0.8 + r * 0.12, -0.4 + Math.cos(a) * r); camera.lookAt(P.x, P.y + 0.6, -0.4);
  } else {
    const cy = P.y + (portrait ? 3.0 : 2.2), cx = P.x * (portrait ? 0.75 : 0.5);
    camera.position.set(cx, cy + 1.2, portrait ? 15 : 15); camera.lookAt(cx * 0.9, cy, 0);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
