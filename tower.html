// ============================================================
const SB_INK = 0x5b3a29;
const SB_RAMP = (() => {
  const steps = [115, 165, 210, 240], d = new Uint8Array(steps.length * 3);
  steps.forEach((v, i) => d.fill(v, i * 3, i * 3 + 3));
  const t = new THREE.DataTexture(d, steps.length, 1, THREE.RGBFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();
function sbTint(c){ return new THREE.Color(c).offsetHSL(0, -0.10, -0.03); }
(() => {
  const Toon = THREE.MeshToonMaterial;
  function StorybookLambert(p){
    p = Object.assign({}, p || {});
    if (p.color !== undefined) p.color = sbTint(p.color);
    delete p.reflectivity; delete p.combine; delete p.envMap;
    return new Toon(Object.assign({ gradientMap: SB_RAMP }, p));

  THREE.MeshLambertMaterial = StorybookLambert;
})();
const SB_LINE_MAT = new THREE.MeshBasicMaterial({ color: SB_INK, side: THREE.BackSide });
const _sbSize = new THREE.Vector3();
// Inverted-hull outline: a slightly larger back-face copy in ink colour.
// Per-axis scale keeps the line the same thickness on long thin boxes.
// Rounded box: a segmented box whose corners are pushed onto spheres.
function sbRoundBox(w, h, d, r, s){
  s = s || 3; r = Math.min(r, w/2 - 1e-3, h/2 - 1e-3, d/2 - 1e-3);
  const g = new THREE.BoxGeometry(w, h, d, s, s, s);
  const p = g.attributes.position, n = g.attributes.normal;
  const v = new THREE.Vector3(), c = new THREE.Vector3(), k = new THREE.Vector3();
  const hx = w/2 - r, hy = h/2 - r, hz = d/2 - r;
  const cl = (x, a) => Math.max(-a, Math.min(a, x));
  for (let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    c.set(cl(v.x, hx), cl(v.y, hy), cl(v.z, hz));
    k.subVectors(v, c); if (k.lengthSq() < 1e-12) continue;
    k.normalize(); v.copy(c).addScaledVector(k, r);
    p.setXYZ(i, v.x, v.y, v.z); n.setXYZ(i, k.x, k.y, k.z);

}
function sbOutline(root, t){
  t = t || 0.04;
  root.traverse(o => {
    if (!o.isMesh || o.userData.sbLine || o.userData.sbHasLine || o.userData.noLine) return;
    const m = o.material, g = o.geometry;

    hull.scale.set(k(_sbSize.x), k(_sbSize.y), k(_sbSize.z));
    hull.raycast = () => {};
    o.add(hull);
    o.userData.sbHasLine = true;
  });

}

function makeBagMesh(id){
  const skin = BAG_SKINS[id] || BAG_SKINS[''];
  const g = new THREE.Group();
  const M = c => new THREE.MeshLambertMaterial({ color: c, ...(skin.extra === 'shine' ? { emissive: 0x553300 } : {}) });
  g.add(new THREE.Mesh(sbRoundBox(0.66, 0.7, 0.32, 0.12), M(skin.color)));
  const flap = new THREE.Mesh(sbRoundBox(0.6, 0.3, 0.1, 0.06), M(skin.flap));
  flap.position.set(0, 0.2, 0.17); g.add(flap);
  const pocket = new THREE.Mesh(sbRoundBox(0.4, 0.22, 0.08, 0.05), M(skin.flap));
  pocket.position.set(0, -0.15, 0.17); g.add(pocket);
  if (skin.extra === 'spikes'){
    for (let i = 0; i < 3; i++){ const c = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.2, 8), M(0xf0e070)); c.position.set(0, 0.32 - i * 0.22, 0.2); c.rotation.x = Math.PI / 2; g.add(c); }
  } else if (skin.extra === 'ears'){
    for (const s of [-1, 1]){ const e = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 8), M(skin.flap)); e.position.set(s * 0.24, 0.38, 0); g.add(e); }
  } else if (skin.extra === 'seeds'){
    for (const [x, y] of [[-0.15, -0.02], [0.12, 0.05], [0.02, -0.25], [-0.2, -0.28], [0.2, -0.22]]){ const d = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 4), new THREE.MeshBasicMaterial({ color: 0x2a1d18 })); d.position.set(x, y, 0.17); g.add(d); }
  } else if (skin.extra === 'fin'){
    const f = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.34, 3), M(skin.color)); f.position.set(0, 0.48, 0); g.add(f);
  }
  return g;
}
for (const [id, b] of Object.entries(BAG_SKINS)){
  if (!id) continue;
  COSMETICS.push({ id, slot: 'bag', name: b.name, price: ({ bag_dino:80, bag_bear:100, bag_melon:60, bag_shark:150, bag_gold:300 })[id], build: () => makeBagMesh(id) });

const COSMETICS_BY_ID = Object.fromEntries(COSMETICS.map(c => [c.id, c]));

function attachCosmetics(group, cosmetics){
  if (!cosmetics) return;
  for (const slot of ['hat','face','back','accessory']){
    const id = cosmetics[slot];
    if (!id) continue;
    const def = COSMETICS_BY_ID[id];
    if (!def) continue;
    const m = def.build();
    const off = COSMETIC_OFFSETS[slot], tw = COSMETIC_TWEAKS[id] || {};
    m.position.set((off.x ?? 0) + (tw.x ?? 0), (off.y ?? 0) + (tw.y ?? 0), (off.z ?? 0) + (tw.z ?? 0));
    if (tw.s) m.scale.setScalar(tw.s);
    group.add(m);
  }
}

// from this (buildAvatar diverts here unless custom.hero === 'custom').

const buildEddie = (() => {
  const LM = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  function part(parent, geo, mat, x, y, z, noLine){ const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (noLine) m.userData.noLine = true; parent.add(m); return m; }
  const S = (r, w, h) => new THREE.SphereGeometry(r, w || 24, h || 16);
  // Galaxy print for the backpack
  function galaxyTex(){
    const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 128, 128); g.addColorStop(0, '#1c2a6b'); g.addColorStop(0.5, '#3a3d9a'); g.addColorStop(1, '#1b6f8f');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 40; i++){ x.fillStyle = Math.random() < 0.3 ? '#ffe9a8' : '#ffffff'; const s = Math.random() * 2.2 + 0.6; x.fillRect(Math.random() * 128, Math.random() * 128, s, s); }
    x.fillStyle = 'rgba(120,220,255,.35)'; x.beginPath(); x.ellipse(70, 60, 40, 14, -0.6, 0, 6.3); x.fill();
    const t = new THREE.CanvasTexture(c); return t;
  }

  // ---------- Eddie (Q 版 · 繪本), faces -z ----------
  const SKIN = 0xf6cdb4, HAIR = 0x1f1a1a;
  function buildEddie(){
    const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
    const skin = LM(SKIN), hair = LM(HAIR), tee = LM(0xf7f6f0), shorts = LM(0x6e7046), sock = LM(0x2a2a2a), shoe = LM(0xf2f2ee), sole = LM(0xc9c9c2);
    const HY = 2.25, NECK = 1.55;
    const headG = new THREE.Group(); headG.position.y = NECK; body.add(headG);
    const partH = (geo, mat, x, y, z, nl) => part(headG, geo, mat, x, y - NECK, z, nl);
    // head: round, a touch wider than tall
    const head = partH(S(0.86, 32, 22), skin, 0, HY, 0); head.scale.set(1.04, 0.98, 1);
    for (const s of [-1, 1]){ const ear = partH(S(0.19, 14, 10), skin, s * 0.9, HY - 0.04, 0.05); ear.scale.set(0.5, 1, 0.8); }
    // hair: one black shell hugging the head (no second layer = no hat brim);
    // short on the sides just by being skin-tight, length only from the tufts on top
    const shellGeo = new THREE.SphereGeometry(0.875, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.56);
    // Fade: black on top blending smoothly into short grey stubble on the sides
    // and back — a gradient in the vertex colours, so there's no seam or "brim".
    {
      const top = new THREE.Color(HAIR), side = new THREE.Color(0x8a7569), c = new THREE.Color();
      const pa = shellGeo.attributes.position, cols = new Float32Array(pa.count * 3);
      for (let i = 0; i < pa.count; i++){
        const y = pa.getY(i) / 0.875;                       // 1 at the crown, ~0 at the edge
        const k = Math.min(1, Math.max(0, (y - 0.35) / 0.35));
        const t = k * k * (3 - 2 * k);
        c.copy(side).lerp(top, t); cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
      }
      shellGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    }
    const shell = partH(shellGeo, LM(0xffffff, { vertexColors: true }), 0, HY + 0.0, 0.04); shell.rotation.x = 0.32; shell.scale.set(1.045, 0.99, 1.01);
    const hairSpikes = [];
    const tufts = [];
    for (let row = 0; row < 3; row++){
      const n = [5, 6, 5][row], z = [-0.42, -0.05, 0.32][row], y = [0.66, 0.76, 0.7][row];
      for (let i = 0; i < n; i++){
        const x = (i - (n - 1) / 2) * 0.2 * (row === 1 ? 1.05 : 1);
        const front = row === 0, mid = Math.abs(x) < 0.15;
        const centre = 1 - Math.min(1, Math.abs(x) / 0.55);      // 1 in the middle, 0 at the sides
        tufts.push([x, y + 0.1 - Math.abs(x) * 0.3, z, front ? 0.15 : 0.16, (front ? 0.36 : 0.3) + centre * 0.26, front ? -0.4 : row === 1 ? -0.12 : 0.32]);
      }
    }
    for (const [x, y, z, r, h, tilt] of tufts){
      const pivot = new THREE.Group(); pivot.position.set(x, HY + y - 0.12 - NECK, z); pivot.rotation.x = tilt; pivot.rotation.z = x * 0.75;
      part(pivot, new THREE.ConeGeometry(r, h, 8), hair, 0, h / 2 - 0.06, 0, true);
      headG.add(pivot); hairSpikes.push(pivot);
    }
    // face
    const ink = flat(0x22180f), white = flat(0xffffff);
    const eyes = [], brows = [], glints = [];
    for (const s of [-1, 1]){
      const brow = partH(sbRoundBox(0.26, 0.07, 0.05, 0.03), ink, s * 0.3, HY + 0.24, -0.79, true); brow.rotation.z = s * -0.12;
      const eye = partH(S(0.12, 16, 12), ink, s * 0.29, HY + 0.02, -0.78, true); eye.scale.set(1, 1.05, 0.5);
      const gl = partH(S(0.04, 8, 6), white, s * 0.29 - 0.04, HY + 0.07, -0.84, true);
      eyes.push(eye); brows.push(brow); glints.push(gl);
      const cheek = partH(S(0.11, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffb3a8, transparent: true, opacity: 0.8 }), s * 0.52, HY - 0.15, -0.66, true);
      cheek.scale.set(1, 0.55, 0.35);
    }
    partH(S(0.06, 10, 8), LM(0xe8b48f), 0, HY - 0.1, -0.85, true);                 // nose
    const mouth = partH(new THREE.CircleGeometry(0.17, 20, Math.PI, Math.PI), flat(0x7a2a2a), 0, HY - 0.26, -0.845, true);   // big open smile
    mouth.scale.set(1.15, 0.95, 1); mouth.rotation.y = Math.PI;
    const teeth = partH(new THREE.PlaneGeometry(0.3, 0.06), white, 0, HY - 0.275, -0.85, true); teeth.rotation.y = Math.PI;    // top teeth
    const tongue = partH(new THREE.CircleGeometry(0.07, 14, Math.PI, Math.PI), flat(0xf08a8a), 0, HY - 0.38, -0.849, true);
    tongue.scale.set(1.3, 0.8, 1); tongue.rotation.y = Math.PI;
    // other expressions, hidden until used
    const mouthO = partH(new THREE.CircleGeometry(0.1, 18), flat(0x7a2a2a), 0, HY - 0.3, -0.845, true); mouthO.rotation.y = Math.PI; mouthO.scale.set(0.9, 1.25, 1);
    const mouthSad = partH(new THREE.TorusGeometry(0.11, 0.025, 6, 14, Math.PI), flat(0x7a2a2a), 0, HY - 0.33, -0.84, true);
    const mouthSmug = partH(new THREE.TorusGeometry(0.1, 0.025, 6, 14, Math.PI * 0.7), flat(0x7a2a2a), 0.06, HY - 0.24, -0.845, true); mouthSmug.rotation.z = Math.PI * 1.15;
    const happyEyes = [-1, 1].map(s => { const m = partH(new THREE.TorusGeometry(0.09, 0.028, 6, 14, Math.PI), ink, s * 0.29, HY - 0.0, -0.8, true); return m; });
    const tears = [-1, 1].map(s => { const m = partH(S(0.05, 10, 8), new THREE.MeshBasicMaterial({ color: 0x8fd0f0 }), s * 0.34, HY - 0.1, -0.8, true); m.scale.set(0.8, 1.4, 0.5); return m; });
    for (const m of [mouthO, mouthSad, mouthSmug, ...happyEyes, ...tears]) m.visible = false;
    const smileSet = [mouth, teeth, tongue];
    let expr = 'smile', blinkK = 0;
    function applyEyes(){
      const happy = expr === 'laugh', smug = expr === 'smug', surprised = expr === 'surprised';
      eyes.forEach(e => { e.visible = !happy; e.scale.set(surprised ? 1.15 : 1, (smug ? 0.5 : surprised ? 1.3 : 1.05) * (1 - blinkK * 0.92), 0.5); });
      glints.forEach(gl => gl.visible = !happy && blinkK < 0.5);
      happyEyes.forEach(m => m.visible = happy);
      brows.forEach((b, i) => { const s = i ? 1 : -1; b.position.y = HY + 0.24 - NECK + (surprised ? 0.07 : smug ? (s > 0 ? 0.05 : 0) : expr === 'sad' ? -0.02 : 0); b.rotation.z = s * (expr === 'sad' ? 0.25 : -0.12); });
    }
    const faceCtl = {
      set(name){
        expr = name;
        smileSet.forEach(m => m.visible = name === 'smile' || name === 'laugh');
        mouthO.visible = name === 'surprised'; mouthSad.visible = name === 'sad'; mouthSmug.visible = name === 'smug';
        tears.forEach(m => m.visible = name === 'sad');
        applyEyes();
      },
      blink(k){ blinkK = k; applyEyes(); },
      get name(){ return expr; },
      tears,
    };
    // body: white tee
    const torso = part(body, S(0.6, 24, 16), tee, 0, 1.0, 0); torso.scale.set(1.0, 1.08, 0.88);
    part(body, new THREE.CylinderGeometry(0.2, 0.24, 0.12, 16), tee, 0, 1.6, 0);          // collar
    // shorts (hips)
    const hips = part(body, S(0.5, 20, 12), shorts, 0, 0.72, 0); hips.scale.set(1.08, 0.55, 0.9);
    // arms (pivot at shoulder); wristband on the left
    const arms = [-1, 1].map(s => {
      const a = new THREE.Group(); a.position.set(s * 0.6, 1.34, 0); body.add(a);
      part(a, S(0.22, 14, 10), tee, 0, -0.06, 0);
      const upper = part(a, S(0.15, 14, 10), skin, 0, -0.2, 0); upper.scale.set(1, 1.15, 1);
      const elbow = new THREE.Group(); elbow.position.y = -0.34; a.add(elbow);
      const fore = part(elbow, S(0.14, 14, 10), skin, 0, -0.13, 0); fore.scale.set(1, 1.15, 1);
      part(elbow, S(0.13, 12, 10), skin, 0, -0.29, 0);   // hand
      if (s < 0){ const band = part(elbow, new THREE.TorusGeometry(0.13, 0.04, 8, 16), LM(0xffffff), 0, -0.17, 0); band.rotation.x = Math.PI / 2; }
      a.userData.elbow = elbow;
      return a;
    });
    // legs: shorts → shin → black sock → white sneaker
    const legs = [-1, 1].map(s => {
      const l = new THREE.Group(); l.position.set(s * 0.25, 0.66, 0); body.add(l);
      const thigh = part(l, S(0.24, 14, 10), shorts, 0, -0.1, 0); thigh.scale.set(1, 1.15, 1);
      const knee = new THREE.Group(); knee.position.y = -0.24; l.add(knee);
      const shin = part(knee, S(0.15, 14, 10), skin, 0, -0.06, 0); shin.scale.set(1, 1.2, 1);
      part(knee, new THREE.CylinderGeometry(0.14, 0.14, 0.1, 14), sock, 0, -0.22, 0);

// Eddie's body language, shared by every level. Call once per frame after
// placing him; it owns legs/knees/elbows/lean/head/face, the caller keeps
// overall position, facing and any special arm pose (bat swing) applied after.
//   o = { t, dt, moving, phase, onGround, down, victory, swinging }
function animateEddie(A, o){
  const e = A && A.eddie; if (!e) return;
  const st = A._anim || (A._anim = { blinkAt: 2, blinkT: -1, mood: '' });
  const [armL, armR] = e.arms, [legL, legR] = e.legs;
  const eL = armL.userData.elbow, eR = armR.userData.elbow, kL = legL.userData.knee, kR = legR.userData.knee;
  for (const j of [legL, legR, kL, kR, eL, eR, e.head]) j.rotation.set(0, 0, 0);
  e.body.rotation.set(0, 0, 0); e.body.position.set(0, 0, 0);
  armL.rotation.z = -0.14; armR.rotation.z = 0.14;
  const t = o.t || 0, p = o.phase || 0, breath = Math.sin(t * 2.1);
  e.torso.scale.set(1 + breath * 0.012, 1.08 + breath * 0.02, 0.88 + breath * 0.01);
  if (o.victory){
    const b = Math.sin(t * 9), up = Math.abs(Math.sin(t * 4.5));
    armL.rotation.x = armR.rotation.x = 0; armL.rotation.z = -2.4 - b * 0.3; armR.rotation.z = 2.4 - b * 0.3;
    eL.rotation.x = eR.rotation.x = 0.6; e.body.rotation.z = b * 0.15; e.head.rotation.z = -b * 0.18;
    legL.rotation.z = -0.15; legR.rotation.z = 0.15; kL.rotation.x = -up * 0.6; kR.rotation.x = -(1 - up) * 0.6;
    e.body.position.y = up * 0.25;
  } else if (o.onGround === false){
    // airborne: tuck the legs, arms out for balance
    legL.rotation.x = 0.45; legR.rotation.x = -0.1; kL.rotation.x = -0.9; kR.rotation.x = -0.5;
    armL.rotation.z = -1.6; armR.rotation.z = 1.6; eL.rotation.x = eR.rotation.x = 0.4;
  } else if (o.moving){
    const sw = Math.sin(p) * 0.85;
    legL.rotation.x = sw; legR.rotation.x = -sw;
    kL.rotation.x = -(Math.max(0, Math.cos(p)) * 1.2 + 0.1);   // the leg swinging forward folds back at the knee
    kR.rotation.x = -(Math.max(0, -Math.cos(p)) * 1.2 + 0.1);
    armL.rotation.x = -sw; armR.rotation.x = sw;
    eL.rotation.x = eR.rotation.x = 1.1;                         // pumping, bent arms
    e.body.rotation.x = -0.16; e.body.rotation.y = sw * 0.1; e.head.rotation.x = 0.1;
    e.body.position.y = Math.abs(Math.cos(p)) * 0.1;
  } else {
    armL.rotation.x = armR.rotation.x = 0;
    eL.rotation.x = eR.rotation.x = 0.25;
    e.body.rotation.z = Math.sin(t * 0.9) * 0.02;
  }
  if (o.swinging){ eR.rotation.x = 0.15; eL.rotation.x = 0.3; }
  if (o.down){ e.body.rotation.x = 0.3; e.head.rotation.x = -0.25; }
  // face: knocked down = startled, winning = big laugh, otherwise a smile; blink now and then
  const mood = o.down ? 'surprised' : o.victory ? 'laugh' : (o.mood || 'smile');
  if (mood !== st.mood){ st.mood = mood; e.face.set(mood); }
  st.blinkAt -= o.dt || 0.016;
  if (st.blinkAt <= 0 && st.blinkT < 0){ st.blinkT = 0; st.blinkAt = 2.5 + Math.random() * 3; }
  if (st.blinkT >= 0){ st.blinkT += o.dt || 0.016; e.face.blink(Math.sin(Math.min(1, st.blinkT / 0.16) * Math.PI)); if (st.blinkT > 0.16){ st.blinkT = -1; e.face.blink(0); } }
}

function buildAvatar(custom){
  custom = custom || DEFAULT_CUSTOM;
  if (custom.hero !== 'custom') return buildEddieAvatar(custom);   // everyone plays as Eddie
  // Q 版 storybook body: big round head, small round body, stubby limbs.
  // Face points toward -z. Arms/legs are pivot groups at the shoulder/hip so
  // the main loop's rotation.x swings them naturally.
  const g = new THREE.Group();
  const isFem = custom.gender === 'female';
  const M = c => new THREE.MeshLambertMaterial({ color: c });
  const flat = c => new THREE.MeshBasicMaterial({ color: c });
  const part = (geo, mat, x, y, z, parent, noLine) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    if (noLine) m.userData.noLine = true;
    (parent || g).add(m); return m;
  };
  const skin = M(custom.skin), shirt = M(custom.shirt), pants = M(custom.pants),
        shoes = M(custom.shoes), hair = M(custom.hairColor);

  // Body
  const torso = part(new THREE.SphereGeometry(0.58, 24, 16), shirt, 0, 1.0, 0);
  torso.scale.set(isFem ? 0.9 : 1.0, 1.1, isFem ? 0.82 : 0.88);
  // Head
  const HEAD_Y = 2.25, HEAD_R = 0.85;
  part(new THREE.SphereGeometry(HEAD_R, 32, 22), skin, 0, HEAD_Y, 0);

  // Face (unlit flat colours, no outline)
  const eyeMat = flat(0x2a1d18), glint = flat(0xffffff), blush = flat(isFem ? 0xff9fb4 : 0xffb3a8);
  for (const s of [-1, 1]){
    const e = part(new THREE.SphereGeometry(0.14, 16, 12), eyeMat, s * 0.29, 2.22, -0.76, g, true);
    e.scale.set(1, 1.35, 0.5);
    part(new THREE.SphereGeometry(0.05, 8, 6), glint, s * 0.29 - 0.045, 2.31, -0.83, g, true);
    if (isFem){
      const lash = part(new THREE.BoxGeometry(0.1, 0.03, 0.03), eyeMat, s * 0.42, 2.37, -0.72, g, true);
      lash.rotation.z = s * -0.5;
    }
    const b = part(new THREE.SphereGeometry(0.11, 12, 8), blush, s * 0.5, 2.03, -0.66, g, true);
    b.scale.set(1, 0.55, 0.35);
  }
  if (custom.expression === 'smile'){
    const smile = part(new THREE.TorusGeometry(0.12, 0.028, 6, 14, Math.PI), flat(0x8a3a2a), 0, 2.02, -0.82, g, true);
    smile.rotation.z = Math.PI;
  } else {
    const m = part(new THREE.SphereGeometry(0.08, 10, 6), flat(0x3a2a22), 0, 1.98, -0.83, g, true);
    m.scale.set(1.3, 0.35, 0.4);
  }

  // Hair
  const hairParts = [];
  const capGeo = new THREE.SphereGeometry(HEAD_R + 0.06, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.55);
  const addCap = () => { const c = part(capGeo, hair, 0, HEAD_Y + 0.02, 0); c.rotation.x = 0.42; return c; };
  if (custom.hair === 'short'){
    addCap();
    part(new THREE.SphereGeometry(0.34, 16, 12), hair, 0, HEAD_Y - 0.12, 0.62);
  } else if (custom.hair === 'cap'){
    const c = part(new THREE.SphereGeometry(HEAD_R + 0.07, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0, HEAD_Y + 0.05, 0);
    c.rotation.x = 0.12;
    const brim = part(new THREE.CylinderGeometry(0.62, 0.62, 0.08, 24, 1, false, Math.PI * 0.5, Math.PI), hair, 0, HEAD_Y + 0.28, -0.55);
    brim.rotation.x = -0.12;
    part(new THREE.SphereGeometry(0.09, 10, 8), hair, 0, HEAD_Y + 0.93, 0, g, true);
  } else if (custom.hair === 'spiky'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const spikeGroup = new THREE.Group();
      spikeGroup.position.set(i * 0.34, HEAD_Y + 0.72 - Math.abs(i) * 0.12, 0.05);
      spikeGroup.rotation.z = -i * 0.35;
      part(new THREE.ConeGeometry(0.2, 0.55, 12), hair, 0, 0.24, 0, spikeGroup);
      g.add(spikeGroup);
      hairParts.push({ group: spikeGroup, type: 'spike' });
    }
  } else if (custom.hair === 'long'){
    addCap();
    for (let i = -1; i <= 1; i++){
      const strandGroup = new THREE.Group();
      strandGroup.position.set(i * 0.32, HEAD_Y + 0.35, 0.62);
      const st = part(new THREE.SphereGeometry(0.2, 14, 10), hair, 0, -0.6, 0, strandGroup);
      st.scale.set(1, 3.2, 0.7);
      g.add(strandGroup);
      hairParts.push({ group: strandGroup, type: 'strand' });
    }
  }

  // Legs (pivot at hip)
  const legs = [-1, 1].map(s => {
    const l = new THREE.Group(); l.position.set(s * 0.24, 0.62, 0); g.add(l);
    const leg = part(new THREE.SphereGeometry(0.2, 14, 10), pants, 0, -0.22, 0, l); leg.scale.set(1, 1.5, 1);
    const shoe = part(new THREE.SphereGeometry(0.23, 14, 10), shoes, 0, -0.5, -0.07, l); shoe.scale.set(1.1, 0.6, 1.35);
    return l;
  });
  // Arms (pivot at shoulder)
  const armOff = isFem ? 0.56 : 0.6;
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * armOff, 1.32, 0); g.add(a);
    part(new THREE.SphereGeometry(0.2, 14, 10), shirt, 0, -0.06, 0, a);
    const arm = part(new THREE.SphereGeometry(0.16, 14, 10), skin, 0, -0.32, 0, a); arm.scale.set(1, 1.9, 1);
    return a;
  });
  // Wooden bat in the right hand
  const bat = part(new THREE.CylinderGeometry(0.13, 0.08, 0.95, 12), M(0xc08a4a), 0, -0.95, -0.05, arms[1]);
  bat.rotation.x = 0.15;
  // Backpack in the chosen bag skin (hidden when a back cosmetic takes its place)
  if (!(custom.cosmetics && custom.cosmetics.back)){
    const bag = makeBagMesh((custom.cosmetics && custom.cosmetics.bag) || '');
    bag.position.set(0, 1.08, 0.55); g.add(bag);
  }

  attachCosmetics(g, custom.cosmetics);
  return { group: g, legL: legs[0], legR: legs[1], armL: arms[0], armR: arms[1], hairParts };
}

    S.cine = (performance.now() - S.cine0) / 1000; introFrame(S.cine); introText(S.cine);   // real time, so a slow phone still gets 15 s
    me.group.position.copy(surf(9, 0.75, 0)); me.group.rotation.set(0, 0, 0);
    animateEddie(me, { t: now, dt, moving: false, onGround: true, mood: 'smug' });
    if (S.cine > 11.5){ const e = me.eddie; e.head.rotation.x = -0.5;          // looks up at the tower, claps the chalk off
      if (S.cine > 13.2 && S.cine < 13.9){ e.arms[0].rotation.set(1.3, 0, 0.5); e.arms[1].rotation.set(1.3, 0, -0.5); } }
    if (S.cine > INTRO) endIntro();
  } else {
    poseEddie(dt, now);
    updateTalk(dt); updateMarker(now);
    // pigeons fly off; the cleaner rides along
    for (const p of plats) if (p.bird && p.bird.fly){ const b = p.bird; b.fly += dt; b.g.position.y += dt * 4; b.g.position.addScaledVector(softNormal(p.s0), dt * 3); b.g.rotation.z = Math.sin(now * 30) * 0.3; if (b.fly > 3) b.g.visible = false; }
    if (S.phase === 'menu'){ const a = now * 0.08; camera.position.set(Math.sin(a) * 80, 60, Math.cos(a) * 80); camera.lookAt(0, 50, 0); }
    else updateCamera(dt);
  }
  // flags flap, people pose and snap photos
  for (const p of plats) if (p.flagMesh){ p.flagMesh.rotation.z = Math.sin(now * 6) * 0.08 + (S.windDir ? Math.sin(now * 20) * 0.2 : 0); p.flagMesh.scale.x = S.windDir ? 1.25 : 1; }
  for (const q of people){
    q.sp.position.y = q.base + Math.abs(Math.sin(now * 2 + q.ph)) * 0.05;
    if (q.photo && Math.abs(q.base - P.y) < 8 && Math.sin(now * 1.7 + q.ph) > 0.985){ if (q.fl.material.opacity < 0.1 && S.phase === 'run') sfx.shutter(); q.fl.material.opacity = 1; }
    q.fl.material.opacity = Math.max(0, q.fl.material.opacity - dt * 4);
  }
  for (const c of chalks) if (c.mesh.visible) c.mesh.children[1].rotation.z += dt * 2;
  // HUD: timecode, altimeter, grip
  const sec = S.phase === 'run' || S.phase === 'end' ? S.t : 0;
  $('tc').textContent = '00:' + String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  $('altM').textContent = Math.round(P.y * METERS);
  $('windTxt').textContent = '風速 ' + (S.windDir && S.t > S.windAt ? 18 : P.y > 30 ? 6 : 2) + ' m/s';
  $('floorTag').textContent = Math.max(1, Math.min(BUILT, floorOf(P.y) || 1)) + 'F';
  $('coinTag').textContent = '🪙 +' + S.coins;
  const gripOn = S.phase === 'run' && (P.mode === 'wall' || P.grip < 99);
  $('grip').classList.toggle('on', gripOn); $('gripLbl').classList.toggle('on', gripOn);
  $('gripFill').style.width = Math.max(0, P.grip) + '%'; $('grip').classList.toggle('low', P.grip < 30);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
